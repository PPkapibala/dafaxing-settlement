function detectSsoIdentity(){
  // 默认识别为系统管理员；可通过 ?sso=xxx URL 参数切换
  const q=new URLSearchParams(location.search);

    ||USER_DB.find(u=>u.account===acc)

}
function renderSsoIdentity(){
  if(!_ssoIdentity)return;
  const u=_ssoIdentity;
  const av=document.getElementById('ssoAvatar');
  const nm=document.getElementById('ssoIdentityName');
  const ac=document.getElementById('ssoIdentityAcc');
  if(av)av.textContent=(u.display||u.account||'?').slice(0,1);
  if(nm)nm.textContent=`${u.display||u.account}${u.role?`　·　${u.role}`:''}`;
  if(ac)ac.textContent=`${u.account}　|　${u.phone||''}`;
}
function switchSsoIdentity(){
  const ssoUsers=USER_DB.filter(u=>u.loginType==='sso');
  const cur=_ssoIdentity?ssoUsers.findIndex(u=>u.account===_ssoIdentity.account):-1;
  _ssoIdentity=ssoUsers[(cur+1)%ssoUsers.length];
  renderSsoIdentity();
}

  if(!_ssoIdentity){showLoginErr('未识别到企业账号，请联系 IT 管理员');return;}
  loginAs(_ssoIdentity);
}
function doLoginSMS(){
  const phone=document.getElementById('smsPhone').value.trim();
  const code=document.getElementById('smsCode').value.trim();
  if(!phone||phone.length!==11){showLoginErr('请输入正确的11位手机号');return;}
  if(!code||code.length<4){showLoginErr('请输入验证码');return;}
  if(code!=='8888'&&code!=='123456'){showLoginErr('验证码错误，演示模式请输入 8888');return;}
  // 按手机号查找或注册新用户
  let u=USER_DB.find(u=>u.phone.replace(/\*/g,'')===phone.replace(/\*/g,'')||u.phone===phone);
  if(!u){
    // 首次登录，新建待授权用户
    const newU={id:'U'+(100+USER_DB.length),account:'user_'+phone.slice(-4),display:'新用户'+phone.slice(-4),phone:phone.slice(0,3)+'****'+phone.slice(-4),loginType:'sms',role:null,dataPerms:[],status:'待授权',lastLogin:new Date().toLocaleString('zh-CN',{hour12:false})};
    USER_DB.push(newU);
    u=newU;
  }
  loginAs(u);
}

        <button class="btn g" style="margin-top:22px" onclick="doLogout()">返回登录</button>
      </div>`;
    return;
  }
  SESSION={userId:u.id,account:u.account,display:u.display,role:u.role,dataPerms:u.dataPerms||['all']};
  ROLE=u.role;
  FILTER_GAME='all';FILTER_ENTITY='all';

    else if(cps.find(c=>c.id===pid))FILTER_ENTITY='cp:'+pid;
  }
  const mask=document.getElementById('loginMask');
  if(mask.classList.contains('show')){mask.classList.remove('show');PAGE=(ROLE_PAGES[ROLE]||[])[0]||'';}
  renderNav();renderPage();renderUserCenter();
}
function sendSmsCode(){
  const phone=document.getElementById('smsPhone').value.trim();
  if(!phone||phone.length!==11){showLoginErr('请先输入正确的11位手机号');return;}
  const btn=document.getElementById('smsSendBtn');
  btn.disabled=true;
  let s=60;
  btn.textContent=s+'s后重发';
  _smsTimer=setInterval(()=>{s--;btn.textContent=s+'s后重发';if(s<=0){clearInterval(_smsTimer);btn.disabled=false;btn.textContent='获取验证码';}},1000);
  showLoginErr('');
  document.getElementById('loginErr').style.display='none';
  // 模拟发送提示
  setTimeout(()=>{const el=document.getElementById('loginErr');el.style.background='#eaf8f0';el.style.borderColor='#9fdfc4';el.style.color='#0f8a4b';el.textContent='验证码已发送（演示模式：请输入 8888）';el.style.display='block';},400);
}

const MASTER_PAGES=['games','publishers','cps','permConfig','userMgmt','cashRev','vRev'];

// 根据 SESSION.dataPerms 计算当前用户可见的发行商/CP/游戏范围
function visibleEntities(){
  const dp=SESSION?.dataPerms||['all'];
  const allPub=dp.includes('all');
  const allCp=dp.includes('all');
  const visiblePubs=allPub?publishers:publishers.filter(p=>dp.includes(p.id)||dp.includes('pub:'+p.id));
  const visibleCps=allCp?cps:cps.filter(c=>dp.includes(c.id)||dp.includes('cp:'+c.id));
  // 可见游戏 = 与可见发行商或CP有关联的游戏
  const visibleGameIds=new Set();
  if(allPub&&allCp){games.forEach(g=>visibleGameIds.add(g.id));}
  else{
    pubMappings.filter(m=>visiblePubs.find(p=>p.id===m.pubId)).forEach(m=>visibleGameIds.add(m.gameId));
    cpMappings.filter(m=>visibleCps.find(c=>c.id===m.cpId)).forEach(m=>visibleGameIds.add(m.gameId));
  }
  const visibleGames=games.filter(g=>visibleGameIds.has(g.id));
  return {visiblePubs,visibleCps,visibleGames};
}

function renderPage(){
  const map={games:pgGames,pubMapping:pgPubMapping,cpMapping:pgCpMapping,publishers:pgPublishers,cps:pgCPs,rules:pgRules,cashRev:pgCashRevDashboard,vRev:pgVRevDashboard,costDashboard:pgCostDashboard,settlePub:pgSettlePub,settleCp:pgSettleCp,balance:pgBalance,payments:pgPayments,sync:pgSync,permConfig:pgPermConfig,userMgmt:pgUserMgmt};
  const pageTitles={games:'游戏管理',pubMapping:'游戏-发行商关系',cpMapping:'游戏-CP关系',publishers:'发行商主体管理',cps:'CP主体管理',rules:'分成规则配置',cashRev:'现金收入看板',vRev:'广告金收入看板',costDashboard:'成本看板',settlePub:'发行商分账明细',settleCp:'CP分账明细',balance:'账户余额池',payments:'打款申请单',sync:'数据同步状态',permConfig:'权限配置',userMgmt:'用户管理'};
  document.getElementById('crumbEl').textContent=pageTitles[PAGE]||PAGE;
  const isMaster=MASTER_PAGES.includes(PAGE);
  const {visiblePubs,visibleCps,visibleGames}=visibleEntities();
  // 游戏筛选（仅显示数据权限内的游戏）
  const gfEl=document.getElementById('gameFilterWrap');
  if(gfEl){
    if(isMaster){gfEl.style.display='none';}
    else{
      gfEl.style.display='flex';
      document.getElementById('gameFilter').innerHTML='<option value="all">全部游戏</option>'+visibleGames.map(g=>`<option value="${g.id}" ${FILTER_GAME===g.id?'selected':''}>${g.name}</option>`).join('');
      // 如只有一个游戏可见且当前是全部，自动选中
      if(visibleGames.length===1&&FILTER_GAME==='all'){FILTER_GAME=visibleGames[0].id;document.getElementById('gameFilter').value=FILTER_GAME;}
    }
  }
  // 主体筛选（仅显示数据权限内的主体）
  const efEl=document.getElementById('entityFilterWrap');
  if(efEl){
    if(isMaster){efEl.style.display='none';}
    else{
      efEl.style.display='flex';
      const pubOpts=visiblePubs.map(p=>`<option value="pub:${p.id}" ${FILTER_ENTITY==='pub:'+p.id?'selected':''}>[发行商] ${p.name}</option>`).join('');
      const cpOpts=visibleCps.map(c=>`<option value="cp:${c.id}" ${FILTER_ENTITY==='cp:'+c.id?'selected':''}>[CP] ${c.name}</option>`).join('');
      const allOpt=visiblePubs.length+visibleCps.length>1?'<option value="all">全部主体</option>':'';
      document.getElementById('entityFilter').innerHTML=allOpt+(pubOpts||cpOpts?`<optgroup label="发行商">${pubOpts}</optgroup><optgroup label="CP">${cpOpts}</optgroup>`:'');
      // 如只有一个主体可见，自动锁定
      if(visiblePubs.length+visibleCps.length===1&&FILTER_ENTITY==='all'){
        FILTER_ENTITY=visiblePubs.length?'pub:'+visiblePubs[0].id:'cp:'+visibleCps[0].id;
        document.getElementById('entityFilter').value=FILTER_ENTITY;
      }
    }
  }
  document.getElementById('contentEl').innerHTML=(map[PAGE]||pgGames)();
}

function addJlRow(mappingId){

  row.style.cssText='display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;background:#fafafa;border:1px solid #eee;cursor:pointer';

// 解析 FILTER_ENTITY → {type:'pub'|'cp'|'all', id, name}
function parsedEntity(){
  if(FILTER_ENTITY==='all')return{type:'all'};
  const [type,id]=FILTER_ENTITY.split(':');
  if(type==='pub'){const p=publishers.find(x=>x.id===id);return{type:'pub',id,name:p?p.name:''};}
  if(type==='cp'){const c=cps.find(x=>x.id===id);return{type:'cp',id,name:c?c.name:''};}
  return{type:'all'};
}

/* PAGE: 平台-发行商映射（独立模块） */
function pgPubMapping(){
  const ent=parsedEntity();
  let gList=FILTER_GAME==='all'?games:games.filter(g=>g.id===FILTER_GAME);
  // 发行商筛选：只展示有该发行商映射的游戏
  if(ent.type==='pub')gList=gList.filter(g=>pubMappings.some(m=>m.gameId===g.id&&m.pubId===ent.id));
  // CP筛选：只展示绑定了该CP的游戏
  if(ent.type==='cp')gList=gList.filter(g=>cpMappings.some(c=>c.gameId===g.id&&c.cpId===ent.id));
  const cards=gList.map(g=>{
    // 一条 mapping 一行，平台标签独立显示
    const mappingRows=g.platforms.flatMap(platform=>{
      let list=pubMappings.filter(m=>m.gameId===g.id&&m.platform===platform);
      // 发行商筛选：行级过滤
      if(ent.type==='pub')list=list.filter(m=>m.pubId===ent.id);
      const isWx=platform==='微信小游戏';
      const tag=isWx?`<span class="tag green">微信小游戏</span>`:`<span class="tag blue">抖音小游戏</span>`;

        return [`<tr>
          <td style="width:130px">${tag}</td>

          <td>—</td><td>—</td>
          <td style="width:120px">${cfg}</td>
        </tr>`];
      }
      return list.map(m=>{
        const appId=`<span style="font-family:monospace;color:#31557d">${isWx?(m.wxAppId||'—'):(m.dyAppId||'—')}</span>`;
        const jl=!isWx&&m.jlIds.length
          ?`<ul style="padding-left:16px;margin:0">${m.jlIds.map((id,j)=>`<li style="margin:2px 0"><span style="font-family:monospace;color:#31557d">${id}</span><span style="color:var(--muted);margin-left:6px">${m.jlNames[j]||''}</span></li>`).join('')}</ul>`

        return `<tr>
          <td style="width:130px">${tag}</td>
          <td style="min-width:180px"><b>${m.pub}</b><span style="color:var(--muted);font-size:12px;margin-left:6px">${m.pubId}</span></td>
          <td style="width:180px">${appId}</td>
          <td style="width:280px">${jl}</td>
          <td style="width:120px">${acts}</td>
        </tr>`;
      });
    });
    return `<div class="card" style="margin-bottom:14px;padding:0;overflow:hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:#f8fafc;border-bottom:1px solid var(--line2)">
        <div><b>《${g.name}》</b><span style="font-family:monospace;color:var(--muted);font-size:12px;margin-left:8px">${g.id}</span></div>
        <div style="display:flex;gap:4px">${g.platforms.map(p=>p==='微信小游戏'?`<span class="tag green">微信小游戏</span>`:`<span class="tag blue">抖音小游戏</span>`).join('')}</div>
      </div>
      ${tbl(['平台类型','对应发行商','对应应用ID','巨量账户ID列表','操作'],mappingRows)}
    </div>`;
  }).join('');
  return `<div class="ph">
    <div><div class="pt">游戏-发行商关系</div><div class="pd">按游戏聚合展示各平台的发行商主体、微信/抖音应用ID及巨量账户ID列表，是系统取数和分账核算的唯一依据。</div></div>

}

function rfSync(){
  const gameId=document.getElementById('rf_game')?.value;
  const plat=document.getElementById('rf_plat')?.value;
  const pubSel=document.getElementById('rf_pub');
  const cpSel=document.getElementById('rf_cp');
  const pubHint=document.getElementById('rf_pub_hint');
  const cpHint=document.getElementById('rf_cp_hint');
  // 联动发行商：需要游戏+平台都选了
  if(gameId && plat){
    const matches=pubMappings.filter(m=>m.gameId===gameId && m.platform===plat);
    if(matches.length){
      pubSel.innerHTML=matches.map(m=>`<option value="${m.pubId}">${m.pub}</option>`).join('');
      pubSel.disabled=false;
      pubHint.textContent='';
    } else {
      pubSel.innerHTML='<option value="">该游戏+平台暂无发行商映射</option>';
      pubSel.disabled=true;
      pubHint.textContent='请先在「平台-发行商映射」中配置';
      pubHint.style.color='var(--red)';
    }
  } else {
    pubSel.innerHTML='<option value="">请先选择游戏和平台</option>';
    pubSel.disabled=true;
    pubHint.textContent='';
  }
  // 联动CP：只需要游戏
  if(gameId){
    const cpRels=cpMappings.filter(m=>m.gameId===gameId);
    if(cpRels.length){
      cpSel.innerHTML=cpRels.map(m=>`<option value="${m.cpId}">${m.cp}</option>`).join('');
      cpSel.disabled=false;
      cpHint.textContent='';
    } else {
      cpSel.innerHTML='<option value="">该游戏暂无CP关系</option>';
      cpSel.disabled=true;
      cpHint.textContent='请先在「游戏-CP关系」中配置';
      cpHint.style.color='var(--red)';
    }
  } else {
    cpSel.innerHTML='<option value="">请先选择游戏</option>';
    cpSel.disabled=true;
    cpHint.textContent='';
  }
}

/* ── 收入双确认 helper ── */
function syncRevConfirmed(){
  if(!window._cashRevConfirmed)window._cashRevConfirmed=new Set();
  if(!window._vRevConfirmed)window._vRevConfirmed=new Set();
  window._revConfirmed=new Set([...window._cashRevConfirmed].filter(k=>window._vRevConfirmed.has(k)));
}
function isSettleReady(period,game,platform){
  const k=`${period}__${game}__${platform}`;
  const cash=window._cashRevConfirmed||new Set();
  const v=window._vRevConfirmed||new Set();
  const cost=window._costConfirmed||new Set();
  return cash.has(k)&&v.has(k)&&cost.has(k);
}
function _revBaseFilter(prefix){
  const startF=window['_'+prefix+'Start']||'2026-01';
  const endF=window['_'+prefix+'End']||'2026-04';
  const platF=window['_'+prefix+'Plat']||'all';
  const gameF=window['_'+prefix+'Game']||'all';
  const entityF=window['_'+prefix+'Entity']||'all';
  const allPeriods=[...new Set(settle.map(r=>r.period))].sort();
  const platforms=[...new Set(settle.map(r=>r.platform))].sort();
  const {visiblePubs,visibleCps,visibleGames}=visibleEntities();
  let filterPubName=null,filterCpName=null;
  if(entityF!=='all'){
    const [et,eid]=entityF.split(':');
    if(et==='pub'){const p=visiblePubs.find(x=>x.id===eid);filterPubName=p?p.name:null;}
    if(et==='cp'){const c=visibleCps.find(x=>x.id===eid);filterCpName=c?c.name:null;}
  }
  const filterGameName=gameF==='all'?null:visibleGames.find(g=>g.id===gameF)?.name||null;
  const data=settle.filter(r=>{
    if(r.period<startF||r.period>endF)return false;
    if(filterPubName&&r.pub!==filterPubName)return false;
    if(filterCpName&&r.cp!==filterCpName)return false;
    if(filterGameName&&r.game!==filterGameName)return false;
    if(platF!=='all'&&r.platform!==platF)return false;
    const pubOk=visiblePubs.length===0||visiblePubs.find(p=>p.name===r.pub);
    if(!pubOk)return false;
    return true;
  });
  return {startF,endF,platF,gameF,entityF,allPeriods,platforms,visiblePubs,visibleCps,visibleGames,data};
}

  return `<div class="card" style="margin-bottom:20px;padding:16px 20px">

        </select></div>
      <div><div style="font-size:12px;color:var(--muted);font-weight:650;margin-bottom:5px">游戏</div>
        <select class="select" style="width:100%" onchange="window._${prefix}Game=this.value;${refreshFn}">
          <option value="all" ${gameF==='all'?'selected':''}>全部游戏</option>
          ${visibleGames.map(g=>`<option value="${g.id}" ${gameF===g.id?'selected':''}>${g.name}</option>`).join('')}
        </select></div>
      <div><div style="font-size:12px;color:var(--muted);font-weight:650;margin-bottom:5px">平台</div>
        <select class="select" style="width:100%" onchange="window._${prefix}Plat=this.value;${refreshFn}">
          <option value="all" ${platF==='all'?'selected':''}>全部平台</option>
          ${platforms.map(p=>`<option value="${p}" ${platF===p?'selected':''}>${p}</option>`).join('')}
        </select></div>
      <div><div style="font-size:12px;color:var(--muted);font-weight:650;margin-bottom:5px">主体</div>
        <select class="select" style="width:100%" onchange="window._${prefix}Entity=this.value;${refreshFn}">
          <option value="all" ${entityF==='all'?'selected':''}>全部主体</option>
          ${pubOpts?`<optgroup label="发行商">${pubOpts}</optgroup>`:''}
          ${cpOpts?`<optgroup label="CP">${cpOpts}</optgroup>`:''}
        </select></div>
      <div style="display:flex;align-items:flex-end;gap:8px;padding-bottom:1px">
        <button class="btn p sm" onclick="${refreshFn}">查询</button>
        <button class="btn g sm" onclick="window._${prefix}Start='2026-01';window._${prefix}End='2026-04';window._${prefix}Plat='all';window._${prefix}Game='all';window._${prefix}Entity='all';${refreshFn}">重置</button>
        <span style="color:var(--muted);font-size:12px;margin-left:2px">共 ${data.length} 条</span>
      </div>
    </div>
  </div>`;
}

function openRevDailyDetail(game,platform,period){
  const monthData=settle.find(r=>r.game===game&&r.platform===platform&&r.period===period);
  if(!monthData)return;
  const syncRec=syncs.find(s=>s.game===game&&s.platform===platform);
  const syncTime=syncRec?syncRec.syncTime:'—';
  const syncStatus=syncRec?syncRec.status:'—';
  const days=30;
  const weights=Array.from({length:days},(_,i)=>0.6+0.4*Math.sin(i/4));
  const wSum=weights.reduce((a,b)=>a+b,0);
  const dailyRows=weights.map((w,i)=>{
    const d=String(i+1).padStart(2,'0');
    const date=`${period}-${d}`;
    const cashRev=Math.round(monthData.cashRev*(w/wSum));
    const vRev=Math.round(monthData.vRev*(w/wSum));
    const total=cashRev+vRev;
    const isLast=(i===weights.length-1);
    return `<tr>
      <td style="color:var(--muted);font-family:monospace">${date}</td>
      <td style="font-weight:700">${mn(cashRev)}</td>
      <td style="font-weight:700;color:var(--purple)">${fmt(vRev)}</td>
      <td style="font-weight:800">${mn(total)}</td>
      <td style="color:var(--muted);font-size:12px">${isLast?syncTime:'—'}</td>
      <td>${isLast?ts(syncStatus):'—'}</td>
    </tr>`;
  });
  const totalCash=weights.reduce((s,w)=>{const cr=Math.round(monthData.cashRev*(w/wSum));return s+cr;},0);
  const totalV=weights.reduce((s,w)=>{const vr=Math.round(monthData.vRev*(w/wSum));return s+vr;},0);
  const sumRow=`<tr style="background:#f8fbff;font-weight:800">
    <td style="color:var(--primary)">合计</td>
    <td>${mn(totalCash)}</td>
    <td style="color:var(--purple)">${fmt(totalV)}</td>
    <td>${mn(totalCash+totalV)}</td>
    <td colspan="2"></td>
  </tr>`;
  openModal(`每日收入明细 · 《${game}》${platform} · ${period}`,`
    <div class="kv" style="margin-bottom:14px">
      <span class="k">发行商</span><span class="v">${monthData.pub}</span>
      <span class="k">月度现金收入</span><span class="v" style="font-size:14px;font-weight:800">${mn(monthData.cashRev)}</span>
      <span class="k">月度广告金收入</span><span class="v" style="color:var(--purple);font-size:14px;font-weight:800">${fmt(monthData.vRev)}</span>
    </div>
    <div style="max-height:460px;overflow:auto">
      ${tbl(['日期','现金收入','广告金收入','合计收入','最新计算时间','同步状态'],dailyRows.concat([sumRow]))}
    </div>
    <div style="margin-top:10px;font-size:12px;color:var(--weak)">* 每日数据为按月度总量模拟拆分，仅供原型演示；实际数据由平台每日同步。</div>`)
}

function openDailyDetail(key,period,game,platform,pub){
  // 生成模拟每日数据（基于月度汇总按天拆分）
  const monthData=settle.find(r=>r.game===game&&r.platform===platform&&r.period===period);
  if(!monthData)return;
  const days=30;
  // 按正弦曲线模拟每日波动，使合计与月度一致
  const weights=Array.from({length:days},(_,i)=>0.6+0.4*Math.sin(i/4));
  const wSum=weights.reduce((a,b)=>a+b,0);
  const dailyRows=weights.map((w,i)=>{
    const d=String(i+1).padStart(2,'0');
    const date=`${period}-${d}`;
    const cashRev=Math.round(monthData.cashRev*(w/wSum));
    const vRev=Math.round(monthData.vRev*(w/wSum));
    const cost=Math.round(monthData.cost*(w/wSum));
    const cashCost=Math.round(monthData.cashCost*(w/wSum));
    const vCost=Math.round(monthData.vCost*(w/wSum));
    const cashP=cashRev-cashCost;
    const vP=vRev-vCost;
    const pubCash=Math.round(cashP*monthData.pubRate/100);
    return `<tr ${cashP<0?'style="background:#fff8f8"':''}>
      <td style="color:var(--muted)">${date}</td>
      <td>${mn(cashRev)}</td><td>${mn(vRev)}</td>
      <td>${mn(cost)}</td>
      <td ${cashP<0?'style="color:var(--red)"':''}>${mn(cashP)}</td>
      <td ${vP<0?'style="color:var(--red)"':''}>${mn(vP)}</td>
      <td style="font-weight:700 ${pubCash<0?';color:var(--red)':''}}">${mn(pubCash)}</td>
    </tr>`;
  });
  const totCash=Math.round(monthData.cashP*monthData.pubRate/100);
  openModal(`每日分账明细 · 《${game}》${platform} · ${period}`,`
    <div class="kv" style="margin-bottom:14px">

    </div>
    <div style="max-height:420px;overflow:auto">

}

/* PAGE: 余额池 */
function pgBalance(){
  const ent=parsedEntity();
  const platF=window._balPlatF||'all';
  let data=FILTER_GAME==='all'?settle:settle.filter(r=>r.game===games.find(g=>g.id===FILTER_GAME)?.name);
  if(ent.type==='pub')data=data.filter(r=>r.pub===ent.name);
  if(ent.type==='cp')data=data.filter(r=>r.cp===ent.name);
  if(platF!=='all')data=data.filter(r=>r.platform===platF);
  // 三方（财务·业务运营·发行商）全部确认后纳入余额池
  const confirmedData=data.filter(r=>isSettleReady(r.period,r.game,r.platform));
  const unconfirmedCnt=data.length-confirmedData.length;
  const rows=confirmedData.map(r=>{
    const pubCash=(r.cashP*r.pubRate/100);
    const pubV=(r.vP*r.pubRate/100);
    const settled=pays.filter(p=>p.game===r.game&&p.platform===r.platform&&p.exec==='打款成功').reduce((s,p)=>s+p.amount,0);
    const inFlight=pays.filter(p=>p.game===r.game&&p.platform===r.platform&&p.exec==='打款中').reduce((s,p)=>s+p.amount,0);
    const bal=pubCash-settled-inFlight;
    const vUsed=Math.round(pubV*0.4*100)/100; // 广告金已消耗（mock：累计分成的40%）
    const vBal=Math.round((pubV-vUsed)*100)/100;
    return {r,pubCash,pubV,vUsed,vBal,settled,inFlight,bal};
  });
  const totalBal=rows.reduce((s,x)=>s+x.bal,0);
  const totalPubCash=rows.reduce((s,x)=>s+x.pubCash,0);
  const totalSettled=rows.reduce((s,x)=>s+x.settled,0);
  const totalInFlight=rows.reduce((s,x)=>s+x.inFlight,0);
  const totalPubV=rows.reduce((s,x)=>s+x.pubV,0);
  const totalVUsed=rows.reduce((s,x)=>s+x.vUsed,0);
  const totalVBal=rows.reduce((s,x)=>s+x.vBal,0);
  const balTab=window._balTab||'cash';
  // 构建现金流水账（Ledger）
  const ledgerEntries=[];
  // 1. 确认结算 → +入金
  confirmedData.forEach(r=>{
    const pubCash=(r.cashP*r.pubRate/100);
    const isLoss=pubCash<0;
    ledgerEntries.push({
      date:`${r.period}-28 23:59`,
      pub:r.pub,
      type:isLoss?'账期亏损分摊':'账期结算入金',
      amount:Math.abs(pubCash),
      dir:isLoss?-1:+1,
      remark:`《${r.game}》${r.platform} ${r.period} ${isLoss?'账期亏损（成本超收入）':'账期结算入金'}`,
      sortKey:r.period+'-28 23:59'
    });
  });
  // 2. 打款记录 → 出入金
  let lpdata=FILTER_GAME==='all'?pays:pays.filter(p=>p.game===games.find(g=>g.id===FILTER_GAME)?.name);
  if(ent.type==='pub')lpdata=lpdata.filter(p=>p.pub===ent.name);
  if(ent.type==='cp')lpdata=[];
  if(platF!=='all')lpdata=lpdata.filter(p=>p.platform===platF);
  lpdata.forEach(p=>{
    let type,dir,style='',remark='';
    if(p.exec==='打款成功'){type='打款成功';dir=-1;style='color:var(--red)';remark=`申请单号 ${p.id}`;}
    else if(p.exec==='打款中'){type='打款申请（冻结）';dir=-1;style='color:var(--orange)';remark=`申请单号 ${p.id}`;}
    else if(p.exec==='打款失败'){type='打款失败退回';dir=+1;style='color:var(--green)';remark=`申请单号 ${p.id}，原因：${p.reason}`;}
    else return;
    ledgerEntries.push({date:p.time,pub:p.pub,type,amount:p.amount,dir,remark,sortKey:p.time,style});
  });
  // 按时间正序计算滚动余额
  ledgerEntries.sort((a,b)=>a.sortKey<b.sortKey?-1:a.sortKey>b.sortKey?1:0);
  // 计算滚动余额（按 pub 分组）
  const runBal={};
  const ledgerRows=ledgerEntries.map(e=>{
    const key=e.pub;
    if(!runBal[key])runBal[key]=0;
    if(e.dir!==0)runBal[key]+=e.dir*e.amount;
    const bal=runBal[key];
    const amtStr=`<span style="${e.style||''};font-weight:700">${e.dir>0?'+':''}${fmt(e.dir*e.amount)}</span>`;
    const balStr=`<span style="font-weight:800;font-size:13px;color:${bal<0?'var(--red)':'var(--text)'}">${fmt(bal)}</span>`;
    const typeTag=e.dir>0?`<span class="tag green" style="font-size:11px">${e.type}</span>`
      :e.dir<0&&e.type==='打款申请（冻结）'?`<span class="tag orange" style="font-size:11px">${e.type}</span>`
      :`<span class="tag red" style="font-size:11px">${e.type}</span>`;
    return `<tr>
      <td style="color:var(--muted);font-size:12px;font-family:monospace">${e.date}</td>
      <td>${e.pub}</td>
      <td>${typeTag}</td>
      <td style="text-align:right">${amtStr}</td>
      <td style="text-align:right">${balStr}</td>
      <td style="color:var(--muted);font-size:12px">${e.remark||'—'}</td>
    </tr>`;
  });
  const cashTable=tbl(['时间','发行商','流水类型','金额','账户余额（现金）','备注'],
    ledgerRows.length?ledgerRows:[`<tr><td colspan="6" style="text-align:center;color:var(--weak);padding:20px">暂无流水记录</td></tr>`]);
  const vTable=tbl(['账期','游戏','平台','发行商','广告金余额','广告金累计分成','广告金已消耗','最新计算时间'],
    rows.map(({r,pubV,vUsed,vBal})=>`<tr>
      <td style="color:var(--muted)">${r.period}</td>
      <td>《${r.game}》</td><td>${r.platform}</td><td>${r.pub}</td>
      <td style="font-weight:800;font-size:14px">${fmt(vBal)}</td>
      <td>${fmt(pubV)}</td><td style="color:var(--muted)">${fmt(vUsed)}</td>
      <td style="color:var(--muted);font-size:12px">2026-04-28 06:16</td></tr>`));
  return `<div class="ph">
    <div><div class="pt">发行商账户余额池</div><div class="pd">以发行商为账户维度，展示现金流水账单——结算入账与提款记录按时间排列，余额实时滚动。</div></div>
    <div class="acts"><button class="btn g" onclick="alert('原型展示：导出 Excel')">↓ 导出</button></div>
  </div>
  <div class="tabs">
    <button class="tab ${balTab==='cash'?'active':''}" onclick="window._balTab='cash';document.getElementById('contentEl').innerHTML=pgBalance()">现金账单</button>
    <button class="tab ${balTab==='v'?'active':''}" onclick="window._balTab='v';document.getElementById('contentEl').innerHTML=pgBalance()">广告金余额</button>
  </div>
  ${balTab==='cash'?`
  ${(()=>{
    // 发行商筛选
    const {visiblePubs}=visibleEntities();
    const selPubName=window._balPubName||(visiblePubs[0]?.name||'');
    const pubOpts=visiblePubs.map(p=>`<option value="${p.name}" ${p.name===selPubName?'selected':''}>${p.name}</option>`).join('');
    // 时间筛选（默认显示全部）
    const allDates=ledgerEntries.filter(e=>!selPubName||e.pub===selPubName).map(e=>e.date.slice(0,10)).sort();
    const minD=allDates[0]||'2026-01-01';
    const maxD=allDates[allDates.length-1]||'2026-12-31';
    const startD=window._balStart||'';
    const endD=window._balEnd||'';
    // 该发行商所有流水（用于计算滚动余额）
    const allPubEntries=selPubName?ledgerEntries.filter(e=>e.pub===selPubName):ledgerEntries;
    // 时间筛选后用于展示
    const pubEntries=allPubEntries.filter(e=>{
      const d=e.date.slice(0,10);
      if(startD&&d<startD)return false;
      if(endD&&d>endD)return false;
      return true;
    });
    // 重新计算该发行商的滚动余额
    let rb=0;
    // 基于全量流水计算余额（保证筛选时间区间内的余额正确）
    const enrichedEntries=allPubEntries.map(e=>{
      if(e.dir!==0)rb+=e.dir*e.amount;
      return {...e,bal:rb};
    });
    // 按时间筛选后展示
    const visibleEntries=enrichedEntries.filter(e=>{
      const d=e.date.slice(0,10);
      if(startD&&d<startD)return false;
      if(endD&&d>endD)return false;
      return true;
    });
    const pubRows=visibleEntries.slice().reverse().map(e=>{
      const isPos=e.dir>0;
      const amtStr=`<span style="font-variant-numeric:tabular-nums;font-weight:700;color:${isPos?'var(--green)':'var(--text)'}">${isPos?'+':''}${fmt(e.dir*e.amount)}</span>`;
      const balStr=`<span style="font-variant-numeric:tabular-nums;font-weight:700;color:${e.bal<0?'var(--red)':'var(--text)'}">${fmt(e.bal)}</span>`;
      const typeTag=isPos
        ?`<span class="tag green" style="font-size:11px">${e.type}</span>`
        :e.type==='打款申请（冻结）'
          ?`<span class="tag orange" style="font-size:11px">${e.type}</span>`
          :e.type==='账期亏损分摊'
            ?`<span class="tag red" style="font-size:11px">${e.type}</span>`
            :`<span class="tag red" style="font-size:11px">${e.type}</span>`;
      return `<tr>
        <td style="color:var(--muted);font-size:12px;font-family:monospace;white-space:nowrap;width:160px">${e.date}</td>
        <td style="width:160px">${typeTag}</td>
        <td style="text-align:right;width:160px;font-family:monospace">${amtStr}</td>
        <td style="text-align:right;width:160px;font-family:monospace">${balStr}</td>
        <td style="color:var(--muted);font-size:12px;white-space:normal;line-height:1.6">${e.remark||'—'}</td>
      </tr>`;
    });
    // 统计指标（始终基于全量数据，不受时间筛选影响）
    const totalIn=allPubEntries.filter(e=>e.type==='账期结算入金').reduce((s,e)=>s+e.amount,0);
    const totalLoss=allPubEntries.filter(e=>e.type==='账期亏损分摊').reduce((s,e)=>s+e.amount,0);
    const totalOut=allPubEntries.filter(e=>e.type==='打款成功').reduce((s,e)=>s+e.amount,0);
    const totalRefund=allPubEntries.filter(e=>e.type==='打款失败退回').reduce((s,e)=>s+e.amount,0);
    const frozen=allPubEntries.filter(e=>e.type==='打款申请（冻结）').reduce((s,e)=>s+e.amount,0);
    const curBal=rb;
    const pubUnconfirmed=selPubName
      ?data.filter(r=>r.pub===selPubName&&!isSettleReady(r.period,r.game,r.platform)).length
      :unconfirmedCnt;
    const ledgerTbl=`<div class="card"><div class="tw"><table class="table" style="table-layout:fixed;width:100%">
      <colgroup><col style="width:160px"><col style="width:160px"><col style="width:160px"><col style="width:160px"><col></colgroup>
      <thead><tr><th>时间</th><th>流水类型</th><th style="text-align:right">金额</th><th style="text-align:right">账户余额</th><th>摘要</th></tr></thead>
      <tbody>${pubRows.length?pubRows.join(''):`<tr><td colspan="5" style="text-align:center;color:var(--weak);padding:24px">暂无流水记录</td></tr>`}</tbody>
    </table></div></div>`;
    return `
    <div class="filter" style="margin-bottom:16px">
      <span style="color:var(--muted);font-size:12.5px">发行商账户</span>
      <select class="select" style="min-width:160px" onchange="window._balPubName=this.value;document.getElementById('contentEl').innerHTML=pgBalance()">${pubOpts||'<option>—</option>'}</select>
      <button class="btn p sm" style="margin-left:auto" ${curBal<=0?'disabled title="账户余额不足，无法发起提款"':`onclick="window._payPubId='${(visiblePubs.find(p=>p.name===selPubName)||{}).id||''}';openPayNewModal()"`}>+ 发起提款</button>
    </div>
    <div class="g4" style="margin-bottom:16px">
      <div class="metric">
        <div class="lb">当前账户余额</div>
        <div class="v ${curBal<0?'neg':''}">${fmt(curBal)}</div>
        <div class="ft">${curBal<0?'<span style="color:var(--red)">余额为负，不可提款</span>':curBal===0?'无可提现余额':'可提现余额'}</div>
      </div>
      <div class="metric">
        <div class="lb">累计结算入账</div>
        <div class="v">+${fmt(totalIn)}</div>
        <div class="ft">${totalLoss>0?`含亏损分摊 <span style="color:var(--red)">-${fmt(totalLoss)}</span>`:'已确认结算'}</div>
      </div>
      <div class="metric">
        <div class="lb">累计提款成功</div>
        <div class="v">${totalOut>0?fmt(totalOut):'—'}</div>
        <div class="ft">已到账金额</div>
      </div>
      <div class="metric">
        <div class="lb">冻结中</div>
        <div class="v" style="${frozen>0?'color:var(--orange)':''}">${frozen>0?'-'+fmt(frozen):'—'}</div>
        <div class="ft">提款待执行</div>
      </div>
    </div>
    ${pubUnconfirmed>0?`<div class="notice" style="border-color:#ffe0b2;background:#fff8f0;color:#a05000">⚠ 该发行商还有 <b>${pubUnconfirmed}</b> 条分账记录尚未确认，确认后方可入账。请前往「<button class="link" style="color:var(--orange);font-size:12.5px" onclick="go('settlePub')">发行商分账明细</button>」完成确认。</div>`:''}
    <div class="notice" style="border-color:#d0e8ff;background:#f0f7ff;color:#1a4a80">📋 <b>账单说明：</b>每条记录为一笔账户流水。结算确认后产生入账（绿色 +），打款申请冻结余额（橙色 −），打款成功扣减余额（黑色 −），打款失败退回余额（绿色 +）。账户余额按时间正序滚动计算，列表按倒序展示。</div>
    <div style="display:flex;align-items:center;gap:10px;margin:18px 0 10px">
      <div style="font-size:14px;font-weight:700">流水明细</div>
      <span style="color:var(--muted);font-size:12.5px;margin-left:12px">时间范围</span>
      <input type="date" class="input" style="width:150px" value="${startD}" min="${minD}" max="${maxD}" onchange="window._balStart=this.value;document.getElementById('contentEl').innerHTML=pgBalance()" />
      <span style="color:var(--muted)">至</span>
      <input type="date" class="input" style="width:150px" value="${endD}" min="${minD}" max="${maxD}" onchange="window._balEnd=this.value;document.getElementById('contentEl').innerHTML=pgBalance()" />
      ${(startD||endD)?`<button class="link" style="font-size:12px" onclick="window._balStart=undefined;window._balEnd=undefined;document.getElementById('contentEl').innerHTML=pgBalance()">重置</button>`:''}
      <span style="color:var(--muted);font-size:12px;margin-left:auto">共 ${visibleEntries.length} 条</span>
    </div>
    ${ledgerTbl}`;
  })()}`:`
  <div class="g3" style="margin-bottom:16px">
    <div class="metric"><div class="lb">广告金余额</div><div class="v">${fmt(totalVBal)}</div></div>
    <div class="metric"><div class="lb">广告金累计分成</div><div class="v">${fmt(totalPubV)}</div></div>
    <div class="metric"><div class="lb">广告金已消耗</div><div class="v" style="color:var(--muted)">${fmt(totalVUsed)}</div></div>
  </div>
  <div class="notice">广告金余额 = 广告金累计分成 − 广告金已消耗（用于平台投放）。广告金不可提现。</div>
  ${vTable}`}`;
}

/* MODAL: 发起打款 */
function openPayNewModal(){
  if(!['发行商','财务人员','系统管理员'].includes(ROLE)){alert('当前角色无权发起打款');return;}
  const {visiblePubs}=visibleEntities();
  const selPubId=window._payPubId||(visiblePubs[0]?.id||'');
  const selPub=publishers.find(p=>p.id===selPubId)||visiblePubs[0];
  const pubSettleAll=selPub?settle.filter(r=>r.pub===selPub.name):[];
  const pubSettleConfirmed=pubSettleAll.filter(r=>isSettleReady(r.period,r.game,r.platform));
  const pubUnconfirmedCnt=pubSettleAll.length-pubSettleConfirmed.length;
  const pubPaidOk=selPub?pays.filter(p=>p.pub===selPub.name&&p.exec==='打款成功').reduce((s,p)=>s+p.amount,0):0;
  const pubInFlight=selPub?pays.filter(p=>p.pub===selPub.name&&p.exec==='打款中').reduce((s,p)=>s+p.amount,0):0;
  const pubTotalCash=pubSettleConfirmed.reduce((s,r)=>s+(r.cashP*r.pubRate/100),0);
  const availBal=pubTotalCash-pubPaidOk-pubInFlight;
  const body=`
    <div class="stepper" style="margin-bottom:14px">
      <div class="step act"><span class="sc">1</span>选择发行商</div><div class="sline"></div>
      <div class="step"><span class="sc">2</span>填写金额</div><div class="sline"></div>
      <div class="step"><span class="sc">3</span>确认提交</div><div class="sline"></div>
      <div class="step"><span class="sc">4</span>BPM审批</div><div class="sline"></div>
      <div class="step"><span class="sc">5</span>银企打款</div>
    </div>
    <div class="field" style="max-width:320px;margin-bottom:14px">
      <label>选择发行商 <span class="req">*</span></label>
      <select class="select" style="width:100%" onchange="window._payPubId=this.value;openPayNewModal()">
        ${visiblePubs.map(p=>`<option value="${p.id}" ${p.id===selPubId?'selected':''}>${p.name}</option>`).join('')}
      </select>
    </div>
    ${selPub?`<div style="background:#f8fbff;border:1px solid var(--line2);border-radius:var(--r2);padding:12px;margin:10px 0">
      <div style="color:var(--muted);font-size:12px;margin-bottom:8px">系统自动关联（只读）</div>
      <div class="kv">
        <span class="k">收款账户名称</span><span class="v">${selPub.accName||selPub.name}</span>
        <span class="k">开户银行</span><span class="v">${selPub.bank||'招商银行深圳科技园支行'}</span>
        <span class="k">银行账号</span><span class="v" style="font-family:monospace">${selPub.acc?'****'+selPub.acc.slice(-4):'****8126'}</span>
        <span class="k">联行号</span><span class="v" style="font-family:monospace">${selPub.bankNo||'308584000013'}</span>
      </div>
      <div style="margin-top:10px;display:flex;gap:16px">
        <div style="background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 14px;min-width:180px">
          <div style="color:var(--muted);font-size:12px">当前账户余额</div>
          <div style="font-size:18px;font-weight:800;margin-top:5px;color:${availBal<0?'var(--red)':'var(--text)'}">${fmt(availBal)}</div>
          <div style="color:var(--weak);font-size:11px;margin-top:3px">可提现金额（已扣除冻结）</div>
        </div>
        <div style="background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 14px;min-width:140px">
          <div style="color:var(--muted);font-size:12px">打款中（冻结）</div>
          <div style="font-size:18px;font-weight:800;margin-top:5px;color:${pubInFlight>0?'var(--orange)':'var(--text)'}">${pubInFlight>0?fmt(pubInFlight):'—'}</div>
          <div style="color:var(--weak);font-size:11px;margin-top:3px">提款待执行</div>
        </div>
      </div>
      ${pubUnconfirmedCnt>0?`<div style="margin-top:10px;font-size:12px;color:#a05000;background:#fff8f0;border:1px solid #ffe0b2;border-radius:var(--r2);padding:8px 10px">⚠ 该发行商还有 <b>${pubUnconfirmedCnt}</b> 条分账记录未确认，未确认部分不计入余额。</div>`:''}
    </div>
    <div class="fgrid">
      <div class="field"><label>打款金额 <span class="req">*</span></label><input class="input" type="number" style="width:100%" id="payAmt" placeholder="≤ ${fmt(availBal)}" oninput="validateAmt(${availBal})"/><div class="hint" id="payAmtHint">最大可打款金额：${fmt(availBal)}</div></div>
      <div class="field"><label>备注</label><input class="input" style="width:100%" placeholder="可填写打款原因或说明" /></div>
    </div>
    <div class="notice" style="margin-top:8px">⚠️ 原型说明：提交后系统将金额从「可结算现金池」转入「打款中」；BPM 审批通过后调用银企直联发起转账；银行回调后更新为「打款成功/失败」。</div>`:'<div class="notice">暂无可操作的发行商</div>'}`;
  const foot=`<button class="btn g" onclick="closeModal()">取消</button><button class="btn p" ${availBal<=0?'disabled':''} onclick="submitPay()">提交申请</button>`;
  openModal('发起打款申请',body,foot);
}
function validateAmt(max){const v=parseFloat(document.getElementById('payAmt').value)||0;const h=document.getElementById('payAmtHint');if(v>max){h.style.color='var(--red)';h.textContent='⚠ 超过可结算余额 '+fmt(max);}else{h.style.color='var(--muted)';h.textContent='最大可打款金额：'+fmt(max)}}
function submitPay(){const v=parseFloat((document.getElementById('payAmt')||{}).value)||0;if(!v){alert('请填写打款金额');return}closeModal();alert(`原型展示：打款申请已提交 ¥${v.toLocaleString()}，\n系统将发起 BPM 审批流程（BPM-PAY-xxxx），\n审批通过后银企直联自动转账。`);go('payments')}

/* PAGE: 打款申请单
 * 同一份数据按角色双视图：
 *  - 发行商视图（isPublisher）：只读 + 自查询，失败单不可处理
 *  - 财务视图（canFin）：失败单可"重新打款"，可批量导出/凭证下载
 */
function pgPayments(){
  const ent=parsedEntity();
  let data=FILTER_GAME==='all'?pays:pays.filter(p=>p.game===games.find(g=>g.id===FILTER_GAME)?.name);
  if(ent.type==='pub')data=data.filter(p=>p.pub===ent.name);
  // CP 无直接打款记录（Phase 1 线下处理），筛选 CP 时显示空
  if(ent.type==='cp')data=[];

  const finView=canFin();
  const pubView=isPublisher();
  const banner=pubView
    ?`<div class="notice" style="border-color:#d0e8ff;background:#f0f7ff;color:#1a4a80">👁 <b>发行商视图（只读）：</b>仅可查看与本主体相关的打款申请单。打款失败的处理由财务团队负责，发行商无需也无权操作；如对失败原因有疑问，请联系结算财务对接人。</div>`
    :finView
      ?`<div class="notice" style="border-color:#ffd9b3;background:#fff7ec;color:#8a4b00">💼 <b>财务视图：</b>对打款失败的单子可发起「重新打款」，新单将引用原单号生成关联凭证；电子回单可下载留档。</div>`
      :`<div class="notice">展示所有打款申请的审批状态与执行状态。</div>`;

  const opCol=(p)=>{
    const view=`<button class="link" onclick="openPayDetail('${p.id}')">查看</button>`;
    if(p.exec==='打款失败'){
      if(finView)return view+`<button class="link" style="color:var(--red);margin-left:8px" onclick="openRepay('${p.id}')">重新打款</button>`;
      if(pubView)return view+`<span class="tag" style="margin-left:6px;font-size:11px;color:var(--muted)">财务处理中</span>`;
    }
    if(p.exec==='打款成功'&&finView)return view+`<button class="link" style="margin-left:8px" onclick="alert('下载电子回单（Mock）：'+'${p.id}')">回单</button>`;
    return view;
  };
  const rows=data.map(p=>`<tr style="${p.exec==='打款失败'?'background:#fff8f8':''}"><td style="font-family:monospace;font-size:12px">${p.id}</td><td>《${p.game}》</td><td>${p.platform}</td><td>${p.pub}</td><td style="font-weight:700">${fmt(p.amount)}</td><td>${ts(p.approval)}</td><td>${ts(p.exec)}</td><td style="color:var(--muted)">${p.time}</td><td>${opCol(p)}</td></tr>`);

  const acts=finView
    ?`<button class="btn g" onclick="alert('导出申请单列表（财务视图，含失败处理记录）')">↓ 导出</button>`
    :`<button class="btn g" onclick="alert('导出我的打款记录')">↓ 导出</button>`;

  return `<div class="ph"><div><div class="pt">打款申请单${pubView?'（发行商视图）':finView?'（财务视图）':''}</div><div class="pd">展示所有打款申请的审批状态与执行状态；打款失败条目标红，可查看失败原因。${ent.type==='cp'?'<b style="color:var(--orange)">（Phase 1 中CP不参与直接打款，由财务线下处理）</b>':''}</div></div><div class="acts">${acts}</div></div>
  ${banner}

function openPayDetail(id){

  <div class="stepper">

/* 财务：失败单重新打款 */
function openRepay(origId){
  if(!canFin()){alert('当前角色无权处理失败打款');return}
  const p=pays.find(x=>x.id===origId);
  if(!p){alert('原单不存在');return}
  const pub=publishers.find(x=>x.name===p.pub);
  const newId='PAY-'+(new Date()).toISOString().slice(0,7).replace('-','')+'-R'+Math.floor(Math.random()*900+100);
  const body=`<div class="alert">⚠ 原单失败原因：${p.reason}<div style="margin-top:4px;font-size:12px;color:var(--muted)">请先与发行商核实账户/联行号，必要时在「发行商主体管理」更新银行信息后再重发。</div></div>
    <div class="sec-title">原打款申请单</div>
    <div class="kv"><span class="k">原申请单号</span><span class="v" style="font-family:monospace">${p.id}</span><span class="k">游戏</span><span class="v">《${p.game}》</span><span class="k">平台</span><span class="v">${p.platform}</span><span class="k">发行商</span><span class="v">${p.pub}</span><span class="k">原打款金额</span><span class="v">${fmt(p.amount)}</span></div>
    <div class="sec-title">新打款单（关联原单 ${p.id}）</div>
    <div class="form-grid">
      <div class="field"><label>新申请单号</label><input class="input" style="width:100%" value="${newId}" disabled/></div>
      <div class="field"><label>打款金额 <span class="req">*</span></label><input class="input" type="number" id="repayAmt" style="width:100%" value="${p.amount}"/></div>
      <div class="field" style="grid-column:1/-1"><label>处理说明 <span class="req">*</span></label><input class="input" id="repayMemo" style="width:100%" placeholder="例如：已与发行商确认联行号变更，重发本笔款项"/></div>
    </div>
    <div class="sec-title">收款账户（当前最新）</div>
    <div class="kv"><span class="k">账户名称</span><span class="v">${pub?pub.accName:'—'}</span><span class="k">开户银行</span><span class="v">${pub?pub.bank:'—'}</span><span class="k">银行账号</span><span class="v" style="font-family:monospace">${pub?'****'+pub.acc:'—'}</span><span class="k">联行号</span><span class="v" style="font-family:monospace">${pub?pub.bankNo:'—'}</span></div>
    <div class="notice" style="margin-top:8px">提交后将生成新单并自动走 BPM 审批流程；原单状态保持「打款失败」用于审计追溯，新单与原单通过「关联原单号」字段双向关联。</div>`;
  const foot=`<button class="btn g" onclick="closeModal()">取消</button><button class="btn p" onclick="submitRepay('${p.id}','${newId}')">提交重新打款</button>`;
  openModal(`重新打款（财务处理） · 原单 ${p.id}`,body,foot);
}
function submitRepay(origId,newId){
  const amt=parseFloat((document.getElementById('repayAmt')||{}).value)||0;
  const memo=(document.getElementById('repayMemo')||{}).value||'';
  if(!amt){alert('请填写打款金额');return}
  if(!memo.trim()){alert('请填写处理说明（用于审计）');return}
  const orig=pays.find(x=>x.id===origId);
  if(orig){
    pays.unshift({id:newId,game:orig.game,platform:orig.platform,pub:orig.pub,amount:amt,approval:'待审批',exec:'待执行',time:new Date().toISOString().slice(0,16).replace('T',' '),bpm:'BPM-PAY-R'+Math.floor(Math.random()*9000+1000),flow:'—',bkFlow:'—',reason:'—',relateId:origId,memo:memo});
  }
  closeModal();
  alert(`原型展示：已生成新打款单 ${newId}，关联原单 ${origId}，正在走 BPM 审批流程。`);
  go('payments')
}

/* PAGE: 数据同步状态 */
function pgSync(){
  const ent=parsedEntity();
  let data=FILTER_GAME==='all'?syncs:syncs.filter(s=>s.game===games.find(g=>g.id===FILTER_GAME)?.name);
  // 同步数据按平台筛选：发行商只看对应平台的同步记录
  if(ent.type==='pub'){
    const pubPlatforms=[...new Set(pubMappings.filter(m=>m.pubId===ent.id).map(m=>m.platform))];
    const pubGames=[...new Set(pubMappings.filter(m=>m.pubId===ent.id).map(m=>m.game))];
    data=data.filter(s=>pubGames.includes(s.game)&&pubPlatforms.includes(s.platform));
  }
  if(ent.type==='cp'){
    const cpGames=cpMappings.filter(c=>c.cpId===ent.id).map(c=>c.game);
    data=data.filter(s=>cpGames.includes(s.game));
  }
  const rows=data.map(s=>`<tr style="${s.status==='失败'?'background:#fff8f8':''}"><td>《${s.game}》</td><td>${s.platform}</td><td>${s.date}</td><td>${ts(s.status)}</td><td style="color:${s.status==='失败'?'var(--red)':'var(--muted)'}">${s.reason}</td><td style="color:var(--muted)">${s.syncTime}</td><td>${s.status==='失败'?`<button class="btn p sm" onclick="alert('手动同步 ${s.game}-${s.platform}')">手动同步</button>`:'—'}</td></tr>`);
  return `<div class="ph"><div><div class="pt">数据同步状态</div><div class="pd">每日 T+1 从微小/抖小/巨量后台拉取收入与投放成本数据；同步失败时可手动重试，不触发当日结算。</div></div></div>
  <div class="notice">⚠ 接口规范待确认（见 PRD 第八节），当前使用 Mock 数据。接口对接完成后将替换为真实取数逻辑。</div>
  ${tbl(['游戏','平台','同步日期','状态','失败原因','同步完成时间','操作'],rows)}`;
}

let _permEditRole=null;
function pgPermConfig(){
  const allModuleKeys=PERM_MODULES.flatMap(g=>g.items.map(i=>i.key));
  // 矩阵视图：行=角色，列=功能模块，单元格=可访问✓/✗
  function matrixView(){
    const colGroups=PERM_MODULES.map(g=>`<th colspan="${g.items.length}" style="text-align:center;background:#eaf2ff;color:var(--primary);border-bottom:1px solid var(--line)">${g.group}</th>`).join('');
    const colHeaders=PERM_MODULES.flatMap(g=>g.items.map(i=>`<th style="min-width:80px;text-align:center;font-size:11px">${i.label}</th>`)).join('');
    const rows=ROLES.map(role=>{
      const allowed=ROLE_PAGES[role]||[];
      const cells=allModuleKeys.map(k=>{
        const has=allowed.includes(k);
        return `<td style="text-align:center;padding:9px 4px">${has?'<span style="color:var(--green);font-size:16px">✓</span>':'<span style="color:var(--weak);font-size:14px">—</span>'}</td>`;
      }).join('');
      return `<tr><td style="white-space:nowrap;font-weight:700;padding:9px 12px">${role}</td>${cells}<td style="text-align:center"><button class="btn g sm" onclick="permEditRole('${role}')">操作权限</button></td></tr>`;
    }).join('');
    return `<div class="card" style="margin-bottom:16px">
      <div class="card-hd"><div><div class="card-title">角色访问权限矩阵</div><div class="card-sub">✓ 表示该角色可访问该功能模块</div></div></div>
      <div class="tw"><table class="table" style="min-width:0"><thead>
        <tr><th rowspan="2" style="min-width:120px">角色</th>${colGroups}<th rowspan="2" style="min-width:80px;text-align:center">操作</th></tr>
        <tr>${colHeaders}</tr>
      </thead><tbody>${rows}</tbody></table></div></div>`;
  }
  // 操作权限面板
  function opPanel(){
    if(!_permEditRole)return `<div class="notice">点击角色行右侧「操作权限」按钮，查看并编辑该角色在各模块的细粒度操作权限。</div>`;
    const ops=PERM_OPS[_permEditRole];
    const allowed=ROLE_PAGES[_permEditRole]||[];
    const sections=PERM_MODULES.map(g=>{
      const rows=g.items.map(item=>{
        const hasPage=allowed.includes(item.key);
        const perms=ops[item.key]||{};
        const opCells=OP_KEYS.map((ok,oi)=>{
          if(!hasPage)return `<td style="text-align:center;color:var(--weak);font-size:12px">—</td>`;
          const checked=perms[ok]?'checked':'';
          return `<td style="text-align:center"><label style="cursor:pointer"><input type="checkbox" ${checked} onchange="permToggle('${_permEditRole}','${item.key}','${ok}',this.checked)" style="width:15px;height:15px;cursor:pointer;accent-color:var(--primary)"></label></td>`;
        }).join('');
        return `<tr>
          <td style="padding:8px 12px">${item.label}</td>
          <td style="text-align:center">${hasPage?'<span class="tag green" style="font-size:11px">可访问</span>':'<span class="tag gray" style="font-size:11px">无权限</span>'}</td>
          ${opCells}
        </tr>`;
      }).join('');
      return `<tr><td colspan="${2+OP_KEYS.length}" style="background:#f8fbff;padding:6px 12px;font-weight:800;font-size:12px;color:var(--primary);border-top:1px solid var(--line)">${g.group}</td></tr>${rows}`;
    }).join('');
    return `<div class="card">
      <div class="card-hd" style="background:#f0f6ff">
        <div><div class="card-title">操作权限详情 — <span style="color:var(--primary)">${_permEditRole}</span></div><div class="card-sub">灰色「—」表示该角色无此页面访问权，操作权限不生效</div></div>
        <button class="btn g sm" onclick="_permEditRole=null;renderPage()">收起</button>
      </div>
      <div class="tw"><table class="table" style="min-width:0"><thead>
        <tr><th style="min-width:120px">功能模块</th><th style="min-width:70px;text-align:center">页面访问</th>${OPS.map(o=>`<th style="min-width:80px;text-align:center">${o}</th>`).join('')}</tr>
      </thead><tbody>${sections}</tbody></table></div>
    </div>`;
  }
  return `<div class="ph"><div><div class="pt">权限配置</div><div class="pd">管理各角色的功能模块访问权限及操作级权限</div></div>
    <div class="acts"><span class="tag orange" style="font-size:12px">原型演示 · 变更不持久化</span></div></div>
    ${matrixView()}${opPanel()}`;
}
function permEditRole(role){_permEditRole=role;renderPage();setTimeout(()=>{const el=document.querySelector('.card:nth-child(3)');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},50)}
function permToggle(role,moduleKey,opKey,val){if(!PERM_OPS[role])PERM_OPS[role]={};if(!PERM_OPS[role][moduleKey])PERM_OPS[role][moduleKey]={};PERM_OPS[role][moduleKey][opKey]=val?1:0;}

/* PAGE: 用户管理 */
function pgUserMgmt(){
  const kw=(window._userKw||'').trim().toLowerCase();
  const stF=window._userStF||'all';
  const data=USER_DB.filter(u=>{
    if(kw&&!u.display.toLowerCase().includes(kw)&&!u.account.toLowerCase().includes(kw)&&!u.phone.includes(kw))return false;
    if(stF!=='all'&&u.status!==stF)return false;
    return true;
  });
  const pendingCnt=USER_DB.filter(u=>u.status==='待授权').length;
  const rows=data.map(u=>{
    const isPending=u.status==='待授权';
    const avatarColor=isPending?'#9aacbf':'var(--primary)';
    const roleTag=u.role?ts2(u.role):'<span class="tag gray">未分配</span>';
    const dataTag=!u.dataPerms||!u.dataPerms.length?'<span class="tag gray">无</span>':
      u.dataPerms.includes('all')?'<span class="tag blue">全部数据</span>':
      `<span class="tag purple">${u.dataPerms.length}个主体</span>`;
    return `<tr>
      <td>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:32px;height:32px;border-radius:50%;background:${avatarColor};color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0">${u.display.slice(0,1)}</div>
          <div><div style="font-weight:700">${u.display}</div><div style="font-size:12px;color:var(--muted)">${u.account}</div></div>
        </div>
      </td>
      <td>${u.phone}</td>
      <td><span class="tag ${u.loginType==='sso'?'blue':'green'}" style="font-size:11px">${u.loginType==='sso'?'企业SSO':'手机号'}</span></td>
      <td>${roleTag}</td>
      <td>${dataTag}</td>
      <td>${ts(u.status)}</td>
      <td style="color:var(--muted);font-size:12px">${u.lastLogin}</td>
      <td>
        <button class="btn g sm" onclick="openGrantRole('${u.id}')" style="${isPending?'border-color:var(--primary);color:var(--primary);font-weight:700':''}">配置角色</button>
        <button class="btn g sm" onclick="openGrantData('${u.id}')" style="margin-left:4px" ${!u.role?'disabled':''}>配置数据权限</button>
      </td>
    </tr>`;
  });
  const tableOrEmpty=rows.length?tbl(['用户','手机号','登录方式','角色','数据权限','状态','最后登录','操作'],rows):
    `<div class="card" style="padding:40px;text-align:center;color:var(--muted)">暂无匹配用户</div>`;
  return `<div class="ph">
    <div><div class="pt">用户管理</div><div class="pd">管理所有登录用户的角色与数据权限，首次登录的用户需在此授权后方可使用系统</div></div>
    <div class="acts">${pendingCnt?`<span class="tag red" style="font-size:12px">⚠ ${pendingCnt} 个用户待授权</span>`:''}</div>
  </div>
  <div class="filter">
    <input class="input" placeholder="搜索姓名/账号/手机号" style="width:220px" value="${kw}" oninput="window._userKw=this.value;renderPage()">
    <select class="select" onchange="window._userStF=this.value;renderPage()">
      <option value="all" ${stF==='all'?'selected':''}>全部状态</option>
      <option value="已授权" ${stF==='已授权'?'selected':''}>已授权</option>
      <option value="待授权" ${stF==='待授权'?'selected':''}>待授权</option>
    </select>
    <span style="color:var(--muted);font-size:12px">共 ${USER_DB.length} 个用户，筛选结果 ${data.length} 条</span>
  </div>
  ${tableOrEmpty}`;
}
function ts2(role){
  const m={'系统管理员':'blue','业务负责人':'purple','业务运营':'green','财务人员':'orange','财务负责人/审批人':'orange','发行商':'green','CP':'blue'};
  return `<span class="tag ${m[role]||'gray'}">${role}</span>`;
}
function openGrantRole(uid){
  const u=USER_DB.find(u=>u.id===uid);if(!u)return;
  const opts=ROLES.map(r=>`<label style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--r2);cursor:pointer;transition:.1s;border:1px solid ${u.role===r?'var(--primary)':'var(--line)'};background:${u.role===r?'var(--primary2)':'#fff'};margin-bottom:6px" onclick="grantRoleSelect('${uid}','${r}',this)">
    <input type="radio" name="grantRole" value="${r}" ${u.role===r?'checked':''} style="accent-color:var(--primary)">
    <span style="font-weight:${u.role===r?'700':'400'}">${r}</span>
  </label>`).join('');
  openModal(`配置角色 — ${u.display}`,
    `<div class="notice" style="margin-bottom:14px">选择角色后，用户将获得该角色对应的所有模块访问权限。</div>
     <div id="grantRoleList">${opts}</div>`,
    `<button class="btn g" onclick="closeModal()">取消</button>
     <button class="btn p" onclick="confirmGrantRole('${uid}')">确认授权</button>`);
}
function grantRoleSelect(uid,role,el){
  document.querySelectorAll('#grantRoleList label').forEach(l=>{l.style.borderColor='var(--line)';l.style.background='#fff';l.querySelector('span').style.fontWeight='400';});
  el.style.borderColor='var(--primary)';el.style.background='var(--primary2)';el.querySelector('span').style.fontWeight='700';
}
function confirmGrantRole(uid){
  const u=USER_DB.find(u=>u.id===uid);if(!u)return;
  const sel=document.querySelector('#grantRoleList input[type=radio]:checked');
  if(!sel){alert('请选择角色');return;}
  u.role=sel.value;u.status='已授权';
  closeModal();renderPage();
}
function openGrantData(uid){
  const u=USER_DB.find(u=>u.id===uid);if(!u||!u.role)return;
  const isAllData=u.dataPerms&&u.dataPerms.includes('all');
  const pubChecks=publishers.map(p=>`<label style="display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer"><input type="checkbox" class="dpCheck" value="pub:${p.id}" ${(u.dataPerms||[]).includes('pub:'+p.id)||isAllData?'checked':''} style="accent-color:var(--primary)"> <span>${p.name}（${p.id}）</span></label>`).join('');
  const cpChecks=cps.map(c=>`<label style="display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer"><input type="checkbox" class="dpCheck" value="cp:${c.id}" ${(u.dataPerms||[]).includes('cp:'+c.id)||isAllData?'checked':''} style="accent-color:var(--primary)"> <span>${c.name}（${c.id}）</span></label>`).join('');
  openModal(`配置数据权限 — ${u.display}`,
    `<div class="notice" style="margin-bottom:14px">数据权限控制用户在分账明细、余额池、打款等模块中可见的发行商/CP数据范围。</div>
     <div class="field" style="margin-bottom:12px"><label style="display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;cursor:pointer"><input type="checkbox" id="dpAll" ${isAllData?'checked':''} style="accent-color:var(--primary);width:15px;height:15px" onchange="dpAllToggle(this)"> 全部数据（不限制）</label></div>
     <div id="dpSpecific" style="${isAllData?'opacity:.4;pointer-events:none':''}">
       <div class="sec-title" style="margin-top:0">发行商</div>${pubChecks}
       <div class="sec-title">CP</div>${cpChecks}
     </div>`,
    `<button class="btn g" onclick="closeModal()">取消</button>
     <button class="btn p" onclick="confirmGrantData('${uid}')">确认保存</button>`);
}
function dpAllToggle(cb){const sp=document.getElementById('dpSpecific');sp.style.opacity=cb.checked?'.4':'1';sp.style.pointerEvents=cb.checked?'none':'auto';}
function confirmGrantData(uid){
  const u=USER_DB.find(u=>u.id===uid);if(!u)return;
  const allCb=document.getElementById('dpAll');
  if(allCb.checked){u.dataPerms=['all'];}
  else{u.dataPerms=[...document.querySelectorAll('.dpCheck:checked')].map(c=>c.value);}
  closeModal();renderPage();
}

  document.addEventListener('click',function(){
    document.getElementById('userCenter').classList.remove('open');
  });
  detectSsoIdentity();
  // 原型默认展示登录页；点击登录后进入系统
