/* Tab A：已出账账期（月度汇总） */
function pgSettlePubClosed(){
  const ent=parsedEntity();
  const allPeriodsAsc=[...new Set(settle.map(r=>r.period))].sort();
  const startF=window._spStart||'2026-04';
  const endF=window._spEnd||'2026-04';
  const platF=window._spPlat||'all';
  const appF=window._spApp||'all'; // 平台应用筛选（按 pubMapping.id）
  let data=FILTER_GAME==='all'?settle:settle.filter(r=>r.game===games.find(g=>g.id===FILTER_GAME)?.name);
  if(ent.type==='pub')data=data.filter(r=>r.pub===ent.name);
  if(ent.type==='cp')data=data.filter(r=>r.cp===ent.name);
  data=data.filter(r=>r.period>=startF&&r.period<=endF);
  if(platF!=='all')data=data.filter(r=>r.platform===platF);
  const cashSet=window._cashRevConfirmed||new Set();
  const vSet=window._vRevConfirmed||new Set();
  const costSet=window._costConfirmed||new Set();
  const isReady=(k)=>cashSet.has(k)&&vSet.has(k)&&costSet.has(k);
  // 把每条 settle 按平台应用映射拆行：使用 mockShare 归一化
  // 没有对应映射时仍展示一行（占位 '—'）
  const flatRows=[];
  data.forEach(r=>{
    expandSettleByApp(r).forEach(x=>flatRows.push({r,appMapping:x.mapping,share:x.share}));
  });
  // 总计：仅累加 per-app key 三方都已确认的行
  const totalPubCash=flatRows.reduce((s,x)=>{
    const k=appKey(x.r.period,x.r.game,x.r.platform,x.appMapping);
    return isReady(k)?s+Math.round(calcPubSettle(x.r).pubCash*x.share):s;
  },0);
  const totalPubV=flatRows.reduce((s,x)=>{
    const k=appKey(x.r.period,x.r.game,x.r.platform,x.appMapping);
    return isReady(k)?s+Math.round(calcPubSettle(x.r).pubV*x.share):s;
  },0);
  // 平台应用筛选（按 pubMapping.id）
  const filteredRows=appF==='all'?flatRows:flatRows.filter(x=>x.appMapping&&x.appMapping.id===appF);
  // 平台应用筛选下拉选项：根据当前 data 范围列出
  const appOptions=[];
  const seen=new Set();
  flatRows.forEach(x=>{
    if(x.appMapping&&!seen.has(x.appMapping.id)){
      seen.add(x.appMapping.id);
      const appId=x.appMapping.platform==='微信小游戏'?x.appMapping.wxAppId:x.appMapping.dyAppId;
      appOptions.push({id:x.appMapping.id,label:`${x.appMapping.appName||appId} · ${appId}`});
    }
  });

  const rows=filteredRows.map(x=>{
    const r=effectiveSettle(x.r);
    const m=x.appMapping;
    const sh=x.share;
    const ps=calcPubSettle(r);
    const key=appKey(r.period,r.game,r.platform,m);
    const cashOk=cashSet.has(key);
    const vOk=vSet.has(key);
    const costOk=costSet.has(key);
    const ready=cashOk&&vOk&&costOk;
    const billOk=isBillConfirmed(r.period,r.game,r.platform);
    let confirmCell;
    if(ready){
      confirmCell=billOk
        ?`<span class="tag green" style="font-size:11px">✓ 已出账 · 联运商已确认</span>`
        :`<span class="tag" style="font-size:11px;background:#fff7ec;color:#8a4b00;border:1px solid #ffd9b3">已出账 · 待联运商确认对账单</span>`;
    }else{
      const miss=[];
      if(!cashOk)miss.push('<span style="color:var(--primary)">财务现金</span>');
      if(!vOk)miss.push('<span style="color:var(--purple)">业务广告金</span>');
      if(!costOk){
        const pubCostOk=(window._costPubConfirmed||new Set()).has(key);
        const bizCostOk=(window._costBizConfirmed||new Set()).has(key);
        const missCost=[];
        if(!pubCostOk)missCost.push('联运商');
        if(!bizCostOk)missCost.push('业务');
        miss.push(`<span style="color:var(--orange)">成本(${missCost.join('+')})</span>`);
      }
      confirmCell=`<span class="tag" style="font-size:11px;background:#fff8f0;color:#a05000;border:1px solid #ffe0b2">待${miss.join(' / ')}确认</span>`;
    }
    const dash='<span style="color:var(--weak)">—</span>';
    const rowStyle=ready?'style="background:#f3faf5"':'style="background:#fafafa;color:var(--muted)"';
    const showRev=cashOk&&vOk;
    const showProfit=showRev&&costOk;
    const tierBadge=ps.tierApplied
      ?`<span style="display:inline-block;background:#fff3e0;color:var(--orange);border-radius:8px;padding:0 6px;font-size:10px;margin-left:4px;font-weight:700">阶梯Ⅱ</span>`
      :(ps.rule&&ps.rule.tierEnabled
        ?`<span style="display:inline-block;background:#eef4fb;color:var(--primary);border-radius:8px;padding:0 6px;font-size:10px;margin-left:4px;font-weight:700">阶梯Ⅰ</span>`
        :'');
    const lossTag=(flag)=>flag?`<span style="display:inline-block;background:#ffe9e9;color:var(--red);border-radius:8px;padding:0 6px;font-size:10px;margin-left:4px;font-weight:700">亏损·全划转</span>`:'';
    const appIdStr=m?(m.platform==='微信小游戏'?(m.wxAppId||'—'):(m.dyAppId||'—')):'—';
    const appCell=m
      ? `<div style="font-family:monospace;font-size:12px">${appIdStr}</div><div style="color:var(--muted);font-size:11px;margin-top:2px">${m.appName||'—'}</div>`
      : '<span style="color:var(--red);font-size:11px">未配置映射</span>';
    const cashRev=cashOk?Math.round(r.cashRev*sh):0;
    const vRev=vOk?Math.round(r.vRev*sh):0;
    const cost=costOk?Math.round(r.cost*sh):0;
    const cashCost=costOk?Math.round(r.cashCost*sh):0;
    const vCost=costOk?Math.round(r.vCost*sh):0;
    const cashP=Math.round(r.cashP*sh);
    const vP=Math.round(r.vP*sh);
    const pubCashShared=Math.round(ps.pubCash*sh);
    const pubVShared=Math.round(ps.pubV*sh);
    const corrTag=r._corrected?'<span title="该账期现金收入已被财务更正" style="display:inline-block;margin-left:4px;color:var(--orange);font-size:11px;font-weight:700">✎</span>':'';
    return `<tr ${rowStyle}>
      <td>${r.period}</td><td>《${r.game}》</td><td>${r.platform}</td><td>${r.pub}</td>
      <td>${appCell}</td>
      <td>${cashOk?mn(cashRev)+corrTag:dash}</td><td>${vOk?mn(vRev):dash}</td>
      <td>${costOk?mn(cost):dash}</td><td>${costOk?mn(cashCost):dash}</td><td>${costOk?mn(vCost):dash}</td>
      <td ${showProfit&&cashP<0?'style="color:var(--red);font-weight:700"':''}>${showProfit?mn(cashP):dash}</td>
      <td ${showProfit&&vP<0?'style="color:var(--red)"':''}>${showProfit?mn(vP):dash}</td>
      <td style="font-weight:700">${cashOk?`${ps.rate}%${tierBadge}`:dash}</td>
      <td style="font-weight:800">${ready?mn(pubCashShared)+lossTag(ps.cashIsLossTransfer):dash}</td>
      <td>${ready?mn(pubVShared)+lossTag(ps.vIsLossTransfer):dash}</td>
      <td>${confirmCell}</td>
      <td><button class="link" onclick="openDailyDetail('${r.game}__${r.platform}','${r.period}','${r.game}','${r.platform}','${r.pub}')">每日明细</button>${ready&&!billOk&&isPublisher()?`<button class="link" style="margin-left:8px;color:var(--orange);font-weight:700" onclick="confirmBill('${r.period}__${r.game}__${r.platform}')">确认对账单</button>`:''}</td>
    </tr>`;
  });
  return `<div class="ph"><div><div class="pt">联运商分账明细</div><div class="pd">展示各联运商当期可结算金额（现金利润 × 联运商分成比例）。按「平台应用」最细粒度展示；同联运商同游戏同平台下若有多个平台应用，金额按各应用真实收入比例拆分。三方确认按平台应用逐条进行。${isPublisher()?'<br/><span style="color:var(--muted);font-size:12px">生成对账单请到「<button class="link" style="color:var(--primary);font-size:12.5px" onclick=\'go("statements")\'>对账单管理</button>」。</span>':''}</div></div><div class="acts"><button class="btn g" onclick="alert('原型展示：导出 Excel')">↓ 导出</button></div></div>
  <div class="filter" style="margin-bottom:16px">
    <span style="font-size:12px;color:var(--muted);font-weight:650">开始账期</span>
    <select class="select" onchange="window._spStart=this.value;document.getElementById('contentEl').innerHTML=pgSettlePub()">
      ${allPeriodsAsc.map(p=>`<option value="${p}" ${startF===p?'selected':''}>${p}</option>`).join('')}
    </select>
    <span style="font-size:12px;color:var(--muted);font-weight:650">结束账期</span>
    <select class="select" onchange="window._spEnd=this.value;document.getElementById('contentEl').innerHTML=pgSettlePub()">
      ${[...allPeriodsAsc].reverse().map(p=>`<option value="${p}" ${endF===p?'selected':''}>${p}</option>`).join('')}
    </select>
    <select class="select" onchange="window._spPlat=this.value;window._spApp='all';document.getElementById('contentEl').innerHTML=pgSettlePub()">
      <option value="all" ${platF==='all'?'selected':''}>全部平台</option>
      <option value="微信小游戏" ${platF==='微信小游戏'?'selected':''}>微信小游戏</option>
      <option value="抖音小游戏" ${platF==='抖音小游戏'?'selected':''}>抖音小游戏</option>
    </select>
    <select class="select" onchange="window._spApp=this.value;document.getElementById('contentEl').innerHTML=pgSettlePub()">
      <option value="all" ${appF==='all'?'selected':''}>全部平台应用</option>
      ${appOptions.map(o=>`<option value="${o.id}" ${appF===o.id?'selected':''}>${o.label}</option>`).join('')}
    </select>
    <span style="color:var(--muted);font-size:12px">共 ${filteredRows.length} 条</span>
  </div>
  <div class="g2" style="margin-bottom:16px">
    <div class="metric"><div class="lb">联运商可结算（现金）</div><div class="v ${totalPubCash<0?'neg':''}">${fmt(totalPubCash)}</div></div>
    <div class="metric"><div class="lb">联运商可结算（广告金）</div><div class="v">${fmt(totalPubV)}</div></div>
  </div>
  <div class="notice" style="border-color:#d0e8ff;background:#f0f7ff;color:#1a4a80">📋 <b>四步确认后可生成对账单：</b>
    <span style="display:inline-block;background:#fff;border:1px solid #cfe0f5;border-radius:10px;padding:1px 8px;margin:0 4px;font-size:12px;color:var(--primary)"><b>① 财务</b>·现金收入</span>
    <span style="display:inline-block;background:#fff;border:1px solid #e9dfff;border-radius:10px;padding:1px 8px;margin:0 4px;font-size:12px;color:#5a3a8a"><b>② 业务运营</b>·广告金收入</span>
    <span style="display:inline-block;background:#fff;border:1px solid #ffe0b2;border-radius:10px;padding:1px 8px;margin:0 4px;font-size:12px;color:#a05000"><b>③ 联运商</b>·成本</span>
    <span style="display:inline-block;background:#fff;border:1px solid #ffd9b3;border-radius:10px;padding:1px 8px;margin:0 4px;font-size:12px;color:#8a4b00"><b>④ 联运商</b>·确认对账单</span>
    前三方确认后该账期自动出账并流转至本页，联运商在本页「确认对账单」后即可到「<button class="link" style="color:var(--primary);font-size:12.5px" onclick="go('statements')">对账单管理</button>」生成对账单并发起打款。
    <br/><span style="font-size:12px;color:var(--muted)">分账计算规则以「<button class="link" style="color:var(--primary);font-size:12.5px" onclick="go('pubRules')">联运商分成规则</button>」与「<button class="link" style="color:var(--primary);font-size:12.5px" onclick="go('cpRules')">CP分成规则</button>」中每条规则的具体配置为准。</span>
  </div>
  ${tbl(['账期','游戏','平台','联运商','平台应用','现金收入','广告金收入','总消耗','现金成本','广告金成本','现金利润','广告金利润','联运商分成%','联运商可结算（现金）','联运商可结算（广告金）','确认状态','每日明细'],rows,{pageKey:'settlePub'})}`;
}

function openDailyDetail(key,period,game,platform,pub){
  // 生成模拟每日数据（基于月度汇总按天拆分）
  const rawData=settle.find(r=>r.game===game&&r.platform===platform&&r.period===period);
  if(!rawData)return;
  const monthData=effectiveSettle(rawData);
  const days=30;
  // 按正弦曲线模拟每日波动，使合计与月度一致
  const weights=Array.from({length:days},(_,i)=>0.6+0.4*Math.sin(i/4));
  const wSum=weights.reduce((a,b)=>a+b,0);
  const monthPs=calcPubSettle(monthData);
  const dailyRows=weights.map((w,i)=>{
    const d=String(i+1).padStart(2,'0');
    const date=`${period}-${d}`;
    const cashRev=Math.round(monthData.cashRev*(w/wSum));
    const vRev=Math.round(monthData.vRev*(w/wSum));
    const cost=Math.round(monthData.cost*(w/wSum));
    const cashCost=Math.round(monthData.cashCost*(w/wSum));
    const vCost=Math.round(monthData.vCost*(w/wSum));
    const cashP=cashRev-cashCost;
    const vP=vRev-vCost;
    // 日级 pubCash：按月度方法等比缩放（避免日级亏损虚高）
    const pubCash=Math.round(monthPs.pubCash*(w/wSum));
    return `<tr ${cashP<0?'style="background:#fff8f8"':''}>
      <td style="color:var(--muted)">${date}</td>
      <td>${mn(cashRev)}</td><td>${mn(vRev)}</td>
      <td>${mn(cost)}</td>
      <td ${cashP<0?'style="color:var(--red)"':''}>${mn(cashP)}</td>
      <td ${vP<0?'style="color:var(--red)"':''}>${mn(vP)}</td>
      <td style="font-weight:700 ${pubCash<0?';color:var(--red)':''}}">${mn(pubCash)}</td>
    </tr>`;
  });
  const totCash=Math.round(monthPs.pubCash);
  openModal(`每日分账明细 · 《${game}》${platform} · ${period}`,`
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn g sm" onclick="alert('原型展示：导出每日分账明细 — 《${game}》${platform} · ${period}')">↓ 导出</button></div>
    <div class="kv" style="margin-bottom:14px">
      <span class="k">联运商</span><span class="v">${pub}</span>
      <span class="k">分成比例</span><span class="v">${monthPs.rate}%${monthPs.tierApplied?'（阶梯Ⅱ）':(monthPs.rule&&monthPs.rule.tierEnabled?'（阶梯Ⅰ）':'')}</span>
      <span class="k">月度可结算（现金）</span><span class="v" style="color:var(--primary);font-size:15px;font-weight:800">${mn(totCash)}${monthPs.cashIsLossTransfer?' · <span style="color:var(--red);font-size:11px">亏损全划转</span>':''}</span>
    </div>
    <div style="max-height:420px;overflow:auto">
      ${tbl(['日期','现金收入','广告金收入','总消耗','现金利润','广告金利润','联运商可结算（现金）'],dailyRows)}
    </div>
    <div style="margin-top:10px;font-size:12px;color:var(--weak)">* 每日数据为模拟值，仅供原型演示；实际数据由巨量/微信平台每日同步。</div>`)
}

/* PAGE: CP分账明细 */
function pgSettleCp(){
  // 新规则：按游戏一行汇总；点击展开看平台明细。云成本按游戏聚合（不按平台拆分）
  const ent=parsedEntity();
  const allPeriodsAsc=[...new Set(settle.map(r=>r.period))].sort();
  const startF=window._cpStart||(allPeriodsAsc[allPeriodsAsc.length-1]||'2026-04');
  const endF=window._cpEnd||(allPeriodsAsc[allPeriodsAsc.length-1]||'2026-04');

  // 收集 (period × game × cp) 唯一组合
  let rows=settle.filter(r=>r.period>=startF&&r.period<=endF);
  if(FILTER_GAME!=='all')rows=rows.filter(r=>r.game===games.find(g=>g.id===FILTER_GAME)?.name);
  if(ent.type==='pub')rows=rows.filter(r=>r.pub===ent.name);
  if(ent.type==='cp')rows=rows.filter(r=>r.cp===ent.name);
  const keys=[...new Set(rows.map(r=>r.period+'__'+r.game+'__'+r.cp))];
  const aggs=keys.map(k=>{const [p,g,cp]=k.split('__');return calcCpSettleByGame(p,g,cp)}).filter(Boolean);

  // 汇总指标
  const sumCpCash=aggs.reduce((s,a)=>s+(a.allReady && _cloudOkForAgg(a) ? a.cpCash : 0),0);
  const sumCpV=aggs.reduce((s,a)=>s+(a.allReady && _cloudOkForAgg(a) ? a.cpV : 0),0);
  const sumServer=aggs.reduce((s,a)=>s+a.sumServerCost,0);

  // 表格行（点击「详情」打开弹窗，不再行内展开）
  const tableRows=aggs.map(a=>{
    const eid=`${a.period}__${a.gameName}__${a.cpName}`;
    const cloudOk=_cloudOkForAgg(a);
    const dash='<span style="color:var(--weak)">—</span>';
    const ready=a.allReady && cloudOk;
    const statusBadge=!a.allReady
      ? `<span class="tag" style="background:#fff3e0;color:#a05000;font-size:11px;border:1px solid #ffe0b2">待三方确认 ${a.notReadyCnt}/${a.totalRows}</span>`
      : (!cloudOk
          ? `<span class="tag" style="background:#fff3e0;color:#a05000;font-size:11px;border:1px solid #ffe0b2">待云成本确认</span>`
          : `<span class="tag green" style="font-size:11px">✓ 已确认</span>`);
    const cpCashCell = ready
      ? `<span style="font-weight:800;color:${a.cpCash<0?'var(--red)':'var(--text)'}">${mn(a.cpCash)}</span>${a.cpCash<0?'<div style="font-size:10.5px;color:var(--red);font-weight:400">▼ 负值·下账期冲抵</div>':''}`
      : dash;
    const cpVCell = ready
      ? `<span style="font-weight:800;color:${a.cpV<0?'var(--red)':'var(--text)'}">${mn(a.cpV)}</span>${a.cpV<0?'<div style="font-size:10.5px;color:var(--red);font-weight:400">▼ 负值·下账期冲抵</div>':''}`
      : dash;

    return `<tr style="${ready?'':'background:#fffbf5'}" data-eid="${eid}">
      <td>${a.period}</td>
      <td><b>《${a.gameName}》</b></td>
      <td>${a.cpName}</td>
      <td style="color:var(--muted)">${a.platCount||a.totalRows} 个平台</td>
      <td>${ready?mn(a.sumCashP):dash}</td>
      <td>${ready?mn(a.sumPubCash):dash}</td>
      <td style="color:#7a52b3">${ready?(a.shareServer?mn(a.sumServerCost):'<span style="color:var(--weak)">—（规则未扣）</span>'):dash}</td>
      <td style="font-weight:700;color:${ready&&a.cashBase<0?'var(--red)':'var(--text)'}">${ready?mn(a.cashBase):dash}</td>
      <td>${ready?mn(a.sumVP):dash}</td>
      <td>${ready?mn(a.sumPubV):dash}</td>
      <td style="font-weight:700;color:${ready&&a.vBase<0?'var(--red)':'var(--text)'}">${ready?mn(a.vBase):dash}</td>
      <td><b>${a.cpRemainShare}%</b><div style="font-size:10.5px;color:var(--muted)">${a.cpRule?a.cpRule.id:'未配置规则'}</div></td>
      <td>${cpCashCell}</td>
      <td>${cpVCell}</td>
      <td>${statusBadge}</td>
      <td><button class="link" onclick="openCpSettleDetail('${eid}')">详情</button></td>
    </tr>`;
  });

function _cloudOkForAgg(a){
  const g=games.find(x=>x.name===a.gameName);
  if(!g)return true;
  const ids=getGameCloudIds(g);
  if(!ids.length)return true; // 未关联浑天仪项目 → 视为不依赖
  return ids.every(id=>isCloudCostConfirmed(a.period,id));
}
function openCpSettleDetail(eid){
  const [period,gameName,cpName]=eid.split('__');
  const a=calcCpSettleByGame(period,gameName,cpName);
  if(!a){alert('未找到对应分账记录');return;}
  const cloudOk=_cloudOkForAgg(a);
  const ready=a.allReady && cloudOk;
  // 按平台聚合（同平台多联运商合并）
  const platAgg={};
  a.platRows.forEach(pr=>{
    const k=pr.platform;
    if(!platAgg[k])platAgg[k]={platform:k,cashP:0,vP:0,pubCash:0,pubV:0,lossTransfer:false};
    platAgg[k].cashP+=pr.cashP;
    platAgg[k].vP+=pr.vP;
    platAgg[k].pubCash+=pr.pubCash;
    platAgg[k].pubV+=pr.pubV;
    platAgg[k].lossTransfer=platAgg[k].lossTransfer||pr.lossTransfer;
  });
  const platforms=Object.values(platAgg);
  const platRowsHtml=platforms.map(pr=>`<tr>
    <td>${pr.platform}</td>
    <td style="text-align:right">${mn(pr.cashP)}</td>
    <td style="text-align:right">${mn(pr.pubCash)}${pr.lossTransfer?'<div style="font-size:10.5px;color:var(--muted)">含亏损全划转</div>':''}</td>
    <td style="text-align:right">${mn(pr.vP)}</td>
    <td style="text-align:right">${mn(pr.pubV)}</td>
  </tr>`).join('');
  const statusTag=!a.allReady
    ? `<span class="tag" style="background:#fff3e0;color:#a05000;font-size:11px;border:1px solid #ffe0b2">待三方确认 ${a.notReadyCnt}/${a.totalRows}</span>`
    : (!cloudOk
        ? `<span class="tag" style="background:#fff3e0;color:#a05000;font-size:11px;border:1px solid #ffe0b2">待云成本确认</span>`
        : `<span class="tag green" style="font-size:11px">✓ 已确认</span>`);
  const cashCpStr=ready?`${mn(a.cpCash)}${a.cpCash<0?' <span style="color:var(--red);font-size:11px">▼ 负值·下账期冲抵</span>':''}`:'<span style="color:var(--weak)">—</span>';
  const vCpStr=ready?`${mn(a.cpV)}${a.cpV<0?' <span style="color:var(--red);font-size:11px">▼ 负值·下账期冲抵</span>':''}`:'<span style="color:var(--weak)">—</span>';
  const cloudNote=a.shareServer?'已扣减':'未扣减（规则未启用）';
  const body=`
    <div class="kv" style="margin-bottom:14px">
      <span class="k">账期</span><span class="v" style="font-weight:700">${a.period}</span>
      <span class="k">游戏</span><span class="v">《${a.gameName}》</span>
      <span class="k">CP</span><span class="v">${a.cpName}</span>
      <span class="k">CP 占比</span><span class="v" style="font-weight:800;color:var(--green)">${a.cpRemainShare}%</span>
      <span class="k">分账规则</span><span class="v" style="font-family:monospace;font-size:12px">${a.cpRule?a.cpRule.id:'未配置'}</span>
      <span class="k">状态</span><span class="v">${statusTag}</span>
    </div>

    <div style="font-size:13px;font-weight:700;color:var(--text);margin:14px 0 6px">📊 平台明细</div>
    <div class="tw"><table class="table">
      <thead><tr>
        <th style="width:25%">平台</th>
        <th style="text-align:right">Σ 现金利润</th>
        <th style="text-align:right">Σ 联运商现金分账</th>
        <th style="text-align:right">Σ 广告金利润</th>
        <th style="text-align:right">Σ 联运商广告金分账</th>
      </tr></thead>
      <tbody>${platRowsHtml||`<tr><td colspan="5" style="text-align:center;color:var(--weak);padding:14px">无平台明细</td></tr>`}</tbody>
    </table></div>

    <div style="background:#fffaf2;border:1px solid #ffe0b2;border-radius:8px;padding:10px 14px;margin-top:14px;font-size:12.5px;color:#8a4b00">
      <b>☁ 云服务成本（游戏维度汇总）：</b>${mn(a.sumServerCost)}
      <div style="color:var(--muted);font-size:11.5px;margin-top:4px">ⓘ 云服务以浑天仪项目为单位归集，无法按平台拆分；现金侧 ${cloudNote}、广告金侧不扣减</div>
    </div>

    <div style="background:#fafdff;border:1px solid #cfe0f5;border-radius:8px;padding:12px 14px;margin-top:14px;font-size:13px">
      <div style="font-weight:700;color:#1a4a80;margin-bottom:6px">💰 CP 分账计算</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;font-size:12.5px">
        <div>
          <div style="color:var(--muted);font-size:11.5px">现金分账基数</div>
          <div>Σ 现金利润 <b>${mn(a.sumCashP)}</b> − Σ 联运商分账 <b>${mn(a.sumPubCash)}</b>${a.shareServer?` − 云成本 <b>${mn(a.sumServerCost)}</b>`:''}</div>
          <div style="font-weight:800;color:${a.cashBase<0?'var(--red)':'var(--text)'};margin-top:2px">= ${mn(a.cashBase)}</div>
          <div style="color:var(--muted);font-size:11.5px;margin-top:6px">× ${a.cpRemainShare}% = <b style="color:${a.cpCash<0?'var(--red)':'var(--text)'};font-size:14px">${cashCpStr}</b></div>
        </div>
        <div>
          <div style="color:var(--muted);font-size:11.5px">广告金分账基数</div>
          <div>Σ 广告金利润 <b>${mn(a.sumVP)}</b> − Σ 联运商分账 <b>${mn(a.sumPubV)}</b></div>
          <div style="font-weight:800;color:${a.vBase<0?'var(--red)':'var(--text)'};margin-top:2px">= ${mn(a.vBase)}</div>
          <div style="color:var(--muted);font-size:11.5px;margin-top:6px">× ${a.cpRemainShare}% = <b style="color:${a.cpV<0?'var(--red)':'var(--text)'};font-size:14px">${vCpStr}</b></div>
        </div>
      </div>
    </div>`;
  openModal(`CP 分账详情 · 《${a.gameName}》· ${a.period}`,body);
}

/* PAGE: 账户打款流水 */
function pgBalance(){
  const ent=parsedEntity();
  const platF=window._balPlatF||'all';
  let data=FILTER_GAME==='all'?settle:settle.filter(r=>r.game===games.find(g=>g.id===FILTER_GAME)?.name);
  if(ent.type==='pub')data=data.filter(r=>r.pub===ent.name);
  if(ent.type==='cp')data=data.filter(r=>r.cp===ent.name);
  if(platF!=='all')data=data.filter(r=>r.platform===platF);
  // 三方（财务·业务运营·联运商）全部确认后计入账户打款流水
  const confirmedData=data.filter(r=>isSettleReady(r.period,r.game,r.platform));
  const unconfirmedCnt=data.length-confirmedData.length;
  const rows=confirmedData.map(r=>{
    const ps=calcPubSettle(r);
    const pubCash=ps.pubCash;
    const pubV=ps.pubV;
    const settled=pays.filter(p=>p.game===r.game&&p.platform===r.platform&&p.exec==='打款成功').reduce((s,p)=>s+p.amount,0);
    const inFlight=pays.filter(p=>p.game===r.game&&p.platform===r.platform&&p.exec==='打款中').reduce((s,p)=>s+p.amount,0);
    const bal=pubCash-settled-inFlight;
    const vUsed=Math.round(pubV*0.4*100)/100; // 广告金已消耗（mock：累计分成的40%）
    return {r,pubCash,pubV,vUsed,settled,inFlight,bal};
  });
  const totalPubV=rows.reduce((s,x)=>s+x.pubV,0);
  const totalVUsed=rows.reduce((s,x)=>s+x.vUsed,0);
  const balTab=window._balTab||'cash';
  // 构建现金流水账（Ledger）
  const ledgerEntries=[];
  // 1. 确认结算 → +入金
  confirmedData.forEach(r=>{
    const pubCash=calcPubSettle(r).pubCash;
    const isLoss=pubCash<0;
    ledgerEntries.push({
      date:`${r.period}-28 23:59`,
      pub:r.pub,
      type:isLoss?'账期亏损分摊':'账期结算入金',
      amount:Math.abs(pubCash),
      dir:isLoss?-1:+1,
      remark:`《${r.game}》${r.platform} ${r.period} ${isLoss?'账期亏损（成本超收入）':'账期结算入金'}`,
      sortKey:r.period+'-28 23:59'
    });
  });
  // 2. 打款记录 → 出入金
  let lpdata=FILTER_GAME==='all'?pays:pays.filter(p=>p.game===games.find(g=>g.id===FILTER_GAME)?.name);
  if(ent.type==='pub')lpdata=lpdata.filter(p=>p.pub===ent.name);
  if(ent.type==='cp')lpdata=[];
  if(platF!=='all')lpdata=lpdata.filter(p=>p.platform===platF);
  lpdata.forEach(p=>{
    let type,dir,style='';
    if(p.exec==='打款成功'){type='打款成功';dir=-1;style='color:var(--red)';}
    else if(p.exec==='打款中'){type='打款申请（冻结）';dir=-1;style='color:var(--orange)';}
    else return;
    const items=Array.isArray(p.items)&&p.items.length?p.items:[{game:p.game,platform:p.platform,amount:p.amount}];
    items.forEach(it=>{
      if(platF!=='all'&&it.platform!==platF)return;
      ledgerEntries.push({date:p.time,pub:p.pub,type,amount:it.amount,dir,remark:`申请单号 ${p.id} · 《${it.game}》${it.platform}${items.length>1?' [汇总单]':''}`,sortKey:p.time,style});
    });
  });
  // 按时间正序排序
  ledgerEntries.sort((a,b)=>a.sortKey<b.sortKey?-1:a.sortKey>b.sortKey?1:0);
  const vTable=tbl(['账期','游戏','平台','联运商','广告金累计分成','广告金已消耗','最新计算时间'],
    rows.map(({r,pubV,vUsed})=>`<tr>
      <td style="color:var(--muted)">${r.period}</td>
      <td>《${r.game}》</td><td>${r.platform}</td><td>${r.pub}</td>
      <td>${fmt(pubV)}</td><td style="color:var(--muted)">${fmt(vUsed)}</td>
      <td style="color:var(--muted);font-size:12px">2026-04-28 06:16</td></tr>`));
  return `<div class="ph">
    <div><div class="pt">账户流水</div><div class="pd">以联运商为账户维度，展示现金流水账单——结算入账与提款记录按时间排列。</div></div>
    <div class="acts"><button class="btn g" onclick="alert('原型展示：导出 Excel')">↓ 导出</button></div>
  </div>
  <div class="tabs">
    <button class="tab ${balTab==='cash'?'active':''}" onclick="window._balTab='cash';document.getElementById('contentEl').innerHTML=pgBalance()">现金账单</button>
    <button class="tab ${balTab==='v'?'active':''}" onclick="window._balTab='v';document.getElementById('contentEl').innerHTML=pgBalance()">广告金账单</button>
  </div>
  ${balTab==='cash'?`
  ${(()=>{
    // 联运商筛选
    const {visiblePubs}=visibleEntities();
    const selPubName=window._balPubName||(visiblePubs[0]?.name||'');
    const pubOpts=visiblePubs.map(p=>`<option value="${p.name}" ${p.name===selPubName?'selected':''}>${p.name}</option>`).join('');
    // 时间筛选（默认显示全部）
    const allDates=ledgerEntries.filter(e=>!selPubName||e.pub===selPubName).map(e=>e.date.slice(0,10)).sort();
    const minD=allDates[0]||'2026-01-01';
    const maxD=allDates[allDates.length-1]||'2026-12-31';
    const startD=window._balStart||'';
    const endD=window._balEnd||'';
    // 该联运商所有流水（用于明细展示）
    const allPubEntries=selPubName?ledgerEntries.filter(e=>e.pub===selPubName):ledgerEntries;
    // 时间筛选后用于展示
    const pubEntries=allPubEntries.filter(e=>{
      const d=e.date.slice(0,10);
      if(startD&&d<startD)return false;
      if(endD&&d>endD)return false;
      return true;
    });
    const visibleEntries=pubEntries;
    const pubRows=visibleEntries.slice().reverse().map(e=>{
      const isPos=e.dir>0;
      const amtStr=`<span style="font-variant-numeric:tabular-nums;font-weight:700;color:${isPos?'var(--green)':'var(--text)'}">${isPos?'+':''}${fmt(e.dir*e.amount)}</span>`;
      const typeTag=isPos
        ?`<span class="tag green" style="font-size:11px">${e.type}</span>`
        :e.type==='打款申请（冻结）'
          ?`<span class="tag orange" style="font-size:11px">${e.type}</span>`
          :e.type==='账期亏损分摊'
            ?`<span class="tag red" style="font-size:11px">${e.type}</span>`
            :`<span class="tag red" style="font-size:11px">${e.type}</span>`;
      return `<tr>
        <td style="color:var(--muted);font-size:12px;font-family:monospace;white-space:nowrap;width:160px">${e.date}</td>
        <td style="width:160px">${typeTag}</td>
        <td style="text-align:right;width:160px;font-family:monospace">${amtStr}</td>
        <td style="color:var(--muted);font-size:12px;white-space:normal;line-height:1.6">${e.remark||'—'}</td>
      </tr>`;
    });
    // 统计指标（始终基于全量数据，不受时间筛选影响）
    const totalIn=allPubEntries.filter(e=>e.type==='账期结算入金').reduce((s,e)=>s+e.amount,0);
    const totalLoss=allPubEntries.filter(e=>e.type==='账期亏损分摊').reduce((s,e)=>s+e.amount,0);
    const totalOut=allPubEntries.filter(e=>e.type==='打款成功').reduce((s,e)=>s+e.amount,0);
    const frozen=allPubEntries.filter(e=>e.type==='打款申请（冻结）').reduce((s,e)=>s+e.amount,0);
    const pubUnconfirmed=selPubName
      ?data.filter(r=>r.pub===selPubName&&!isSettleReady(r.period,r.game,r.platform)).length
      :unconfirmedCnt;
    const ledgerTbl=`<div class="card"><div class="tw"><table class="table" style="table-layout:fixed;width:100%">
      <colgroup><col style="width:160px"><col style="width:160px"><col style="width:160px"><col></colgroup>
      <thead><tr><th>时间</th><th>流水类型</th><th style="text-align:right">金额</th><th>摘要</th></tr></thead>
      <tbody>${pubRows.length?pubRows.join(''):`<tr><td colspan="4" style="text-align:center;color:var(--weak);padding:24px">暂无流水记录</td></tr>`}</tbody>
    </table></div></div>`;
    return `
    <div class="filter" style="margin-bottom:16px">
      <span style="color:var(--muted);font-size:12.5px">联运商账户</span>
      <select class="select" style="min-width:160px" onchange="window._balPubName=this.value;document.getElementById('contentEl').innerHTML=pgBalance()">${pubOpts||'<option>—</option>'}</select>
    </div>
    <div class="g3" style="margin-bottom:16px">
      <div class="metric">
        <div class="lb">累计结算入账</div>
        <div class="v">+${fmt(totalIn)}</div>
        <div class="ft">${totalLoss>0?`含亏损分摊 <span style="color:var(--red)">-${fmt(totalLoss)}</span>`:'已确认结算'}</div>
      </div>
      <div class="metric">
        <div class="lb">累计提款成功</div>
        <div class="v">${totalOut>0?fmt(totalOut):'—'}</div>
        <div class="ft">已到账金额</div>
      </div>
      <div class="metric">
        <div class="lb">冻结中</div>
        <div class="v" style="${frozen>0?'color:var(--orange)':''}">${frozen>0?'-'+fmt(frozen):'—'}</div>
        <div class="ft">提款待执行</div>
      </div>
    </div>
    ${pubUnconfirmed>0?`<div class="notice" style="border-color:#ffe0b2;background:#fff8f0;color:#a05000">⚠ 该联运商还有 <b>${pubUnconfirmed}</b> 条分账记录尚未确认，确认后方可入账。请前往「<button class="link" style="color:var(--orange);font-size:12.5px" onclick="go('settlePub')">联运商分账明细</button>」完成确认。</div>`:''}
    <div class="notice" style="border-color:#d0e8ff;background:#f0f7ff;color:#1a4a80">📋 <b>账单说明：</b>仅展示该联运商的<b>结算入账</b>（绿色 +）、<b>打款申请（冻结中）</b>（橙色 −）和<b>打款成功</b>（黑色 −）三类记录。列表按时间倒序展示。</div>
    <div style="display:flex;align-items:center;gap:10px;margin:18px 0 10px">

      <span style="color:var(--muted);font-size:12.5px;margin-left:12px">时间范围</span>
      <input type="date" class="input" style="width:150px" value="${startD}" min="${minD}" max="${maxD}" onchange="window._balStart=this.value;document.getElementById('contentEl').innerHTML=pgBalance()" />

      <input type="date" class="input" style="width:150px" value="${endD}" min="${minD}" max="${maxD}" onchange="window._balEnd=this.value;document.getElementById('contentEl').innerHTML=pgBalance()" />
      ${(startD||endD)?`<button class="link" style="font-size:12px" onclick="window._balStart=undefined;window._balEnd=undefined;document.getElementById('contentEl').innerHTML=pgBalance()">重置</button>`:''}
      <span style="color:var(--muted);font-size:12px;margin-left:auto">共 ${visibleEntries.length} 条</span>
    </div>

/* ──────── 占用判定（兼容旧单子项 + 新汇总单 items） ──────── */
function isItemOccupied(period,game,platform,pub){
  return pays.some(p=>{
    if(p.period!==period||p.pub!==pub)return false;
    if(p.approval==='已驳回'||p.exec==='已终止')return false;
    if(Array.isArray(p.items)&&p.items.length){
      return p.items.some(it=>it.game===game&&it.platform===platform);
    }
    return p.game===game&&p.platform===platform;
  });
}
function findOccupiedPay(period,game,platform,pub){
  return pays.find(p=>{
    if(p.period!==period||p.pub!==pub)return false;
    if(p.approval==='已驳回'||p.exec==='已终止')return false;
    if(Array.isArray(p.items)&&p.items.length){
      return p.items.some(it=>it.game===game&&it.platform===platform);
    }
    return p.game===game&&p.platform===platform;
  });
}

// 文件名金额解析：取文件名（去后缀）中最后一个数字 token（支持千分位与小数）
function parseAmtFromFilename(name){
  if(!name)return null;
  const base=name.replace(/\.[^.]+$/,'');
  const matches=base.match(/(\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+(?:\.\d+)?)/g);
  if(!matches||!matches.length)return null;
  const last=matches[matches.length-1].replace(/,/g,'');
  const v=parseFloat(last);
  return isNaN(v)?null:v;
}
function onPayFileChange(inputId,hintId){
  const input=document.getElementById(inputId);
  const hint=document.getElementById(hintId);
  if(!input||!hint)return;
  const f=input.files&&input.files[0];
  if(!f){return;}
  const sizeMb=(f.size/1024/1024).toFixed(2);
  if(f.size>10*1024*1024){hint.style.color='var(--red)';hint.textContent=`⚠ ${f.name} 超出 10MB 限制（${sizeMb}MB）`;return;}
  const expect=Number(window._paySettleAmt||0);
  const parsed=parseAmtFromFilename(f.name);
  if(parsed===null){hint.style.color='var(--red)';hint.textContent=`⚠ 未能从文件名识别金额：${f.name}（请在文件名中包含合计 ${fmt(expect)}）`;return;}
  if(Math.abs(parsed-expect)>0.01){hint.style.color='var(--red)';hint.textContent=`⚠ 文件金额 ${fmt(parsed)} 与合计 ${fmt(expect)} 不一致：${f.name}`;return;}
  hint.style.color='var(--green)';hint.textContent=`✓ 已选择：${f.name}（${sizeMb}MB） · 金额校验通过 ${fmt(parsed)}`;
}
function submitPay(){
  const expect=Number(window._paySettleAmt||0);
  if(expect<=0){alert('合计金额为 0，无法提交申请');return}
  const inv=document.getElementById('payInvoice');
  const bill=document.getElementById('payBill');
  if(!inv||!inv.files||!inv.files[0]){alert('请上传发票文件');return}
  if(!bill||!bill.files||!bill.files[0]){alert('请上传盖章对账单');return}
  const invAmt=parseAmtFromFilename(inv.files[0].name);
  const billAmt=parseAmtFromFilename(bill.files[0].name);
  if(invAmt===null||Math.abs(invAmt-expect)>0.01){
    alert(`发票文件金额与合计不一致：\n发票文件：${inv.files[0].name}\n解析金额：${invAmt===null?'未识别':fmt(invAmt)}\n合计：${fmt(expect)}`);
    return;
  }
  if(billAmt===null||Math.abs(billAmt-expect)>0.01){
    alert(`盖章对账单金额与合计不一致：\n对账单文件：${bill.files[0].name}\n解析金额：${billAmt===null?'未识别':fmt(billAmt)}\n合计：${fmt(expect)}`);
    return;
  }
  const selPubId=window._payPubId;
  const selPub=publishers.find(p=>p.id===selPubId);
  const selPeriod=window._payPeriod;
  if(!selPub||!selPeriod){alert('请选择联运商和账期');return}
  const ck=window._payChecked||{};
  const items=[];
  Object.keys(ck).forEach(k=>{
    if(!ck[k])return;
    const [pubId,period,gameId,platform]=k.split('__');
    if(pubId!==selPubId||period!==selPeriod)return;
    const g=games.find(x=>x.id===gameId);if(!g)return;
    const r=settle.find(x=>x.period===period&&x.game===g.name&&x.platform===platform&&x.pub===selPub.name);
    if(!r)return;
    const amt=Math.round(calcPubSettle(r).pubCash*100)/100;
    if(amt<=0)return;
    items.push({game:g.name,gameId,platform,amount:amt});
  });
  if(!items.length){alert('请至少勾选一条明细');return}
  pays.unshift({
    id:`PAY-${selPeriod.replace('-','')}-${String(pays.length+1).padStart(3,'0')}`,
    period:selPeriod,pub:selPub.name,
    game:items.length>1?`多游戏(${items.length})`:items[0].game,
    platform:items.length>1?'多平台':items[0].platform,
    items,
    amount:expect,approval:'待审批',exec:'待执行',
    time:new Date().toISOString().slice(0,16).replace('T',' '),
    bpm:'BPM-PAY-NEW',flow:'—',bkFlow:'—',reason:'—',
    invoiceFile:inv.files[0].name,billFile:bill.files[0].name
  });
  window._payChecked={};window._payCheckedInited=false;
  closeModal();
  alert(`原型展示：打款申请已提交 ${fmt(expect)}\n含 ${items.length} 项：\n${items.map(it=>'· 《'+it.game+'》 '+it.platform+' '+fmt(it.amount)).join('\n')}\n\n发票：${inv.files[0].name}\n对账单：${bill.files[0].name}\n\n系统将发起 BPM 审批，审批通过后银企直联自动转账。`);
  go(isPublisher()?'myPayments':'payments');
}

function pgPayments(){
  const ent=parsedEntity();

  // CP 无直接打款记录（Phase 1 线下处理），筛选 CP 时显示空
  if(ent.type==='cp')data=[];

  // 提取一笔打款单关联的账期集合（优先用对账单，其次 items，再退到 p.period）
  const payPeriods=(p)=>{
    let sn=p.statementSn||'';
    const stmts=window._generatedStatements||[];
    const s=sn?stmts.find(x=>x.sn===sn):stmts.find(x=>(x.paymentIds||[]).includes(p.id)||x.paymentId===p.id);
    if(s)return [...new Set((s.keys||[]).map(k=>k.split('__')[0]))];
    if(Array.isArray(p.items)&&p.items.length){
      const ps=[...new Set(p.items.map(it=>it.period).filter(Boolean))];

    }
    return p.period?[p.period]:[];
  };

  const periodF=window._payPeriod||'all';
  const apprF=window._payApproval||'all';
  const execF=window._payExec||'all';
  if(periodF!=='all')data=data.filter(p=>payPeriods(p).includes(periodF));
  if(apprF!=='all')data=data.filter(p=>p.approval===apprF);
  if(execF!=='all')data=data.filter(p=>p.exec===execF);
  const allPeriods=[...new Set(pays.flatMap(payPeriods))].sort().reverse();

    ?`<div class="notice" style="border-color:#ffd9b3;background:#fff7ec;color:#8a4b00">💼 <b>财务视图（内部）：</b>展示打款单的真实执行状态。失败单可发起「重新打款」追加一笔新流水到同一申请单；电子回单可下载留档。<br/><b style="color:var(--red)">⚠ 信息隔离：</b>对外（联运商视图）失败状态会被脱敏为「打款中」，避免联运商看到处理过程；新流水成功后再翻转为「打款成功」。</div>`

  const rows=[];

    const lastBk=last.bkFlow&&last.bkFlow!=='—'?last.bkFlow:'';
    const retryBadge=atts.length>1
      ?`<span class="tag" style="font-size:10px;margin-left:4px;background:#fff7ec;color:#a05000;border:1px solid #ffd9b3" title="共 ${atts.length} 次执行，点查看详情">↻ 共 ${atts.length} 次</span>`
      :'';
    const flowCell=`<div style="font-family:monospace;font-size:11.5px">${lastFlow}${retryBadge}${lastBk?`<div style="color:var(--muted);font-size:10.5px">银行 ${lastBk}</div>`:''}</div>`;
    rows.push(`<tr data-pay-id="${p.id}" style="${trStyle}"><td style="font-family:monospace;font-size:12px">${p.id}</td><td>${periodTxt}</td><td>${p.pub}</td><td style="font-weight:700">${fmt(p.amount)}</td><td>${ts(p.approval)}</td><td>${ts(p.exec)}</td><td>${stmtCell}</td><td>${flowCell}</td><td style="color:var(--muted)">${p.time}</td><td>${opCol(p)}</td></tr>`);
  });

  return `<div class="ph"><div><div class="pt">付款单管理${finView?'（财务内部视图）':''}</div><div class="pd">展示所有付款申请的真实审批状态与执行状态；打款失败条目标红，可查看失败原因。<b>申请由联运商在「对账单管理」按对账单一键发起</b>，财务在此审核与执行。${ent.type==='cp'?'<b style="color:var(--orange)">（Phase 1 中CP不参与直接打款，由财务线下处理）</b>':''}</div></div><div class="acts"><button class="btn g" onclick="alert('导出申请单列表（含失败处理记录）')">↓ 导出</button></div></div>
  ${banner}
  <div class="filter">
    <span style="font-size:12px;color:var(--muted);font-weight:650">账期</span>
    <select class="select" onchange="window._payPeriod=this.value;document.getElementById('contentEl').innerHTML=pgPayments()">
      <option value="all">全部账期</option>
      ${allPeriods.map(p=>`<option value="${p}" ${periodF===p?'selected':''}>${p}</option>`).join('')}
    </select>
    <select class="select" onchange="window._payApproval=this.value;document.getElementById('contentEl').innerHTML=pgPayments()">
      <option value="all" ${apprF==='all'?'selected':''}>全部审批状态</option>
      <option value="待审批" ${apprF==='待审批'?'selected':''}>待审批</option>
      <option value="已通过" ${apprF==='已通过'?'selected':''}>已通过</option>
      <option value="已驳回" ${apprF==='已驳回'?'selected':''}>已驳回</option>
    </select>
    <select class="select" onchange="window._payExec=this.value;document.getElementById('contentEl').innerHTML=pgPayments()">
      <option value="all" ${execF==='all'?'selected':''}>全部执行状态</option>
      <option value="待执行" ${execF==='待执行'?'selected':''}>待执行</option>
      <option value="打款中" ${execF==='打款中'?'selected':''}>打款中</option>
      <option value="打款成功" ${execF==='打款成功'?'selected':''}>打款成功</option>
      <option value="打款失败" ${execF==='打款失败'?'selected':''}>打款失败</option>
    </select>
    ${(periodF!=='all'||apprF!=='all'||execF!=='all')?`<button class="btn g sm" onclick="window._payPeriod='all';window._payApproval='all';window._payExec='all';document.getElementById('contentEl').innerHTML=pgPayments()">清除筛选</button>`:''}
    <span style="color:var(--muted);font-size:12px;margin-left:auto">共 ${data.length} 单</span>
  </div>
  ${tbl(['申请单号','账期','联运商','打款金额','审批状态','执行状态','关联对账单','流水单号','发起时间','操作'],rows,{pageKey:'payments'})}`;
}

/* PAGE: 我的打款记录（联运商专用 — 失败状态对外脱敏为「打款中」）
 * 设计意图：失败属于内部处理过程，避免联运商焦虑或重复催款；财务处理完成后再让状态翻转。
 */
function pgMyPayments(){
  const ent=parsedEntity();
  let data=pays;
  if(ent.type==='pub')data=data.filter(p=>p.pub===ent.name);
  if(FILTER_GAME!=='all')data=data.filter(p=>p.game===games.find(g=>g.id===FILTER_GAME)?.name);
  // 已合并为单条申请单 + attempts 数组，无需再过滤 relateId

  // 提取一笔打款单关联的账期集合（与财务视图同口径）
  const payPeriods=(p)=>{
    let sn=p.statementSn||'';
    const stmts=window._generatedStatements||[];
    const s=sn?stmts.find(x=>x.sn===sn):stmts.find(x=>(x.paymentIds||[]).includes(p.id)||x.paymentId===p.id);
    if(s)return [...new Set((s.keys||[]).map(k=>k.split('__')[0]))];
    if(Array.isArray(p.items)&&p.items.length){
      const ps=[...new Set(p.items.map(it=>it.period).filter(Boolean))];
      if(ps.length)return ps;
    }
    return p.period?[p.period]:[];
  };

  const periodF=window._myPayPeriod||'all';
  const apprF=window._myPayApproval||'all';
  const execF=window._myPayExec||'all';
  if(periodF!=='all')data=data.filter(p=>payPeriods(p).includes(periodF));
  if(apprF!=='all')data=data.filter(p=>p.approval===apprF);
  // 联运商视角脱敏：失败→打款中，已终止→已终止 · 待重新发起
  const maskForFilter=(s)=>s==='打款失败'?'打款中':s;
  if(execF!=='all')data=data.filter(p=>maskForFilter(p.exec)===execF);
  const allPeriods=[...new Set(pays.flatMap(payPeriods))].sort().reverse();

  // 脱敏映射：失败 → 打款中（财务内部处理中）；已终止 → 已终止 · 待重新发起（明确告知联运商）
  const maskExec=(s)=>s==='打款失败'?'打款中':(s==='已终止'?'已终止 · 待重新发起':s);

  const rows=[];
  data.forEach(p=>{
    const shown=maskExec(p.exec);
    const ops=`<button class="link" onclick="openMyPayDetail('${p.id}')">查看</button>${shown==='打款成功'?`<button class="link" style="margin-left:8px" onclick="alert('下载电子回单（Mock）：${p.id}')">下载回单</button>`:''}`;
    // 关联对账单：从 p.statementSn 直接取；或反查 _generatedStatements.paymentIds
    let stmtSn=p.statementSn||'';
    let stmtPeriods=null;
    if(!stmtSn){
      const s=(window._generatedStatements||[]).find(x=>(x.paymentIds||[]).includes(p.id)||x.paymentId===p.id);
      if(s){stmtSn=s.sn;stmtPeriods=[...new Set((s.keys||[]).map(k=>k.split('__')[0]))].sort();}
    }else{
      const s=(window._generatedStatements||[]).find(x=>x.sn===stmtSn);
      if(s)stmtPeriods=[...new Set((s.keys||[]).map(k=>k.split('__')[0]))].sort();
    }
    // 账期：优先用对账单的账期范围，没有就用 p.period 或 items 里的 period
    let periodTxt='—';
    if(stmtPeriods&&stmtPeriods.length){
      periodTxt=stmtPeriods.length===1?stmtPeriods[0]:`${stmtPeriods[0]} ~ ${stmtPeriods[stmtPeriods.length-1]}（${stmtPeriods.length} 期）`;
    }else if(Array.isArray(p.items)&&p.items.length){
      const ps=[...new Set(p.items.map(it=>it.period).filter(Boolean))].sort();
      if(ps.length)periodTxt=ps.length===1?ps[0]:`${ps[0]} ~ ${ps[ps.length-1]}（${ps.length} 期）`;
      else if(p.period)periodTxt=p.period;
    }else if(p.period){periodTxt=p.period;}
    const stmtCell=stmtSn?`<button class="link" style="font-family:monospace;font-size:12px;padding:0" onclick="go('statements');setTimeout(()=>highlightStmt('${stmtSn}'),50)">${stmtSn}</button>`:'<span style="color:var(--weak)">—</span>';
    // 流水单号（脱敏）：只展示成功流水；进行中/失败统一展示「处理中」
    // 流水单号（脱敏）：只展示最后一笔成功流水；未成功统一显示「处理中…」
    // 不附状态标签（与「执行状态」列重复），也不暴露重试次数（属于内部信息）
    const atts=Array.isArray(p.attempts)&&p.attempts.length?p.attempts:[{flow:p.flow,bkFlow:p.bkFlow,status:p.exec}];
    const lastOk=[...atts].reverse().find(a=>a.status==='打款成功');
    let flowCell;
    if(lastOk){
      flowCell=`<div style="font-family:monospace;font-size:11.5px">${lastOk.flow||'—'}${lastOk.bkFlow?`<div style="color:var(--muted);font-size:10.5px">银行 ${lastOk.bkFlow}</div>`:''}</div>`;
    }else{
      flowCell=`<span style="font-size:11.5px;color:var(--muted)">处理中…</span>`;
    }
    rows.push(`<tr data-pay-id="${p.id}"><td style="font-family:monospace;font-size:12px">${p.id}</td><td>${periodTxt}</td><td>${p.pub}</td><td style="font-weight:700">${fmt(p.amount)}</td><td>${ts(p.approval)}</td><td>${ts(shown)}</td><td>${stmtCell}</td><td>${flowCell}</td><td style="color:var(--muted)">${p.time}</td><td>${ops}</td></tr>`);
  });

  return `<div class="ph"><div><div class="pt">付款申请</div><div class="pd">查看本主体名下所有付款申请的进度。打款成功后可下载电子回单。${isPublisher()?'<br/><span style="color:var(--muted);font-size:12px">发起打款请到「<button class="link" style="color:var(--primary);font-size:12.5px" onclick=\'go("statements")\'>对账单管理</button>」，按对账单一键发起以保证金额一致。</span>':''}</div></div><div class="acts"><button class="btn g" onclick="alert('导出付款申请')">↓ 导出</button></div></div>
  <div class="notice" style="border-color:#d0e8ff;background:#f0f7ff;color:#1a4a80">👁 <b>只读视图：</b>本页面仅展示与本联运商相关的打款单。如对结果有疑问，请联系结算财务对接人。</div>
  <div class="filter"><select class="select"><option>全部审批状态</option><option>待审批</option><option>已通过</option><option>已驳回</option></select><select class="select"><option>全部执行状态</option><option>待执行</option><option>打款中</option><option>打款成功</option></select></div>
  ${tbl(['申请单号','账期','联运商','打款金额','审批状态','执行状态','关联对账单','流水单号','发起时间','操作'],rows,{pageKey:'myPayments'})}`;
}

/* PAGE: 对账单管理 */
function pgStatements(){
  const list=window._generatedStatements||[];
  const ent=parsedEntity();
  let data=list.slice().reverse(); // 最新在前
  if(ent.type==='pub')data=data.filter(s=>s.pub===ent.name);
  const statusF=window._stmtStatus||'all';
  const pubF=window._stmtPub||'all';
  const periodF=window._stmtPeriod||'all';
  if(pubF!=='all')data=data.filter(s=>s.pub===pubF);
  if(periodF!=='all')data=data.filter(s=>{
    const ps=[...new Set((s.keys||[]).map(k=>k.split('__')[0]))];
    return ps.includes(periodF);
  });
  const allPubs=[...new Set(list.map(s=>s.pub).filter(Boolean))];
  const allPeriods=[...new Set(list.flatMap(s=>(s.keys||[]).map(k=>k.split('__')[0])))].sort().reverse();
  const rows=data.map(s=>{
    const keys=s.keys||[];
    const periods=[...new Set(keys.map(k=>k.split('__')[0]))].sort();
    const games=[...new Set(keys.map(k=>k.split('__')[1]))];
    // 计算金额合计
    let total=0;
    keys.forEach(k=>{
      const [p,g,pl]=k.split('__');
      const r=settle.find(x=>x.period===p&&x.game===g&&x.platform===pl);
      if(r){const ps=calcPubSettle(r);total+=ps.pubCash||0;}
    });
    const periodTxt=periods.length===1?periods[0]:`${periods[0]} ~ ${periods[periods.length-1]}（${periods.length} 期）`;
    // 关联打款单：最新一笔决定能否再次发起
    const payIds=Array.isArray(s.paymentIds)?s.paymentIds:(s.paymentId?[s.paymentId]:[]);
    const linkedPays=payIds.map(pid=>(pays||[]).find(p=>p.id===pid)).filter(Boolean);
    const latest=linkedPays.length?linkedPays[linkedPays.length-1]:null;
    // 最新一笔为「终态-成功」或"打款中"时禁止再发起；为「已终止/已驳回」时允许再发起；无任何打款单时也允许
    const canStartNewPay=!latest||latest.exec==='已终止'||latest.approval==='已驳回';
    const execColorMap={'打款成功':'var(--green)','打款失败':'var(--red)','已终止':'var(--muted)','待执行':'#a05000','打款中':'var(--primary)'};
    const apprColorMap={'已通过':'var(--green)','待审批':'#a05000','已驳回':'var(--red)'};
    const payCellInner=linkedPays.length===0
      ? '<span style="color:var(--weak)">—</span>'
      : `<div style="display:flex;flex-direction:column;gap:3px">
          ${linkedPays.map((p,i)=>{
            const isLatest=i===linkedPays.length-1;
            const shown=p.exec==='打款失败'?'打款中':p.exec; // 联运商视角脱敏
            const execColor=execColorMap[shown]||'var(--text)';
            return `<div style="display:flex;align-items:center;gap:6px;font-size:11.5px">
              <button class="link" style="font-family:monospace;padding:0;${isLatest?'font-weight:700':'opacity:.7'}" onclick="go('myPayments');setTimeout(()=>highlightPay('${p.id}'),50)">${p.id}</button>
              <span style="background:#f7fafc;border-radius:6px;padding:0 6px;color:${execColor};font-weight:600">${shown}</span>
              ${isLatest&&linkedPays.length>1?'<span style="font-size:10px;color:var(--weak)">(最新)</span>':''}
            </div>`;
          }).join('')}
          ${linkedPays.length>1?`<div style="font-size:10.5px;color:var(--muted);margin-top:2px">共 ${linkedPays.length} 笔</div>`:''}
        </div>`;
    return `<tr>
      <td style="font-family:monospace;font-size:12px;font-weight:700">${s.sn}</td>
      <td>${s.pub||'<span style="color:var(--weak)">—</span>'}</td>
      <td>${periodTxt}</td>
      <td>${games.map(g=>`《${g}》`).join('、')}<div style="font-size:10.5px;color:var(--muted);margin-top:2px">${keys.length} 条明细</div></td>
      <td style="font-weight:700">${mn(total)}</td>
      <td style="color:var(--muted);font-size:12px">${s.createdAt||'—'}</td>
      <td>${payCellInner}</td>
      <td>
        <button class="link" onclick="openStatementPreview('${s.sn}')">预览</button>
        <button class="link" onclick="alert('原型展示：对账单 ${s.sn} 已下载 PDF / Excel')">下载</button>
        ${isPublisher()&&canStartNewPay?`<button class="btn p sm" style="margin-left:6px;box-shadow:0 1px 2px rgba(31,80,160,.18)" onclick="openPayFromStatement('${s.sn}')">${linkedPays.length?'🔁 重新发起打款':'＋ 发起打款'}</button>`:''}
      </td>
    </tr>`;
  });
  return `<div class="ph"><div><div class="pt">对账单管理</div><div class="pd">联运商在此勾选多个已确认账期合并生成<b>分账结算对账单</b>，并可在每行直接发起打款；财务/业务可查看历史对账单。</div></div><div class="acts">${isPublisher()?`<button class="btn p" onclick="openGenBillStatement()">＋ 生成对账单</button>`:''}<button class="btn g" onclick="alert('原型展示：导出 Excel')">↓ 导出</button></div></div>
  <div class="filter" style="margin-bottom:16px">
    <span style="font-size:12px;color:var(--muted);font-weight:650">联运商</span>
    <select class="select" onchange="window._stmtPub=this.value;document.getElementById('contentEl').innerHTML=pgStatements()">
      <option value="all">全部联运商</option>
      ${allPubs.map(p=>`<option value="${p}" ${pubF===p?'selected':''}>${p}</option>`).join('')}
    </select>
    <span style="font-size:12px;color:var(--muted);font-weight:650;margin-left:8px">账期</span>
    <select class="select" onchange="window._stmtPeriod=this.value;document.getElementById('contentEl').innerHTML=pgStatements()">
      <option value="all">全部账期</option>
      ${allPeriods.map(p=>`<option value="${p}" ${periodF===p?'selected':''}>${p}</option>`).join('')}
    </select>
    ${(pubF!=='all'||periodF!=='all')?`<button class="btn g sm" onclick="window._stmtPub='all';window._stmtPeriod='all';document.getElementById('contentEl').innerHTML=pgStatements()">清除筛选</button>`:''}
    <span style="color:var(--muted);font-size:12px;margin-left:auto">共 ${data.length} 份对账单</span>
  </div>
  ${tbl(['对账单编号','联运商','账期范围','涉及游戏','结算金额','生成时间','关联打款单','操作'],rows,{pageKey:'statements'})}`;
}
function openStatementPreview(sn){
  const s=(window._generatedStatements||[]).find(x=>x.sn===sn);
  if(!s){alert('对账单不存在');return;}
  const html=buildMultiBillStatementHtml(s.keys||[]);
  openModal(`对账单预览 · ${sn}`,
    `<div style="background:#f5f5f5;padding:14px;border-radius:6px">${html||'<div style="padding:20px;color:var(--muted)">无法重建对账单内容</div>'}</div>`,
    `<button class="btn g" onclick="closeModal()">关闭</button><button class="btn p" onclick="alert('原型展示：对账单 ${sn} 已下载 PDF / Excel')">↓ 下载对账单</button>`);
}
// 跨页跳转后的高亮辅助：闪烁定位到目标行
function _flashRow(row){
  if(!row)return;
  row.scrollIntoView({behavior:'smooth',block:'center'});
  const orig=row.style.background||'';
  row.style.transition='background 0.4s';
  row.style.background='#fff3cd';
  setTimeout(()=>{row.style.background=orig;},1600);
}
function highlightPay(payId){
  const row=document.querySelector(`tr[data-pay-id="${payId}"]`);
  _flashRow(row);
}
function highlightStmt(sn){
  // 在对账单管理页中找出 SN 所在行
  const rows=document.querySelectorAll('tr');
  for(const r of rows){
    if(r.textContent&&r.textContent.includes(sn)){_flashRow(r);break;}
  }
}
// 按对账单一键发起打款：金额锁定为对账单金额合计，强制上传发票。
// 一份对账单可关联多笔打款单（前次终止/驳回后允许再次发起）。
function openPayFromStatement(sn){
  const s=(window._generatedStatements||[]).find(x=>x.sn===sn);
  if(!s){alert('对账单不存在');return;}
  // 兼容老字段：把 s.paymentId 升级成 s.paymentIds 数组
  if(!Array.isArray(s.paymentIds))s.paymentIds=s.paymentId?[s.paymentId]:[];
  const linkedPays=s.paymentIds.map(pid=>(pays||[]).find(p=>p.id===pid)).filter(Boolean);
  const latest=linkedPays.length?linkedPays[linkedPays.length-1]:null;
  // 最新一笔仍在生效（非已终止/已驳回）时拦截
  if(latest&&latest.exec!=='已终止'&&latest.approval!=='已驳回'){
    alert(`该对账单的最新打款单 ${latest.id} 仍在处理中（${latest.approval} / ${latest.exec}），请勿重复发起`);return;
  }
  const keys=s.keys||[];
  const items=[];
  let total=0;
  keys.forEach(k=>{
    const [period,game,platform]=k.split('__');
    const r=settle.find(x=>x.period===period&&x.game===game&&x.platform===platform);
    if(!r)return;
    const ps=calcPubSettle(r);
    const amt=Math.round((ps.pubCash||0)*100)/100;
    const gameRec=games.find(x=>x.name===game);
    items.push({period,game,gameId:gameRec?gameRec.id:game,platform,amount:amt});
    total+=amt;
  });
  total=Math.round(total*100)/100;
  if(total<=0){alert('对账单金额合计为 0 或负数，无法发起打款');return;}
  window._payFromSn=sn;
  window._payFromTotal=total;
  window._payFromItems=items;
  const periods=[...new Set(items.map(x=>x.period))].sort();
  const games2=[...new Set(items.map(x=>x.game))];
  const pubInfo=publishers.find(x=>x.name===(s.pub||''));
  const isRetry=latest&&(latest.exec==='已终止'||latest.approval==='已驳回');
  const retryNotice=isRetry
    ?`<div class="notice" style="border-color:#ffd9b3;background:#fff7ec;color:#7a5300;margin-bottom:10px">🔁 <b>重新发起打款</b>：上一笔 <b style="font-family:monospace">${latest.id}</b> ${latest.exec==='已终止'?'已终止':'被驳回'}（原因：${latest.reason||'—'}）。本次将作为新打款单关联到同一对账单。</div>`
    :'';
  openModal(`${isRetry?'重新发起':'发起'}打款 · ${sn}`,
    `${retryNotice}<div class="notice" style="border-color:#d0e8ff;background:#f0f7ff;color:#1a4a80">📋 按对账单 <b>${sn}</b> 一键发起打款，金额由对账单锁定，不可修改，确保与对账单完全一致。</div>
    <div class="kv">
      <span class="k">对账单编号</span><span class="v" style="font-family:monospace;font-weight:700">${sn}</span>
      <span class="k">联运商</span><span class="v">${s.pub||'—'}</span>

function submitPayFromStatement(sn){
  const inv=document.getElementById('payInv');
  if(!inv||!inv.files||!inv.files[0]){alert('请先上传发票');return;}
  const stmt=document.getElementById('payStmt');
  if(!stmt||!stmt.files||!stmt.files[0]){alert('请上传盖章对账单');return;}
  const s=(window._generatedStatements||[]).find(x=>x.sn===sn);
  if(!s){alert('对账单不存在');return;}
  if(!Array.isArray(s.paymentIds))s.paymentIds=s.paymentId?[s.paymentId]:[];
  const items=window._payFromItems||[];
  const total=window._payFromTotal||0;
  if(!items.length||total<=0){alert('对账单数据异常');return;}
  // 生成新打款单（追加到对账单的 paymentIds 数组）
  const today=new Date();
  const payId='PAY-'+today.toISOString().slice(0,10).replace(/-/g,'').slice(2)+'-'+String((pays||[]).length+1).padStart(3,'0');
  const first=items[0];
  const newPay={
    id:payId,period:first.period,game:items.length===1?first.game:'（多游戏）',platform:items.length===1?first.platform:'—',
    pub:s.pub||'',amount:total,approval:'待审批',exec:'待执行',
    time:today.toLocaleString('zh-CN',{hour12:false}),
    bpm:'BPM-PAY-'+String(1100+(pays||[]).length+1),
    flow:'',bkFlow:'',reason:'—',
    invoiceFile:inv.files[0].name,billFile:stmt.files[0].name,
    statementSn:sn,
    items:items.map(it=>({game:it.game,gameId:it.gameId,platform:it.platform,amount:it.amount,period:it.period}))
  };
  (pays||(window.pays=[])).push(newPay);
  s.paymentIds.push(payId);
  closeModal();
  alert(`已生成付款申请单 ${payId}\n金额：¥ ${fmt(total)}\n已关联对账单 ${sn}（共 ${s.paymentIds.length} 笔）`);
  renderPage();
}

/* PAGE: 票据管理（仅含打款成功的记录，按账期 × 联运商汇总结算金额，并提供发票/对账单查看） */
function pgInvoices(){
  const ent=parsedEntity();
  const allPeriodsAsc=[...new Set(pays.filter(p=>p.exec==='打款成功'&&p.period).map(p=>p.period))].sort();
  const startF=window._invStart||(allPeriodsAsc[0]||'2026-03');
  const endF=window._invEnd||(allPeriodsAsc[allPeriodsAsc.length-1]||'2026-04');
  const pubF=window._invPub||'all';
  let data=pays.filter(p=>p.exec==='打款成功'&&p.period);
  if(FILTER_GAME!=='all'){
    const g=games.find(x=>x.id===FILTER_GAME);
    if(g)data=data.filter(p=>p.game===g.name);
  }
  if(ent.type==='pub')data=data.filter(p=>p.pub===ent.name);
  if(ent.type==='cp')data=[];
  data=data.filter(p=>p.period>=startF&&p.period<=endF);
  if(pubF!=='all')data=data.filter(p=>p.pub===pubF);

  // 按 账期 × 联运商 汇总（保留供下方"涉及联运商/笔数"等指标使用）
  const groupMap=new Map();
  data.forEach(p=>{
    const k=`${p.period}__${p.pub}`;
    if(!groupMap.has(k))groupMap.set(k,{period:p.period,pub:p.pub,items:[],total:0});
    const g=groupMap.get(k);g.items.push(p);g.total+=p.amount;
  });

  // 指标
  const totalAmt=data.reduce((s,p)=>s+p.amount,0);
  const totalCnt=data.length;
  const pubSet=new Set(data.map(p=>p.pub));
  const totalInv=data.filter(p=>p.invoiceFile).length;

  // 联运商筛选选项（基于当前 FILTER_GAME / 时间范围）
  const pubOpts=['<option value="all"'+(pubF==='all'?' selected':'')+'>全部联运商</option>',
    ...[...new Set(data.map(p=>p.pub))].map(n=>`<option value="${n}" ${pubF===n?'selected':''}>${n}</option>`)].join('');

  // 每条申请单一行：账期 / 联运商 / 游戏 / 平台 / 申请单号 / 打款时间 / 银行流水号 / 打款金额 / 票据
  data.sort((a,b)=>a.period<b.period?1:a.period>b.period?-1:(a.pub<b.pub?-1:a.pub>b.pub?1:(a.time<b.time?1:-1)));
  const rows=[];
  if(data.length===0){
    rows.push(`<tr><td colspan="9" style="text-align:center;color:var(--weak);padding:24px">所选条件下暂无已打款成功记录</td></tr>`);
  }else{
    data.forEach(p=>{
      const invBtn=p.invoiceFile?`<button class="link" onclick="openInvoicePreview('${p.id}','invoice')">查看发票</button>`:'<span style="color:var(--weak)">—</span>';
      const billBtn=p.billFile?`<button class="link" style="margin-left:6px" onclick="openInvoicePreview('${p.id}','bill')">查看对账单</button>`:'';
      const items=Array.isArray(p.items)&&p.items.length?p.items:[{game:p.game,platform:p.platform,amount:p.amount}];
      const isBatch=items.length>1;
      const expandKey=`inv_${p.id}`;
      const expanded=window._payExpanded&&window._payExpanded[expandKey];
      const gameCell=isBatch?`<button class="link" onclick="togglePayRow('${expandKey}')">${expanded?'▾':'▸'} 多游戏</button><div style="font-size:11px;color:var(--muted);margin-top:2px">含 ${items.length} 项</div>`:`《${items[0].game}》`;
      const platCell=isBatch?'<span style="color:var(--muted)">—</span>':items[0].platform;
      rows.push(`<tr>
        <td>${p.period}</td>
        <td>${p.pub}</td>
        <td>${gameCell}</td>
        <td>${platCell}</td>
        <td style="font-family:monospace;font-size:12px;color:var(--muted)">${p.id}</td>
        <td style="color:var(--muted)">${p.time}</td>
        <td style="font-family:monospace;font-size:12px;color:var(--muted)">${p.bkFlow||'—'}</td>
        <td style="text-align:right;font-weight:700">${fmt(p.amount)}</td>
        <td>${invBtn}${billBtn}<button class="link" style="margin-left:6px" onclick="openPayDetail('${p.id}')">申请单详情</button></td>
      </tr>`);
      if(isBatch&&expanded){
        items.forEach(it=>{
          rows.push(`<tr style="background:#fafbfc;color:#555"><td colspan="2"></td><td style="padding-left:16px;color:var(--muted);font-size:12px">└ 《${it.game}》</td><td>${it.platform}</td><td colspan="3" style="color:var(--weak)"></td><td style="text-align:right;font-family:monospace">${fmt(it.amount)}</td><td></td></tr>`);
        });
      }
    });
  }

  return `<div class="ph">
    <div><div class="pt">票据管理</div><div class="pd">按账期查看每个联运商已完成结算的金额，并查看付款申请单中提交的发票与盖章对账单。<b style="color:var(--primary)">仅展示「打款成功」的记录</b>。</div></div>
    <div class="acts"><button class="btn g" onclick="alert('原型展示：批量导出票据（含发票与对账单 ZIP 包）')">↓ 导出</button></div>
  </div>
  <div class="g4" style="margin-bottom:14px">
    <div class="metric"><div class="lb">结算金额合计</div><div class="v" style="color:var(--primary)">${fmt(totalAmt)}</div><div class="ft">账期 ${startF} ~ ${endF}</div></div>
    <div class="metric"><div class="lb">已结算笔数</div><div class="v">${totalCnt}</div><div class="ft">打款成功的申请单</div></div>
    <div class="metric"><div class="lb">涉及联运商</div><div class="v">${pubSet.size}</div><div class="ft">主体数量</div></div>
    <div class="metric"><div class="lb">发票归档</div><div class="v">${totalInv} / ${totalCnt}</div><div class="ft">已上传发票笔数</div></div>
  </div>
  <div class="filter" style="margin-bottom:16px">
    <span style="font-size:12px;color:var(--muted);font-weight:650">开始账期</span>
    <select class="select" onchange="window._invStart=this.value;document.getElementById('contentEl').innerHTML=pgInvoices()">
      ${allPeriodsAsc.map(p=>`<option value="${p}" ${startF===p?'selected':''}>${p}</option>`).join('')}
    </select>
    <span style="font-size:12px;color:var(--muted);font-weight:650">结束账期</span>
    <select class="select" onchange="window._invEnd=this.value;document.getElementById('contentEl').innerHTML=pgInvoices()">
      ${allPeriodsAsc.map(p=>`<option value="${p}" ${endF===p?'selected':''}>${p}</option>`).join('')}
    </select>
    <span style="font-size:12px;color:var(--muted);font-weight:650;margin-left:8px">联运商</span>
    <select class="select" onchange="window._invPub=this.value;document.getElementById('contentEl').innerHTML=pgInvoices()">${pubOpts}</select>
  </div>
  ${tbl(['账期','联运商','游戏','平台','申请单号','打款时间','银行流水号','打款金额','票据'],rows,{pageKey:'invoices'})}`;
}

/* 联运商：打款单详情（失败状态在 UI 层伪装为「打款中」，不暴露失败原因/银行流水等内部字段） */
function openMyPayDetail(id){
  const p=pays.find(x=>x.id===id);
  const pub=publishers.find(x=>x.name===p.pub);
  const masked=p.exec==='打款失败'?'打款中':(p.exec==='已终止'?'已终止 · 待重新发起':p.exec);
  const isProcessing=masked==='打款中';
  openModal(`打款详情：${p.id}`,`
  <div class="stepper">
    ${[['提交申请','done'],['审批',p.approval==='待审批'?'act':'done'],['银企打款',isProcessing?'act':masked==='打款成功'?'done':''],['完成',masked==='打款成功'?'done':'']].map((s,i)=>(i>0?'<div class="sline"></div>':'')+`<div class="step ${s[1]}"><span class="sc">${s[1]==='done'?'✓':(i+1)}</span>${s[0]}</div>`).join('')}
  </div>
  ${isProcessing?'<div class="notice" style="border-color:#d0e8ff;background:#f0f7ff;color:#1a4a80">⏳ 打款处理中，到账时间以银行实际为准。如超过 3 个工作日仍未到账，请联系结算财务。</div>':''}
  <div class="kv"><span class="k">申请单号</span><span class="v" style="font-family:monospace">${p.id}</span><span class="k">账期</span><span class="v">${p.period||'—'}</span><span class="k">打款金额</span><span class="v" style="font-size:15px;font-weight:800">${fmt(p.amount)}</span><span class="k">审批状态</span><span class="v">${ts(p.approval)}</span><span class="k">执行状态</span><span class="v">${ts(masked)}</span><span class="k">发起时间</span><span class="v">${p.time}</span>${(()=>{
    // 联运商视图：仅展示最后一笔成功流水（如有），未成功则不展示流水号避免暴露内部重试过程
    const atts=Array.isArray(p.attempts)&&p.attempts.length?p.attempts:[{flow:p.flow,bkFlow:p.bkFlow,status:p.exec}];
    const ok=[...atts].reverse().find(a=>a.status==='打款成功');
    return ok?`<span class="k">流水单号</span><span class="v" style="font-family:monospace">${ok.flow||'—'}</span><span class="k">银行交易号</span><span class="v" style="font-family:monospace">${ok.bkFlow||'—'}</span>`:'';
  })()}</div>
  ${_renderPayItems(p)}
  <div class="sec-title">收款账户</div>
  <div class="kv"><span class="k">账户名称</span><span class="v">${pub?pub.accName:'—'}</span><span class="k">开户银行</span><span class="v">${pub?pub.bank:'—'}</span><span class="k">银行账号</span><span class="v" style="font-family:monospace">${pub?'****'+pub.acc:'—'}</span></div>
  <div class="sec-title">附件文件</div>
  ${_renderPayAttachments(p)}
  ${masked==='打款成功'?'<div style="margin-top:14px"><button class="btn g" onclick="alert(\'下载电子回单（Mock）\')">↓ 下载电子回单</button></div>':''}`)
}

function openPayDetail(id){
  const p=pays.find(x=>x.id===id);

  const isFail=p.exec==='打款失败';
  const isTerm=p.exec==='已终止';
  const finView=canFin();
  const failBanner=isFail
    ?`<div class="alert">⚠ 打款失败原因：${p.reason}<div style="margin-top:6px;font-size:12px;color:var(--muted)">⚠ 此状态对联运商<b>不可见</b>（脱敏为「打款中」）。财务可发起「重新打款」生成新单（自动关联本单号），新单成功后联运商视图自动翻转为「打款成功」；如失败需修改申请单内容（账户/金额等），可点击「终止流程」释放该账期占用，修正后重新发起。</div></div>`
    :(isTerm?`<div class="alert" style="background:#f0f0f0;border-color:#ccc;color:#444">🛑 该申请单已被终止${p.terminatedBy?`（操作人：${p.terminatedBy}`:''}${p.terminatedAt?` · ${p.terminatedAt}）`:'）'}<div style="margin-top:6px;font-size:12px;color:var(--muted)">该账期占用已释放，可重新发起申请。原失败原因：${p.reason||'—'}</div></div>`:'');
  const footActs=[];
  if(p.exec==='打款成功')footActs.push(`<button class="btn g" onclick="alert('下载电子回单（Mock）')">↓ 下载电子回单</button>`);

    footActs.push(`<button class="btn p" onclick="closeModal();openRepay('${p.id}')">↻ 重新打款</button>`);
    footActs.push(`<button class="btn g" style="border-color:#a04000;color:#a04000" onclick="closeModal();terminatePay('${p.id}')">🛑 终止流程</button>`);
  }

  openModal(`打款申请详情：${p.id}（财务内部视图）`,`${failBanner}

  </div>
  <div class="kv"><span class="k">申请单号</span><span class="v" style="font-family:monospace">${p.id}</span><span class="k">账期</span><span class="v">${p.period||'—'}</span><span class="k">联运商</span><span class="v">${p.pub}</span><span class="k">打款金额</span><span class="v" style="font-size:15px;font-weight:800">${fmt(p.amount)}</span><span class="k">审批状态</span><span class="v">${ts(p.approval)}</span><span class="k">执行状态</span><span class="v">${ts(p.exec)}</span><span class="k">发起时间</span><span class="v">${p.time}</span><span class="k">BPM实例号</span><span class="v" style="font-family:monospace">${p.bpm}</span></div>

  ${_renderPayItems(p)}
  <div class="sec-title">收款账户快照（提交时锁定）</div>
  <div class="kv"><span class="k">账户名称</span><span class="v">${pub?pub.accName:'—'}</span><span class="k">开户银行</span><span class="v">${pub?pub.bank:'—'}</span><span class="k">银行账号</span><span class="v" style="font-family:monospace">${pub?'****'+pub.acc:'—'}</span><span class="k">联行号</span><span class="v" style="font-family:monospace">${pub?pub.bankNo:'—'}</span></div>

  ${_renderPayAttachments(p)}
  ${footActs.length?`<div style="margin-top:14px;display:flex;gap:8px">${footActs.join('')}</div>`:''}`)
}
// 打款流水（attempts）：一笔申请单可能对应多次银行执行；详情面板独立展示一份历史
function _renderPayAttempts(p){
  const atts=Array.isArray(p.attempts)&&p.attempts.length?p.attempts:[{flow:p.flow,bkFlow:p.bkFlow,time:p.time,status:p.exec,reason:p.reason}];
  const rows=atts.map((a,i)=>`<tr>
    <td style="text-align:center">#${i+1}</td>
    <td style="font-family:monospace;font-size:12px">${a.flow||'—'}</td>
    <td style="font-family:monospace;font-size:12px;color:var(--muted)">${a.bkFlow||'—'}</td>

  </tr>`).join('');
  const label=atts.length>1?`打款流水（${atts.length} 次执行）`:'打款流水';

// 对账单口径明细表（账期/游戏/平台/收入/总消耗/现金成本/现金利润/分成比例/可结算+合计）
// 发起打款 与 申请单详情 共用，确保两侧字段一致；无对账单/无可解析记录时返回空串
function _renderStmtBreakdown(stmtSn,stmtKeys){
  if(!stmtKeys||!stmtKeys.length)return '';
  const rs=stmtKeys.map(k=>{const [period,game,platform]=k.split('__');const raw=settle.find(x=>x.period===period&&x.game===game&&x.platform===platform);return raw?effectiveSettle(raw):null}).filter(Boolean);
  if(!rs.length)return '';
  let sumCashRev=0,sumVRev=0,sumTotalRev=0,sumCost=0,sumCashCost=0,sumCashP=0,sumPubCash=0;
  const lines=rs.map(r=>{
    const ps=calcPubSettle(r);
    const cashRev=r.cashRev||0;
    const vRev=r.vRev||0;
    const totalRev=cashRev+vRev;
    const cost=r.cost||0;
    const cashCost=totalRev>0?cost*cashRev/totalRev:0;
    const cashP=cashRev-cashCost;
    sumCashRev+=cashRev;sumVRev+=vRev;sumTotalRev+=totalRev;sumCost+=cost;sumCashCost+=cashCost;sumCashP+=cashP;sumPubCash+=ps.pubCash;
    const tierTag=ps.tierApplied?'阶梯Ⅱ':(ps.rule&&ps.rule.tierEnabled?'阶梯Ⅰ':'—');
    return `<tr>
      <td class="sbk-c">${r.period}</td>
      <td class="sbk-l">《${r.game}》</td>
      <td class="sbk-c">${r.platform}</td>
      <td class="sbk-n">${mn(cashRev)}</td>
      <td class="sbk-n">${mn(vRev)}</td>
      <td class="sbk-n" style="font-weight:600">${mn(totalRev)}</td>
      <td class="sbk-n">${mn(cost)}</td>
      <td class="sbk-n">${mn(cashCost)}</td>
      <td class="sbk-n" style="font-weight:600">${mn(cashP)}</td>
      <td class="sbk-c">${ps.rate}%<div style="font-size:10.5px;color:var(--muted);margin-top:2px">${tierTag}</div></td>
      <td class="sbk-n" style="font-weight:700">${mn(ps.pubCash)}</td>
    </tr>`;
  }).join('');
  return `<style>
    .sbk{border:1px solid #c4ccd6;border-radius:6px;overflow:hidden;background:#fff}
    .sbk-tw{overflow-x:auto}
    .sbk table{border-collapse:collapse;font-size:12px;width:auto;min-width:100%}
    .sbk th,.sbk td{border:1px solid #d8dde3;padding:7px 10px;line-height:1.45;vertical-align:middle;white-space:nowrap}
    .sbk thead th{background:#eef3fb;color:#1a3a6a;font-weight:700;text-align:center;font-size:12px;border-color:#c4ccd6}
    .sbk thead .gh{background:#dde7f5;letter-spacing:1px}
    .sbk tbody tr:nth-child(odd) td{background:#fcfdff}
    .sbk tbody tr:hover td{background:#f4f8ff}
    .sbk .sbk-c{text-align:center}
    .sbk .sbk-l{text-align:left}
    .sbk .sbk-n{text-align:right;font-family:"SF Mono","Roboto Mono",Consolas,Menlo,monospace;font-variant-numeric:tabular-nums}
    .sbk tfoot td{background:#fff5d6 !important;font-weight:800;border-top:2px solid #d8c476}
    .sbk tfoot .sbk-pay{color:#1f50a0}
  </style>
  <div class="sec-title">打款明细${stmtSn?`<span style="color:var(--muted);font-weight:400;font-size:12px;margin-left:8px">按对账单 <b style="font-family:monospace">${stmtSn}</b> 锁定</span>`:''}</div>
  <div class="sbk" style="margin-bottom:6px"><div class="sbk-tw"><table>
    <thead>
      <tr class="gh">
        <th colspan="3">基础信息</th>
        <th colspan="3">收入</th>
        <th colspan="3">成本与现金利润</th>
        <th colspan="2">分账</th>
      </tr>
      <tr>
        <th>账期</th><th>游戏</th><th>平台</th>
        <th>现金收入</th><th>广告金收入</th><th>总收入</th>
        <th>总消耗</th><th>现金成本</th><th>现金利润</th>
        <th>分成比例</th><th>可结算（现金）</th>
      </tr>
    </thead>
    <tbody>${lines}</tbody>
    <tfoot><tr>
      <td colspan="3" class="sbk-c">合计</td>
      <td class="sbk-n">${mn(sumCashRev)}</td>
      <td class="sbk-n">${mn(sumVRev)}</td>
      <td class="sbk-n">${mn(sumTotalRev)}</td>
      <td class="sbk-n">${mn(sumCost)}</td>
      <td class="sbk-n">${mn(sumCashCost)}</td>
      <td class="sbk-n">${mn(sumCashP)}</td>
      <td class="sbk-c">—</td>
      <td class="sbk-n sbk-pay">${mn(sumPubCash)}</td>
    </tr></tfoot>
  </table></div></div>`;
}
function _renderPayItems(p){
  // 用 statementSn 或反查 _generatedStatements 拿到对账单的 keys，按对账单口径计算明细行。
  let stmtSn=p.statementSn||'';
  let stmtKeys=null;
  if(!stmtSn){
    const s=(window._generatedStatements||[]).find(x=>(x.paymentIds||[]).includes(p.id)||x.paymentId===p.id);
    if(s){stmtSn=s.sn;stmtKeys=s.keys||[];}
  }else{
    const s=(window._generatedStatements||[]).find(x=>x.sn===stmtSn);
    if(s)stmtKeys=s.keys||[];
  }
  // 若能拿到对账单，按对账单格式展示（共用 _renderStmtBreakdown）
  const stmtBlock=_renderStmtBreakdown(stmtSn,stmtKeys);
  if(stmtBlock)return stmtBlock;
  // 兜底：无关联对账单的旧打款单，沿用最简明细（游戏/平台/金额）
  const items=Array.isArray(p.items)&&p.items.length?p.items:[{game:p.game,platform:p.platform,amount:p.amount}];

    <td style="text-align:right;font-family:monospace;font-weight:700">${fmt(it.amount)}</td>

  </table></div></div>`;
}

/* 财务：失败单重新打款 */
function terminatePay(payId){
  if(!canFin()){alert('当前角色无权终止打款流程');return}
  const p=pays.find(x=>x.id===payId);
  if(!p){alert('未找到打款单');return}
  if(p.exec!=='打款失败'){alert('仅「打款失败」的申请单可以终止');return}
  closeModal();
  confirmDialog('确认终止打款流程',
    `即将终止付款申请单 <b style="font-family:monospace">${p.id}</b>。<br/><br/>
     <div style="background:#fff8f0;border:1px solid #ffe0b2;color:#a05000;padding:10px;border-radius:6px;font-size:12.5px">
       <b>失败原因：</b>${p.reason||'—'}<br/>
       <b>失败金额：</b>${fmt(p.amount)}
     </div>
     <div style="margin-top:10px;font-size:12.5px;color:#444">
       适用于<b>需要修正申请单内容</b>的失败场景（如对方账户/联行号填错、金额需调整等）。终止后该账期占用将释放，可重新发起申请。<br/>
       <span style="color:var(--orange)">⚠ 请先到「联运商管理」修正账户/对账材料后，再到「联运商分账明细」对应账期重新发起。</span>
     </div>`,
    function(){
      p.exec='已终止';
      p.terminatedAt=new Date().toISOString().slice(0,16).replace('T',' ');
      p.terminatedBy=(SESSION&&SESSION.display)||ROLE;
      document.getElementById('contentEl').innerHTML=pgPayments();
      alert(`原型展示：申请单 ${p.id} 已终止。\n该账期占用已释放，请先修正账户信息后重新发起申请。`);
    },'确认终止','d');
}
function openRepay(origId){
  if(!canFin()){alert('当前角色无权处理失败打款');return}
  const p=pays.find(x=>x.id===origId);
  if(!p){alert('原单不存在');return}
  const pub=publishers.find(x=>x.name===p.pub);
  const attempts=Array.isArray(p.attempts)?p.attempts:[{flow:p.flow,bkFlow:p.bkFlow,time:p.time,status:p.exec,reason:p.reason}];
  const nextAttemptNo=attempts.length+1;
  const body=`<div class="alert">⚠ 上次执行失败原因：${p.reason}<div style="margin-top:4px;font-size:12px;color:var(--muted)">本次操作将<b>在同一申请单 ${p.id} 下追加第 ${nextAttemptNo} 笔银行流水</b>，不会生成新的申请单。原审批已通过，重新执行无需重新审批。</div></div>
    <div class="sec-title">申请单基本信息</div>
    <div class="kv"><span class="k">申请单号</span><span class="v" style="font-family:monospace">${p.id}</span><span class="k">游戏</span><span class="v">《${p.game}》</span><span class="k">平台</span><span class="v">${p.platform}</span><span class="k">联运商</span><span class="v">${p.pub}</span><span class="k">打款金额</span><span class="v" style="font-weight:700">${fmt(p.amount)}</span><span class="k">本次为第</span><span class="v" style="color:var(--orange);font-weight:700">${nextAttemptNo} 次执行</span></div>
    <div class="sec-title">历史流水</div>
    <div class="card" style="margin-bottom:6px"><div class="tw"><table class="table" style="margin:0;font-size:12.5px">
      <thead><tr><th>序号</th><th>流水单号</th><th>银行交易号</th><th>时间</th><th>状态</th><th>失败原因</th></tr></thead>
      <tbody>${attempts.map((a,i)=>`<tr><td style="text-align:center">#${i+1}</td><td style="font-family:monospace">${a.flow||'—'}</td><td style="font-family:monospace;color:var(--muted)">${a.bkFlow||'—'}</td><td style="color:var(--muted)">${a.time||'—'}</td><td>${ts(a.status||'—')}</td><td style="color:var(--muted)">${a.reason||'—'}</td></tr>`).join('')}</tbody>
    </table></div></div>
    <div class="sec-title">本次重新打款</div>
    <div class="form-grid">
      <div class="field" style="grid-column:1/-1"><label>处理说明 <span class="req">*</span></label><input class="input" id="repayMemo" style="width:100%" placeholder="例如：对方银行系统已恢复，重新执行打款"/></div>
    </div>
    <div class="sec-title">收款账户（当前最新）</div>
    <div class="kv"><span class="k">账户名称</span><span class="v">${pub?pub.accName:'—'}</span><span class="k">开户银行</span><span class="v">${pub?pub.bank:'—'}</span><span class="k">银行账号</span><span class="v" style="font-family:monospace">${pub?'****'+pub.acc:'—'}</span><span class="k">联行号</span><span class="v" style="font-family:monospace">${pub?pub.bankNo:'—'}</span></div>
    <div class="notice" style="margin-top:8px">提交后系统将向银企接口发起新一笔银行执行，并将其追加到本申请单的「流水单号」列表；申请单的当前执行状态翻新为「打款中」。</div>`;
  const foot=`<button class="btn g" onclick="closeModal()">取消</button><button class="btn p" onclick="submitRepay('${p.id}')">提交重新打款</button>`;
  openModal(`重新打款（财务处理） · 申请单 ${p.id}`,body,foot);
}
function submitRepay(origId){
  const memo=(document.getElementById('repayMemo')||{}).value||'';
  if(!memo.trim()){alert('请填写处理说明（用于审计）');return}
  const orig=pays.find(x=>x.id===origId);
  if(orig){
    // 追加新一笔银行执行到 attempts 数组；申请单整体翻新为「打款中」
    const now=new Date().toISOString().slice(0,16).replace('T',' ');
    const newFlow='YQ-'+(new Date()).toISOString().slice(0,10).replace(/-/g,'')+String(Math.floor(Math.random()*900+100));
    if(!Array.isArray(orig.attempts)){
      orig.attempts=[{flow:orig.flow,bkFlow:orig.bkFlow,time:orig.time,status:orig.exec,reason:orig.reason}];
    }
    orig.attempts.push({flow:newFlow,bkFlow:'—',time:now,status:'打款中',reason:'—',memo:memo});
    // 翻新申请单顶层状态：审批保持「已通过」，执行状态变「打款中」，当前流水为新流水
    orig.exec='打款中';
    orig.flow=newFlow;
    orig.bkFlow='—';
    orig.reason='—';
  }
  closeModal();
  alert(`原型展示：已为申请单 ${origId} 追加第 ${(orig&&orig.attempts.length)||'?'} 笔银行流水，状态翻新为「打款中」。`);
  go('payments')
}
