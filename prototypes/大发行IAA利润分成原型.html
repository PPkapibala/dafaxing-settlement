function saveIdsAccount(id){
  const name=(document.getElementById('iaf_name').value||'').trim();
  const company=(document.getElementById('iaf_company').value||'').trim()||'IDS';
  const accountName=(document.getElementById('iaf_accName').value||'').trim();
  const bank=(document.getElementById('iaf_bank').value||'').trim();
  const branch=(document.getElementById('iaf_branch').value||'').trim();
  const accountNo=(document.getElementById('iaf_accNo').value||'').trim();
  const bankNo=(document.getElementById('iaf_bankNo').value||'').trim();
  const remark=(document.getElementById('iaf_remark').value||'').trim();
  const isDefault=document.getElementById('iaf_default').checked;
  if(!name){alert('请填写账户名称');return;}
  if(!accountName){alert('请填写户名');return;}
  if(!bank){alert('请填写开户银行');return;}
  if(!branch){alert('请填写开户支行');return;}
  if(!accountNo||!/^\d+$/.test(accountNo)){alert('银行账号必须为纯数字');return;}
  if(!bankNo||!/^\d+$/.test(bankNo)){alert('联行号必须为纯数字');return;}
  const dup=idsAccounts.find(x=>x.accountNo===accountNo&&x.id!==id);
  if(dup){alert(`银行账号已被账户 ${dup.id}（${dup.name}）占用`);return;}
  const now=new Date().toISOString().slice(0,16).replace('T',' ');
  if(id){
    const a=getIdsAccount(id);
    a.name=name;a.company=company;a.accountName=accountName;a.bank=bank;a.branch=branch;a.accountNo=accountNo;a.bankNo=bankNo;a.remark=remark;a.updatedAt=now;
    if(isDefault&&!a.isDefault){idsAccounts.forEach(x=>x.isDefault=false);a.isDefault=true;}
  }else{
    const newId='IDS-'+String(idsAccounts.length+1).padStart(3,'0');
    const willBeDefault=isDefault||idsAccounts.length===0;
    if(willBeDefault)idsAccounts.forEach(x=>x.isDefault=false);
    idsAccounts.push({id:newId,name,company,accountName,bank,branch,accountNo,bankNo,status:'启用',isDefault:willBeDefault,remark,createdAt:now,creator:(SESSION&&SESSION.display)||ROLE,updatedAt:now});
  }
  closeModal();
  document.getElementById('contentEl').innerHTML=pgIdsAccounts();
}
function setIdsDefault(id){
  const a=getIdsAccount(id);
  if(!a)return;
  if(a.status!=='启用'){alert('已停用的账户不能设为默认');return;}
  confirmDialog('设为默认出账账户',
    `确认将 <b>${a.name}</b> 设为默认出账账户？<br/>设置后多账户场景下的付款单将默认从此账户出账，原默认账户的"默认"标记会被取消。`,
    ()=>{
      idsAccounts.forEach(x=>x.isDefault=false);
      a.isDefault=true;
      a.updatedAt=new Date().toISOString().slice(0,16).replace('T',' ');
      document.getElementById('contentEl').innerHTML=pgIdsAccounts();
    });
}
function toggleIdsStatus(id){
  const a=getIdsAccount(id);
  if(!a)return;
  if(a.status==='启用'){
    const enabledCount=idsAccounts.filter(x=>x.status==='启用').length;
    if(enabledCount<=1){alert('系统至少保留 1 个启用状态的出账账户，无法停用最后一个。');return;}
    if(a.isDefault){alert('该账户为默认账户，请先将其他启用账户设为默认后再停用。');return;}
    confirmDialog('停用出账账户',
      `确认停用 <b>${a.name}</b>？<br/>停用后该账户将不再出现在付款选择中（已发起的付款单不受影响）。`,
      ()=>{
        a.status='已停用';
        a.updatedAt=new Date().toISOString().slice(0,16).replace('T',' ');
        document.getElementById('contentEl').innerHTML=pgIdsAccounts();
      });
  }else{
    a.status='启用';
    a.updatedAt=new Date().toISOString().slice(0,16).replace('T',' ');
    document.getElementById('contentEl').innerHTML=pgIdsAccounts();
  }
}

/* PAGE: 数据同步任务 */
function getSyncTask(id){return syncTasks.find(t=>t.id===id);}
function getLatestRun(taskId){
  const list=syncRuns.filter(r=>r.taskId===taskId);
  if(!list.length)return null;
  return list.slice().sort((a,b)=>(b.startTime||'').localeCompare(a.startTime||''))[0];
}
function syncStatusTag(s){
  const map={
    '成功':'<span class="tag green" style="font-size:11px">✅ 成功</span>',
    '失败':'<span class="tag red" style="font-size:11px">❌ 失败</span>',
    '部分成功':'<span class="tag" style="font-size:11px;background:#fff8f0;color:var(--orange);border:1px solid #ffe0b2">⚠ 部分成功</span>',
    '运行中':'<span class="tag" style="font-size:11px;background:#eef4fb;color:var(--primary);border:1px solid #cfe0f5">⏳ 运行中</span>'
  };
  return map[s]||`<span class="tag">${s}</span>`;
}
function pgSyncTasks(){
  const canOp=['系统管理员','财务人员'].includes(ROLE);
  const canPause=ROLE==='系统管理员';
  const typeF=window._stTypeF||'all';
  const platF=window._stPlatF||'all';
  const stF=window._stStF||'all';
  const kw=(window._stKw||'').trim().toLowerCase();
  let data=syncTasks.slice();
  if(typeF!=='all')data=data.filter(t=>t.type===typeF);
  if(platF!=='all')data=data.filter(t=>t.platform===platF);
  if(stF!=='all'){
    if(stF==='已暂停')data=data.filter(t=>t.status==='暂停');
    else data=data.filter(t=>{const r=getLatestRun(t.id);return r&&r.status===stF;});
  }
  if(kw)data=data.filter(t=>(t.name||'').toLowerCase().includes(kw)||(t.pub||'').toLowerCase().includes(kw));
  const rows=data.map(t=>{
    const r=getLatestRun(t.id);
    const stTag=t.status==='暂停'
      ?'<span class="tag" style="font-size:11px;background:#f4f4f4;color:#888;border:1px solid #ddd">已暂停</span>'
      :(r?syncStatusTag(r.status):'<span style="color:var(--weak);font-size:12px">未运行</span>');
    const ops=[`<button class="link" onclick="openSyncTaskDetail('${t.id}')">详情</button>`,
               `<button class="link" onclick="openSyncTaskHistory('${t.id}')">执行历史</button>`];
    if(canOp&&t.status==='启用'){
      ops.push(`<button class="link" onclick="runSyncTaskNow('${t.id}')">立即运行</button>`);
      if(r&&r.status==='失败')ops.push(`<button class="link" style="color:var(--orange)" onclick="rerunSyncTask('${r.id}')">重跑</button>`);
    }
    if(canPause){
      if(t.status==='启用')ops.push(`<button class="link" style="color:var(--red)" onclick="toggleSyncStatus('${t.id}')">暂停</button>`);
      else ops.push(`<button class="link" onclick="toggleSyncStatus('${t.id}')">启用</button>`);
    }
    const platTag=t.platform==='微信小游戏'?'<span class="tag green" style="font-size:11px">微小</span>'
                 :t.platform==='抖音小游戏'?'<span class="tag blue" style="font-size:11px">抖小</span>'
                 :t.platform==='浑天仪'?'<span class="tag" style="font-size:11px;background:#f0ebff;color:#6a3ec0;border:1px solid #d9caff">浑天仪</span>':t.platform;
    return `<tr>
      <td style="font-family:monospace;font-size:12px">${t.id}</td>
      <td><b>${t.name}</b></td>
      <td>${t.type}</td>
      <td>${platTag}</td>
      <td>${t.pub||'<span style="color:var(--weak)">—</span>'}</td>
      <td><span style="font-size:12px">${t.freq}</span><div style="color:var(--muted);font-size:11px;margin-top:2px">${t.cron}</div></td>
      <td style="font-family:monospace;font-size:12px">${r?r.period:'<span style="color:var(--weak);font-family:inherit">—</span>'}</td>
      <td style="font-family:monospace;font-size:12px">${r?r.startTime:'<span style="color:var(--weak);font-family:inherit">—</span>'}</td>
      <td>${stTag}</td>
      <td style="font-family:monospace;font-size:12px">${r&&r.status==='成功'?r.rows.toLocaleString():'—'}</td>
      <td>${ops.join(' ')}</td>
    </tr>`;
  });
  if(!rows.length)rows.push(`<tr><td colspan="11" style="text-align:center;color:var(--weak);padding:24px">无匹配任务</td></tr>`);
  return `<div class="ph">
    <div><div class="pt">数据同步任务</div><div class="pd">系统按调度计划自动从各数据源拉取数据；下方展示每个任务最近一次执行结果。<b>调度时间由运维统一配置，UI 仅展示不可修改</b>。任务失败时可手动重跑。</div></div>
    <div class="acts"><button class="btn g" onclick="alert('原型展示：导出 Excel')">↓ 导出</button></div>
  </div>
  <div class="filter" style="margin-bottom:16px;flex-wrap:wrap">
    <span style="font-size:12px;color:var(--muted);font-weight:650">数据类型</span>
    <select class="select" onchange="window._stTypeF=this.value;document.getElementById('contentEl').innerHTML=pgSyncTasks()">
      <option value="all" ${typeF==='all'?'selected':''}>全部类型</option>
      <option value="现金收入" ${typeF==='现金收入'?'selected':''}>现金收入</option>
      <option value="广告金收入" ${typeF==='广告金收入'?'selected':''}>广告金收入</option>
      <option value="投放成本" ${typeF==='投放成本'?'selected':''}>投放成本</option>
      <option value="云服务成本" ${typeF==='云服务成本'?'selected':''}>云服务成本</option>
    </select>
    <span style="font-size:12px;color:var(--muted);font-weight:650">平台</span>
    <select class="select" onchange="window._stPlatF=this.value;document.getElementById('contentEl').innerHTML=pgSyncTasks()">
      <option value="all" ${platF==='all'?'selected':''}>全部平台</option>
      <option value="微信小游戏" ${platF==='微信小游戏'?'selected':''}>微信小游戏</option>
      <option value="抖音小游戏" ${platF==='抖音小游戏'?'selected':''}>抖音小游戏</option>
      <option value="浑天仪" ${platF==='浑天仪'?'selected':''}>浑天仪</option>
    </select>
    <span style="font-size:12px;color:var(--muted);font-weight:650">状态</span>
    <select class="select" onchange="window._stStF=this.value;document.getElementById('contentEl').innerHTML=pgSyncTasks()">
      <option value="all" ${stF==='all'?'selected':''}>全部状态</option>
      <option value="成功" ${stF==='成功'?'selected':''}>最近成功</option>
      <option value="失败" ${stF==='失败'?'selected':''}>最近失败</option>
      <option value="运行中" ${stF==='运行中'?'selected':''}>运行中</option>
      <option value="已暂停" ${stF==='已暂停'?'selected':''}>已暂停</option>
    </select>
    <input class="input" placeholder="搜索 任务名 / 联运商" value="${window._stKw||''}" oninput="window._stKw=this.value" onkeydown="if(event.key==='Enter')document.getElementById('contentEl').innerHTML=pgSyncTasks()" style="min-width:200px"/>
    <button class="btn g sm" onclick="document.getElementById('contentEl').innerHTML=pgSyncTasks()">查询</button>
    <button class="btn g sm" onclick="window._stTypeF='all';window._stPlatF='all';window._stStF='all';window._stKw='';document.getElementById('contentEl').innerHTML=pgSyncTasks()">重置</button>
    <span style="color:var(--muted);font-size:12px;margin-left:auto">共 ${data.length} 条</span>
  </div>
  ${tbl(['任务ID','任务名称','数据类型','平台','联运商','频率/调度','数据所属范围','最近同步时间','最近状态','拉取条数','操作'],rows,{pageKey:'syncTasks'})}`;
}
function openSyncTaskDetail(id){
  const t=getSyncTask(id);
  if(!t)return;

  const successCnt=allRuns.filter(r=>r.status==='成功').length;
  const failCnt=allRuns.filter(r=>r.status==='失败').length;
  const r=getLatestRun(id);
  const downstreamMap={cashRev:'现金收入确认',vRev:'广告金收入确认',costDashboard:'投放成本确认',cloudCost:'云服务成本确认'};

    </div>`);
}
function openSyncTaskHistory(id){
  const t=getSyncTask(id);
  if(!t)return;
  const list=syncRuns.filter(r=>r.taskId===id).sort((a,b)=>(b.startTime||'').localeCompare(a.startTime||''));
  const canOp=['系统管理员','财务人员'].includes(ROLE);
  const rows=list.map(r=>{
    const opBtn=(canOp&&r.status==='失败')?`<button class="link" style="color:var(--orange)" onclick="rerunSyncTask('${r.id}')">重跑</button>`:'<span style="color:var(--weak)">—</span>';
    const errCell=r.errMsg?`<div style="color:var(--red);font-size:11px;margin-top:2px;max-width:280px">${r.errMsg}</div>`:'';
    return `<tr>
      <td style="font-family:monospace;font-size:11px">${r.id}</td>
      <td>${r.period}</td>
      <td style="font-size:12px">${r.startTime}</td>
      <td style="font-family:monospace;font-size:12px">${r.duration}s</td>
      <td>${syncStatusTag(r.status)}${errCell}</td>
      <td style="font-family:monospace;font-size:12px">${r.status==='成功'?r.rows.toLocaleString():'—'}</td>
      <td><span style="font-size:11px;color:var(--muted)">${r.trigger}</span><div style="font-size:11px;color:var(--muted)">${r.operator}</div></td>
      <td>${opBtn}</td>

  });
  if(!rows.length)rows.push(`<tr><td colspan="8" style="text-align:center;color:var(--weak);padding:24px">该任务暂无执行记录</td></tr>`);
  openModal(`执行历史：${t.name}`,
    `<div class="notice" style="margin-bottom:10px">展示该任务最近 ${list.length} 次执行记录（默认按时间倒序）。失败的执行可点「重跑」手动重新拉取。</div>

       <thead><tr><th>执行ID</th><th>数据所属范围</th><th>开始时间</th><th>耗时</th><th>状态</th><th>条数</th><th>触发方式</th><th>操作</th></tr></thead>
       <tbody>${rows.join('')}</tbody>
     </table></div>`,
    `<button class="btn g" onclick="closeModal()">关闭</button>`);
}
function runSyncTaskNow(id){
  const t=getSyncTask(id);
  if(!t)return;
  if(t.status!=='启用'){alert('已暂停的任务无法手动运行，请先启用');return;}
  confirmDialog('立即运行任务',
    `确认手动触发任务 <b>${t.name}</b>？<br/><br/>系统将立即从「${t.source}」拉取最新数据，可能影响下游「${({cashRev:'现金收入确认',vRev:'广告金收入确认',costDashboard:'投放成本确认',cloudCost:'云服务成本确认'})[t.downstream]||'未知'}」页面的数据。`,
    ()=>{
      const now=new Date();
      const startStr=now.toISOString().slice(0,19).replace('T',' ');
      const period=t.freq==='每月'?startStr.slice(0,7):(new Date(now.getTime()-86400000).toISOString().slice(0,10));
      const rows=Math.floor(800+Math.random()*800);
      const duration=Math.floor(8+Math.random()*15);
      const endStr=new Date(now.getTime()+duration*1000).toISOString().slice(0,19).replace('T',' ');
      const newId='RUN-M'+Date.now().toString().slice(-8);
      syncRuns.unshift({id:newId,taskId:id,period,startTime:startStr,endTime:endStr,duration,status:'成功',rows,trigger:'手动触发',operator:(SESSION&&SESSION.display)||ROLE,errMsg:''});
      alert(`任务 ${t.name} 已运行完成。\n\n执行ID：${newId}\n数据期间：${period}\n拉取条数：${rows.toLocaleString()}\n耗时：${duration}s`);
      document.getElementById('contentEl').innerHTML=pgSyncTasks();
    });
}
function rerunSyncTask(runId){
  const r=syncRuns.find(x=>x.id===runId);
  if(!r){alert('原执行记录不存在');return;}
  const t=getSyncTask(r.taskId);
  if(!t)return;
  confirmDialog('重跑失败任务',
    `确认重新执行 <b>${t.name}</b> 的 <b>${r.period}</b> 期数据？<br/><br/>原失败原因：${r.errMsg||'—'}`,
    ()=>{
      const now=new Date();
      const startStr=now.toISOString().slice(0,19).replace('T',' ');
      const duration=Math.floor(8+Math.random()*12);
      const endStr=new Date(now.getTime()+duration*1000).toISOString().slice(0,19).replace('T',' ');
      const rows=Math.floor(80+Math.random()*200);
      const newId='RUN-R'+Date.now().toString().slice(-8);
      syncRuns.unshift({id:newId,taskId:r.taskId,period:r.period,startTime:startStr,endTime:endStr,duration,status:'成功',rows,trigger:'失败重跑',operator:(SESSION&&SESSION.display)||ROLE,errMsg:''});
      closeModal();
      alert(`重跑成功。\n\n新执行ID：${newId}\n数据期间：${r.period}\n拉取条数：${rows.toLocaleString()}`);
      document.getElementById('contentEl').innerHTML=pgSyncTasks();
    });
}
function toggleSyncStatus(id){
  const t=getSyncTask(id);
  if(!t)return;
  if(t.status==='启用'){
    confirmDialog('暂停同步任务',
      `确认暂停 <b>${t.name}</b>？<br/><br/>暂停后该任务将<b style="color:var(--red)">不再按调度自动运行</b>，下游模块的数据将不再更新。如需恢复，请重新启用。`,
      ()=>{t.status='暂停';document.getElementById('contentEl').innerHTML=pgSyncTasks();});
  }else{
    t.status='启用';
    document.getElementById('contentEl').innerHTML=pgSyncTasks();
  }
}

function openBpmApproverEditForm(id){

  const body=`<div class="notice" style="margin-bottom:14px">
    <div style="font-size:13px"><b>${a.scenario}</b> · ${a.role}</div>

function saveBpmApprover(id){
  const a=getBpmApprover(id);
  if(!a)return;
  const name=(document.getElementById('bpa_name').value||'').trim();
  const account=(document.getElementById('bpa_account').value||'').trim();
  if(!name){alert('请填写姓名');return;}
  if(!account){alert('请填写飞书账号');return;}
  if(!/^[\w.-]+@[\w-]+(\.[\w-]+)+$/.test(account)){alert('飞书账号格式不正确，应为邮箱格式');return;}
  if(name===a.name&&account===a.feishuAccount){alert('未做任何修改');return;}
  a.name=name;
  a.feishuAccount=account;
  a.updatedAt=new Date().toISOString().slice(0,16).replace('T',' ');
  a.updatedBy=(SESSION&&SESSION.display)||ROLE;
  closeModal();
  document.getElementById('contentEl').innerHTML=pgBpmApprovers();
}

let _permEditRole=null;
function pgPermConfig(){
  const allModuleKeys=PERM_MODULES.flatMap(g=>g.items.map(i=>i.key));
  // 矩阵视图：行=角色，列=功能模块，单元格=可访问✓/✗
  function matrixView(){
    const colGroups=PERM_MODULES.map(g=>`<th colspan="${g.items.length}" style="text-align:center;background:#eaf2ff;color:var(--primary);border-bottom:1px solid var(--line)">${g.group}</th>`).join('');
    const colHeaders=PERM_MODULES.flatMap(g=>g.items.map(i=>`<th style="min-width:80px;text-align:center;font-size:11px">${i.label}</th>`)).join('');
    const rows=ROLES.map(role=>{
      const allowed=ROLE_PAGES[role]||[];
      const cells=allModuleKeys.map(k=>{
        const has=allowed.includes(k);
        return `<td style="text-align:center;padding:9px 4px">${has?'<span style="color:var(--green);font-size:16px">✓</span>':'<span style="color:var(--weak);font-size:14px">—</span>'}</td>`;
      }).join('');
      return `<tr><td style="white-space:nowrap;font-weight:700;padding:9px 12px">${role}</td>${cells}<td style="text-align:center"><button class="btn g sm" onclick="permEditRole('${role}')">操作权限</button></td></tr>`;
    }).join('');
    return `<div class="card" style="margin-bottom:16px">
      <div class="card-hd"><div><div class="card-title">角色访问权限矩阵</div><div class="card-sub">✓ 表示该角色可访问该功能模块</div></div></div>
      <div class="tw"><table class="table" style="min-width:0"><thead>
        <tr><th rowspan="2" style="min-width:120px">角色</th>${colGroups}<th rowspan="2" style="min-width:80px;text-align:center">操作</th></tr>
        <tr>${colHeaders}</tr>
      </thead><tbody>${rows}</tbody></table></div></div>`;
  }
  // 操作权限面板
  function opPanel(){
    if(!_permEditRole)return `<div class="notice">点击角色行右侧「操作权限」按钮，查看并编辑该角色在各模块的细粒度操作权限。</div>`;
    const ops=PERM_OPS[_permEditRole];
    const allowed=ROLE_PAGES[_permEditRole]||[];
    const sections=PERM_MODULES.map(g=>{
      const rows=g.items.map(item=>{
        const hasPage=allowed.includes(item.key);
        const perms=ops[item.key]||{};
        const opCells=OP_KEYS.map((ok,oi)=>{
          if(!hasPage)return `<td style="text-align:center;color:var(--weak);font-size:12px">—</td>`;
          const checked=perms[ok]?'checked':'';
          return `<td style="text-align:center"><label style="cursor:pointer"><input type="checkbox" ${checked} onchange="permToggle('${_permEditRole}','${item.key}','${ok}',this.checked)" style="width:15px;height:15px;cursor:pointer;accent-color:var(--primary)"></label></td>`;
        }).join('');
        return `<tr>
          <td style="padding:8px 12px">${item.label}</td>
          <td style="text-align:center">${hasPage?'<span class="tag green" style="font-size:11px">可访问</span>':'<span class="tag gray" style="font-size:11px">无权限</span>'}</td>
          ${opCells}

function openCreateExtUser(){
  openModal('新建外部用户',`

    </div>
    <div class="fgrid">
      <div class="field"><label>用户名称 <span class="req">*</span></label><input id="newU_display" class="input" style="width:100%" placeholder="例如：星辰运营 / 梦工厂结算对接人"/></div>
      <div class="field"><label>手机号 <span class="req">*</span></label><input id="newU_phone" class="input" style="width:100%" placeholder="11 位手机号，登录入口 & 唯一身份" maxlength="11"/></div>

      <div class="field" style="grid-column:1/-1"><label>备注</label><textarea id="newU_remark" class="input" style="width:100%;height:60px;resize:vertical" placeholder="可填合作主体、对接事项等"></textarea></div>

  `,
    `<button class="btn g" onclick="closeModal()">取消</button><button class="btn p" onclick="submitCreateExtUser()">创建并通知</button>`
  );

function submitCreateExtUser(){
  const display=document.getElementById('newU_display').value.trim();
  const phone=document.getElementById('newU_phone').value.trim();
  if(!display){alert('用户名称不能为空');return;}
  if(!/^1[3-9]\d{9}$/.test(phone)){alert('手机号格式不正确（必须为 11 位有效手机号，外部用户无手机号无法登录）');return;}
  // 唯一性校验：手机号已存在即视为重复（脱敏或原始格式都做匹配）
  const dup=USER_DB.find(u=>u.phone.replace(/\D/g,'').slice(-11)===phone||u.phone===phone);
  if(dup){alert(`该手机号已绑定用户「${dup.display}」（${dup.account}），不可重复创建`);return;}
  const masked=phone.slice(0,3)+'****'+phone.slice(-4);
  // 自动生成账号：与 phoneLogin 首次创建逻辑保持一致
  let account='user_'+phone.slice(-4);
  let i=1;
  while(USER_DB.some(u=>u.account===account)){account='user_'+phone.slice(-4)+'_'+(++i);}
  const nextNo=String(USER_DB.length+1).padStart(3,'0');
  const newU={
    id:'U'+nextNo,
    account,
    display,
    phone:masked,
    loginType:'sms',
    role:null,
    dataPerms:[],
    status:'待授权',
    lastLogin:'—',
    isExternal:true
  };
  USER_DB.push(newU);
  closeModal();
  renderPage();
  setTimeout(()=>openGrantRole(newU.id),60);
}

// 收集弹窗内当前勾选值到 window._dpState（按 data-kind 区分 app/cg/gp）
function _dpCollectChecks(){
  const st=window._dpState;if(!st)return;
  document.querySelectorAll('.dpCheck').forEach(cb=>{
    const kind=cb.dataset.kind;const v=cb.value;
    let target=null;
    if(kind==='app')target=st.selectedApps;
    else if(kind==='cg')target=st.selectedGames;
    else if(kind==='gp')target=st.selectedGp;
    if(!target)return;
    if(cb.checked)target.add(v);else target.delete(v);
  });
}

// 联运商角色：表格行 = 平台应用（pubMappings 一条一行），含 appId/appName，颗粒度到 app
function _renderDpRowsForPub(){
  const st=window._dpState;
  if(st.selectedPubs.size===0){
    return {empty:true,html:`<div class="sec-title">② 平台应用权限</div>
      <div class="notice" style="background:#fff8f0;border-color:#ffe0b2;color:#a05000">⚠ 请先在上方勾选至少 1 个联运商，再选择该主体名下具体的平台应用。</div>`};
  }
  // 同步清理失效勾选
  const candidates=pubMappings.filter(m=>st.selectedPubs.has(m.pubId));
  const validIds=new Set(candidates.map(m=>m.id));
  [...st.selectedApps].forEach(id=>{if(!validIds.has(id))st.selectedApps.delete(id);});
  // 筛选
  const kw=(st.kw||'').trim().toLowerCase();
  const filtered=candidates.filter(m=>{
    if(st.gameF!=='all'&&m.gameId!==st.gameF)return false;
    if(st.platF!=='all'&&m.platform!==st.platF)return false;
    if(kw){
      const appId=m.platform==='微信小游戏'?(m.wxAppId||''):(m.dyAppId||'');
      const hit=m.game.toLowerCase().includes(kw)||m.gameId.toLowerCase().includes(kw)||appId.toLowerCase().includes(kw)||(m.appName||'').toLowerCase().includes(kw);
      if(!hit)return false;
    }
    return true;
  });
  const total=filtered.length;
  const totalPages=Math.max(1,Math.ceil(total/st.pageSize));
  if(st.page>totalPages)st.page=totalPages;
  const start=(st.page-1)*st.pageSize;
  const pageRows=filtered.slice(start,start+st.pageSize);
  const allOnPageChecked=pageRows.length>0&&pageRows.every(m=>st.selectedApps.has(m.id));

  const tableBody=pageRows.length?pageRows.map(m=>{
    const checked=st.selectedApps.has(m.id);
    const appId=m.platform==='微信小游戏'?(m.wxAppId||'—'):(m.dyAppId||'—');

  const pager=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)">
    <div>共 <b>${total}</b> 个游戏（已选 <b style="color:var(--primary)">${st.selectedGames.size}</b> 个）</div>
    <div style="display:flex;align-items:center;gap:6px">
      ${pageBtn(1,'« 首页',st.page===1)}
      ${pageBtn(Math.max(1,st.page-1),'‹ 上一页',st.page===1)}
      <span style="padding:0 8px">第 <b>${st.page}</b> / ${totalPages} 页</span>
      ${pageBtn(Math.min(totalPages,st.page+1),'下一页 ›',st.page===totalPages)}
      ${pageBtn(totalPages,'末页 »',st.page===totalPages)}
    </div>
  </div>`;
  const html=`<div class="sec-title" style="margin-top:0">② 游戏权限<span style="color:var(--muted);font-size:12px;margin-left:6px">CP 不区分平台，颗粒度到游戏</span></div>
    <div class="filter" style="margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">

      <select class="select" onchange="window._dpState.gameF=this.value;window._dpState.page=1;_dpRerender()"><option value="all" ${st.gameF==='all'?'selected':''}>全部游戏</option>${gameOpts}</select>
      <button class="btn g sm" onclick="_dpCollectChecks();[...document.querySelectorAll('.dpCheck')].forEach(cb=>{cb.checked=true;window._dpState.selectedGames.add(cb.value)});_dpRerender()" title="全选当前页">✓ 本页全选</button>
      <button class="btn g sm" onclick="_dpCollectChecks();[...document.querySelectorAll('.dpCheck')].forEach(cb=>{cb.checked=false;window._dpState.selectedGames.delete(cb.value)});_dpRerender()" title="清空当前页">✕ 本页清空</button>

// 内部角色：游戏×平台粒度（沿用旧逻辑，使用 gp: 前缀）
function _renderDpRowsForInternal(){
  const st=window._dpState;
  // 全集：去重 game × platform
  const rows=[];const seen=new Set();
  pubMappings.forEach(m=>{
    const k=`${m.gameId}__${m.platform}`;if(seen.has(k))return;seen.add(k);
    const pubs=[...new Set(pubMappings.filter(x=>x.gameId===m.gameId&&x.platform===m.platform).map(x=>x.pub))].join(' · ');
    rows.push({gameId:m.gameId,gameName:m.game,platform:m.platform,pubs,v:k});
  });
  const kw=(st.kw||'').trim().toLowerCase();
  const filtered=rows.filter(r=>{
    if(kw&&!r.gameName.toLowerCase().includes(kw)&&!r.gameId.toLowerCase().includes(kw))return false;
    if(st.gameF!=='all'&&r.gameId!==st.gameF)return false;
    if(st.platF!=='all'&&r.platform!==st.platF)return false;
    return true;
  });
  const total=filtered.length;
  const totalPages=Math.max(1,Math.ceil(total/st.pageSize));
  if(st.page>totalPages)st.page=totalPages;
  const start=(st.page-1)*st.pageSize;
  const pageRows=filtered.slice(start,start+st.pageSize);
  const allOnPageChecked=pageRows.length>0&&pageRows.every(r=>st.selectedGp.has(r.v));
  const tableBody=pageRows.length?pageRows.map(r=>{
    const checked=st.selectedGp.has(r.v);
    return `<tr>
      <td style="width:40px;text-align:center"><input type="checkbox" class="dpCheck" data-kind="gp" value="${r.v}" ${checked?'checked':''} style="accent-color:var(--primary)"></td>
      <td style="font-family:monospace;font-size:11.5px;color:var(--muted)">${r.gameId}</td>
      <td><b>《${r.gameName}》</b></td>
      <td>${r.platform}</td>
      <td style="color:var(--muted);font-size:12px">${r.pubs||'—'}</td>
    </tr>`;
  }).join(''):'<tr><td colspan="5" style="text-align:center;color:var(--weak);padding:20px">无匹配的游戏-平台组合</td></tr>';
  const gameList=[...new Set(rows.map(r=>r.gameId))];
  const gameOpts=gameList.map(gid=>{const g=games.find(x=>x.id===gid);return `<option value="${gid}" ${st.gameF===gid?'selected':''}>${g?g.name:gid}</option>`;}).join('');
  const platList=[...new Set(rows.map(r=>r.platform))];
  const platOpts=platList.map(p=>`<option value="${p}" ${st.platF===p?'selected':''}>${p}</option>`).join('');
  const pageBtn=(n,label,disabled)=>`<button class="btn g sm" ${disabled?'disabled':''} onclick="window._dpState.page=${n};_dpRerender()">${label}</button>`;
  const pager=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)">
    <div>共 <b>${total}</b> 条（已选 <b style="color:var(--primary)">${st.selectedGp.size}</b> 条）</div>
    <div style="display:flex;align-items:center;gap:6px">
      ${pageBtn(1,'« 首页',st.page===1)}
      ${pageBtn(Math.max(1,st.page-1),'‹ 上一页',st.page===1)}
      <span style="padding:0 8px">第 <b>${st.page}</b> / ${totalPages} 页</span>
      ${pageBtn(Math.min(totalPages,st.page+1),'下一页 ›',st.page===totalPages)}
      ${pageBtn(totalPages,'末页 »',st.page===totalPages)}
    </div>
  </div>`;
  const html=`<div class="sec-title" style="margin-top:0">游戏 × 平台权限</div>
    <div class="filter" style="margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <input class="input" id="dpKwInput" style="width:180px" placeholder="搜索游戏名称 / ID…" value="${st.kw||''}" oninput="window._dpState.kw=this.value;window._dpState.page=1;_dpRerender();const i=document.getElementById('dpKwInput');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}"/>
      <select class="select" onchange="window._dpState.gameF=this.value;window._dpState.page=1;_dpRerender()"><option value="all" ${st.gameF==='all'?'selected':''}>全部游戏</option>${gameOpts}</select>
      <select class="select" onchange="window._dpState.platF=this.value;window._dpState.page=1;_dpRerender()"><option value="all" ${st.platF==='all'?'selected':''}>全部平台</option>${platOpts}</select>
      <button class="btn g sm" onclick="_dpCollectChecks();[...document.querySelectorAll('.dpCheck')].forEach(cb=>{cb.checked=true;window._dpState.selectedGp.add(cb.value)});_dpRerender()" title="全选当前页">✓ 本页全选</button>
      <button class="btn g sm" onclick="_dpCollectChecks();[...document.querySelectorAll('.dpCheck')].forEach(cb=>{cb.checked=false;window._dpState.selectedGp.delete(cb.value)});_dpRerender()" title="清空当前页">✕ 本页清空</button>
      <button class="btn g sm" onclick="if(confirm('确认清空全部勾选？')){window._dpState.selectedGp=new Set();_dpRerender()}">清空全部</button>
    </div>
    <div class="tw" style="max-height:320px;overflow:auto"><table class="table" style="margin:0"><thead><tr>
      <th style="width:40px;text-align:center"><input type="checkbox" ${allOnPageChecked?'checked':''} onchange="_dpCollectChecks();const on=this.checked;[...document.querySelectorAll('.dpCheck')].forEach(cb=>{cb.checked=on;if(on)window._dpState.selectedGp.add(cb.value);else window._dpState.selectedGp.delete(cb.value)});_dpRerender()"></th>
      <th>游戏ID</th><th>游戏名称</th><th>平台</th><th>联运商</th>
    </tr></thead><tbody>${tableBody}</tbody></table></div>
    ${pager}`;
  return {empty:false,html};
}

function renderDpPanel(){
  const st=window._dpState;if(!st)return '';
  if(st.isPub)return _renderDpRowsForPub().html;
  if(st.isCp)return _renderDpRowsForCp().html;
  return _renderDpRowsForInternal().html;
}
function dpAllToggle(cb){const sp=document.getElementById('dpSpecific');sp.style.opacity=cb.checked?'.4':'1';sp.style.pointerEvents=cb.checked?'none':'auto';}
function confirmGrantData(uid){
  const u=USER_DB.find(u=>u.id===uid);if(!u)return;
  const st=window._dpState||{};
  const allCb=document.getElementById('dpAll');
  if(allCb&&allCb.checked){u.dataPerms=['all'];closeModal();renderPage();return;}
  if(st.isPub&&st.selectedPubs.size===0){alert('联运商账号必须至少授权 1 个联运商');return;}
  if(st.isCp&&st.selectedCps.size===0){alert('CP 账号必须至少授权 1 个 CP 主体');return;}
  _dpCollectChecks();
  const out=[];
  (st.selectedPubs||new Set()).forEach(id=>out.push('pub:'+id));
  (st.selectedCps||new Set()).forEach(id=>out.push('cp:'+id));
  if(st.isPub){
    (st.selectedApps||new Set()).forEach(id=>out.push('app:'+id));
  }else if(st.isCp){
    (st.selectedGames||new Set()).forEach(id=>out.push('cg:'+id));
  }else{
    (st.selectedGp||new Set()).forEach(v=>out.push('gp:'+v));
  }
  u.dataPerms=out;
  closeModal();renderPage();
}
