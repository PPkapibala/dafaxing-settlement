function fmt(n){return '¥ '+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function mn(n){const cls=n<0?'neg':'pos';return `<span class="money ${cls}">${fmt(n)}</span>`}

function tbl(ths,rows,opts){
  opts=opts||{};
  const pageKey=opts.pageKey;
  // 没有 pageKey 时降级为原行为（用于嵌入子表 / 含汇总行的复合表格）
  if(!pageKey){
    return `<div class="card"><div class="tw"><table class="table"><thead><tr>${ths.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div></div>`;
  }
  if(!window._pageMap)window._pageMap={};
  const sizeKey=pageKey+'__size';
  const pageNoKey=pageKey+'__no';
  const size=window._pageMap[sizeKey]||10;
  let pageNo=window._pageMap[pageNoKey]||1;
  const total=rows.length;
  const totalPages=Math.max(1,Math.ceil(total/size));
  if(pageNo>totalPages)pageNo=totalPages;
  window._pageMap[pageNoKey]=pageNo;
  const start=(pageNo-1)*size;
  const pageRows=rows.slice(start,start+size);
  const opt=[10,20,50].map(n=>`<option value="${n}" ${n===size?'selected':''}>${n} 条/页</option>`).join('');
  const btn=(label,toNo,disabled,active)=>`<button class="btn g sm" style="min-width:34px;padding:0 8px;${active?'background:var(--primary);color:#fff;border-color:var(--primary)':''}" ${disabled?'disabled':''} onclick="goPage('${pageKey}',${toNo})">${label}</button>`;
  // 简化的页码：当前页 ± 2
  const nums=[];
  for(let i=Math.max(1,pageNo-2);i<=Math.min(totalPages,pageNo+2);i++)nums.push(i);
  const numsHtml=nums.map(n=>btn(n,n,false,n===pageNo)).join('');
  const pager=`<div style="display:flex;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:#fafbfc;flex-wrap:wrap">
    <span style="color:var(--muted);font-size:12px">共 ${total} 条</span>
    <select class="select sm" style="margin-left:8px" onchange="setPageSize('${pageKey}',this.value)">${opt}</select>
    <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
      ${btn('«',1,pageNo===1)}${btn('‹',pageNo-1,pageNo===1)}
      ${numsHtml}
      ${btn('›',pageNo+1,pageNo===totalPages)}${btn('»',totalPages,pageNo===totalPages)}
      <span style="color:var(--muted);font-size:12px;margin-left:6px">第 ${pageNo} / ${totalPages} 页</span>
    </div>
  </div>`;
  return `<div class="card"><div class="tw"><table class="table"><thead><tr>${ths.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${pageRows.join('')}</tbody></table></div>${total>0?pager:''}</div>`;
}

}

const MASTER_PAGES=['games','publishers','cps','permConfig','userMgmt','cashRev','vRev'];

// 解析数据权限项
function parseDataPerm(p){
  if(p==='all')return{kind:'all'};
  if(typeof p==='string'&&p.startsWith('gp:')){
    const [gameId,platform]=p.slice(3).split('__');
    return{kind:'gp',gameId,platform};
  }
  return null;
}
// 当前用户允许访问的「游戏×平台」组合（Set of "gameId__platform"）
function visibleGamePlatforms(){
  const dp=SESSION?.dataPerms||['all'];
  if(dp.includes('all')){
    const all=new Set();
    pubMappings.forEach(m=>all.add(`${m.gameId}__${m.platform}`));
    return {all:true,set:all};
  }
  const set=new Set();
  dp.forEach(p=>{const it=parseDataPerm(p);if(it&&it.kind==='gp')set.add(`${it.gameId}__${it.platform}`);});
  return {all:false,set};
}
// 根据 SESSION.dataPerms 计算当前用户可见的发行商/CP/游戏范围（颗粒度：游戏+平台）
function visibleEntities(){
  const gp=visibleGamePlatforms();
  if(gp.all){
    return {visiblePubs:[...publishers],visibleCps:[...cps],visibleGames:[...games]};
  }
  const visiblePubIds=new Set();
  const visibleGameIds=new Set();
  pubMappings.forEach(m=>{
    if(gp.set.has(`${m.gameId}__${m.platform}`)){
      visiblePubIds.add(m.pubId);
      visibleGameIds.add(m.gameId);
    }
  });
  // CP 仅按 game 关联，game 可见则其 CP 可见
  const visibleCpIds=new Set();
  cpMappings.forEach(m=>{if(visibleGameIds.has(m.gameId))visibleCpIds.add(m.cpId);});
  const visiblePubs=publishers.filter(p=>visiblePubIds.has(p.id));
  const visibleCps=cps.filter(c=>visibleCpIds.has(c.id));
  const visibleGames=games.filter(g=>visibleGameIds.has(g.id));
  return {visiblePubs,visibleCps,visibleGames};
}

function renderLicenseUpload(idAttr,currentName){
  return `<div class="field" style="grid-column:1/-1">
    <label>营业执照 <span class="req">*</span></label>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <input class="input" type="file" id="${idAttr}" accept=".pdf,.jpg,.jpeg,.png" style="flex:1;min-width:240px" onchange="onLicenseChange('${idAttr}','${idAttr}_hint')" />
      ${currentName?`<span class="tag green" style="font-size:11.5px" id="${idAttr}_current">📎 已上传：${currentName}</span>`:''}
    </div>
    <div class="hint" id="${idAttr}_hint">支持 PDF / JPG / PNG，单文件 ≤ 10MB；用于主体资质归档</div>
  </div>`;
}
function onLicenseChange(inputId,hintId){
  const input=document.getElementById(inputId);const hint=document.getElementById(hintId);
  if(!input||!hint)return;
  const f=input.files&&input.files[0];if(!f)return;
  const sizeMb=(f.size/1024/1024).toFixed(2);
  if(f.size>10*1024*1024){hint.style.color='var(--red)';hint.textContent=`⚠ ${f.name} 超出 10MB 限制（${sizeMb}MB）`;return;}
  hint.style.color='var(--green)';hint.textContent=`✓ 已选择：${f.name}（${sizeMb}MB）`;
}
function openLicensePreview(entityId,entityType){
  const e=entityType==='cp'?cps.find(x=>x.id===entityId):publishers.find(x=>x.id===entityId);
  if(!e||!e.license){alert('该主体未上传营业执照');return}
  openModal(`营业执照预览 · ${e.name}`,`
    <div class="kv" style="margin-bottom:14px">
      <span class="k">主体ID</span><span class="v" style="font-family:monospace">${e.id}</span>
      <span class="k">公司名称</span><span class="v">${e.name}</span>

      <span class="k">文件名</span><span class="v" style="font-family:monospace">${e.license}</span>

/* 浑天仪项目：自定义"可搜索下拉"，展示 项目ID + 项目名称，最终落库为 项目ID */
function renderCloudProjCombo(initId,scope){
  const sel=cloudProjects.find(p=>p.id===initId);
  const display=sel?`${sel.id}　${sel.name}`:'';
  return `<div class="cpcombo" data-scope="${scope}" style="position:relative">
    <input type="hidden" class="cpcombo-id" value="${initId||''}" />
    <input type="text" class="input cpcombo-input" autocomplete="off" style="width:100%;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) center,calc(100% - 9px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px"
      placeholder="点击选择 / 输入 项目ID 或 名称 搜索…"
      value="${display.replace(/"/g,'&quot;')}"
      onfocus="openCpCombo(this)"
      onclick="openCpCombo(this)"
      oninput="filterCpCombo(this)"
      onblur="setTimeout(()=>closeCpCombo(this),150)" />
    <div class="cpcombo-menu" style="display:none;position:absolute;left:0;right:0;top:100%;margin-top:2px;background:#fff;border:1px solid var(--line2);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.08);max-height:240px;overflow:auto;z-index:1000">
      ${renderCpOptions(initId)}
    </div>
  </div>`;
}
function renderCpOptions(activeId,keyword){
  const kw=(keyword||'').trim().toLowerCase();
  const list=kw?cloudProjects.filter(p=>p.id.toLowerCase().includes(kw)||p.name.toLowerCase().includes(kw)):cloudProjects;
  const empty=`<div style="padding:10px 12px;color:var(--weak);font-size:12px;text-align:center">无匹配项目</div>`;
  const items=list.map(p=>`<div class="cpcombo-opt" data-id="${p.id}" data-name="${p.name}" onmousedown="pickCpOption(this)" style="padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;${p.id===activeId?'background:#f0f6ff':''}">
    <span style="font-family:monospace;font-size:12.5px;color:${p.id===activeId?'var(--primary)':'var(--text)'};font-weight:${p.id===activeId?'700':'500'}">${p.id}</span>
    <span style="color:var(--muted);font-size:12.5px">${p.name}</span>
  </div>`).join('');
  return `<div class="cpcombo-clear" onmousedown="pickCpOption(this)" data-id="" data-name="" style="padding:8px 12px;cursor:pointer;color:var(--weak);font-size:12px;border-bottom:1px solid var(--line)">— 清除选择 —</div>${list.length?items:empty}`;
}
function openCpCombo(input){
  const wrap=input.closest('.cpcombo');if(!wrap)return;
  const menu=wrap.querySelector('.cpcombo-menu');if(!menu)return;
  menu.style.display='block';
}
function closeCpCombo(input){
  const wrap=input.closest('.cpcombo');if(!wrap)return;
  const menu=wrap.querySelector('.cpcombo-menu');if(!menu)return;
  // 关闭前，如果当前输入文本无对应 ID，则尝试模糊匹配回填；否则保持上次的 ID
  const idEl=wrap.querySelector('.cpcombo-id');
  const text=input.value.trim();
  if(!text){idEl.value='';}
  else{
    const exact=cloudProjects.find(p=>`${p.id}　${p.name}`===text||p.id===text||p.name===text);
    if(exact){idEl.value=exact.id;input.value=`${exact.id}　${exact.name}`;}
    else{
      const fuzzy=cloudProjects.find(p=>p.id.toLowerCase().includes(text.toLowerCase())||p.name.toLowerCase().includes(text.toLowerCase()));
      if(fuzzy){idEl.value=fuzzy.id;input.value=`${fuzzy.id}　${fuzzy.name}`;}
      else if(idEl.value){const cur=cloudProjects.find(p=>p.id===idEl.value);if(cur)input.value=`${cur.id}　${cur.name}`;}
    }
  }
  menu.style.display='none';
}
function filterCpCombo(input){
  const wrap=input.closest('.cpcombo');if(!wrap)return;
  const menu=wrap.querySelector('.cpcombo-menu');if(!menu)return;
  const idEl=wrap.querySelector('.cpcombo-id');
  menu.innerHTML=renderCpOptions(idEl.value,input.value);
  menu.style.display='block';
}
function pickCpOption(el){
  const wrap=el.closest('.cpcombo');if(!wrap)return;
  const id=el.getAttribute('data-id')||'';
  const name=el.getAttribute('data-name')||'';
  const idEl=wrap.querySelector('.cpcombo-id');
  const input=wrap.querySelector('.cpcombo-input');
  idEl.value=id;
  input.value=id?`${id}　${name}`:'';
  wrap.querySelector('.cpcombo-menu').style.display='none';
}

function _renderCloudFieldForEdit(g){
  const st=getGameCloudStatus(g.id);
  const sel=cloudProjects.find(p=>p.id===g.cloudProjectId);
  const display=sel?`${sel.id}　${sel.name}`:(g.cloudProjectId||'');
  if(st.state==='locked'){
    return `<div class="field"><label>浑天仪项目</label>
      <input type="hidden" id="edtCloudId" value="${g.cloudProjectId||''}" />
      <input class="input" style="width:100%;background:#f5f5f5;color:var(--muted);cursor:not-allowed" disabled value="${display.replace(/"/g,'&quot;')}" />
      <div style="margin-top:6px;font-size:12px;color:var(--red);background:#fff5f5;border:1px solid #ffcdcd;border-radius:6px;padding:6px 10px">🔒 <b>已有确认账期，无法更改</b>：该游戏在 ${st.confirmedPeriods.join(' / ')} 已完成云服务成本财务确认。如需变更，请联系系统管理员走线下变更流程。</div>
    </div>`;
  }
  if(st.state==='pending'){
    return `<div class="field"><label>浑天仪项目</label>
      ${renderCloudProjCombo(g.cloudProjectId||'','edit')}
      <div style="margin-top:6px;font-size:12px;color:#8a4b00;background:#fff7ec;border:1px solid #ffd9b3;border-radius:6px;padding:6px 10px">⚠️ <b>提示</b>：该游戏已有 <b>${st.pendingCnt}</b> 个未确认账期的云成本数据正在归属当前项目，修改将影响这些账期的成本归属，保存时需二次确认。</div>
    </div>`;
  }
  // free
  return `<div class="field"><label>浑天仪项目</label>
    ${renderCloudProjCombo(g.cloudProjectId||'','edit')}
    <div class="hint">从浑天仪同步的项目列表中选择（按项目ID或名称搜索），1:1 关联，云服务成本以游戏为单位归集</div>
  </div>`;
}

function saveGameEdit(id){
  const g=games.find(x=>x.id===id);if(!g)return;
  const st=getGameCloudStatus(id);
  if(st.state==='locked'){
    // 只读字段，直接保存（云项目字段不会变）
    alert('原型展示：游戏信息已更新（浑天仪项目未变更）。');
    closeModal();renderPage();return;
  }
  // 读取 combo 当前选中的浑天仪项目 ID
  const newId=(document.querySelector('.cpcombo[data-scope="edit"] .cpcombo-id')||{}).value||'';
  const changed=newId!==(g.cloudProjectId||'');
  if(changed&&st.state==='pending'){
    const oldDisp=g.cloudProjectId?`${g.cloudProjectId}（${g.cloudProjectName||'—'}）`:'未关联';
    const newProj=cloudProjects.find(p=>p.id===newId);
    const newDisp=newProj?`${newProj.id}（${newProj.name}）`:'未关联';
    confirmDialog('确认修改浑天仪项目关联',
      `游戏《${g.name}》已有 <b style="color:#8a4b00">${st.pendingCnt}</b> 个未确认账期的云成本数据正在归属当前项目。<br/><br/>原项目：<b>${oldDisp}</b><br/>新项目：<b style="color:var(--primary)">${newDisp}</b><br/><br/>修改后，这些未确认账期的云成本将切换至新项目下，相关 CP 分账归属同步变化。是否继续？`,
      function(){
        _commitGameEdit(g,newId);
      },'确认修改');
    return;
  }
  // free 状态：直接保存
  _commitGameEdit(g,newId);
}
function _commitGameEdit(g,newCloudId){
  const newProj=cloudProjects.find(p=>p.id===newCloudId);
  g.cloudProjectId=newCloudId||'';
  g.cloudProjectName=newProj?newProj.name:'';
  alert('原型展示：游戏信息已更新。');
  closeModal();renderPage();
}

function submitPubMapping(){
  const gameId=document.getElementById('pmGameSel').value;
  const platform=document.getElementById('pmPlatSel').value;
  const pubId=document.getElementById('pmPubSel').value;
  if(!gameId||!platform||!pubId){alert('请完整选择 游戏 / 平台 / 发行商');return;}
  const game=games.find(g=>g.id===gameId);
  const pub=publishers.find(p=>p.id===pubId);
  if(platform==='微信小游戏'){
    const appId=(document.getElementById('pm_wxAppId').value||'').trim();
    if(!appId){alert('请填写微信小游戏应用ID');return;}
    const existed=pubMappings.find(m=>m.platform==='微信小游戏'&&m.wxAppId===appId);
    if(existed){
      alert(`微信应用ID「${appId}」已被《${existed.game}》占用（发行商：${existed.pub}），同一应用ID只能归属于一个游戏。请检查后重新填写。`);
      return;
    }
    pubMappings.push({id:'M-'+String(pubMappings.length+1).padStart(3,'0'),game:game.name,gameId:game.id,platform,pub:pub.name,pubId:pub.id,wxAppId:appId,dyAppId:'',jlIds:[],jlNames:[],creator:'业务运营',created:new Date().toISOString().slice(0,10)});
  }else{

function savePubMappingEdit(id){
  if(!isAdmin()){alert('仅系统管理员可修改映射关系');return;}
  const m=pubMappings.find(x=>x.id===id);
  const newGameId=document.getElementById('pme_game').value;
  const newPlat=document.getElementById('pme_plat').value;
  const newPubId=document.getElementById('pme_pub').value;
  if(!newGameId||!newPlat||!newPubId){alert('请完整选择 游戏 / 平台 / 发行商');return;}
  const newAppId=(document.getElementById('pme_appId').value||'').trim();
  if(!newAppId){alert('应用ID不能为空');return;}
  // 全局唯一性校验：排除当前 mapping 本身
  if(newPlat==='微信小游戏'){
    const dup=pubMappings.find(x=>x.id!==id&&x.platform==='微信小游戏'&&x.wxAppId===newAppId);
    if(dup){alert(`微信应用ID「${newAppId}」已被《${dup.game}》占用（发行商：${dup.pub}）。`);return;}
  }else{
    const dup=pubMappings.find(x=>x.id!==id&&x.platform==='抖音小游戏'&&x.dyAppId===newAppId);
    if(dup){alert(`抖音应用ID「${newAppId}」已被《${dup.game}》占用（发行商：${dup.pub}）。`);return;}
    // 抖音：同游戏只能一条
    const sameGameDy=pubMappings.find(x=>x.id!==id&&x.platform==='抖音小游戏'&&x.gameId===newGameId);
    if(sameGameDy){
      const g=games.find(g=>g.id===newGameId);
      alert(`《${g?g.name:newGameId}》在抖音小游戏平台已存在映射（应用ID ${sameGameDy.dyAppId}，发行商：${sameGameDy.pub}）。一个游戏只能对应一个抖音应用ID。`);
      return;
    }
  }
  const game=games.find(g=>g.id===newGameId);
  const pub=publishers.find(p=>p.id===newPubId);
  m.gameId=newGameId;m.game=game?game.name:m.game;
  m.platform=newPlat;
  m.pubId=newPubId;m.pub=pub?pub.name:m.pub;
  if(newPlat==='微信小游戏'){m.wxAppId=newAppId;m.dyAppId='';m.jlIds=[];m.jlNames=[];}
  else{
    m.dyAppId=newAppId;m.wxAppId='';
    const checks=document.querySelectorAll('#pme_jlList input[type=checkbox]');
    const newIds=[],newNames=[];
    checks.forEach(cb=>{if(cb.checked){newIds.push(cb.dataset.jlId);newNames.push(cb.dataset.jlName);}});
    m.jlIds=newIds;
    m.jlNames=newNames;
  }
  closeModal();
  document.getElementById('contentEl').innerHTML=pgPubMapping();
}

// 解析 FILTER_ENTITY → {type:'pub'|'cp'|'all', id, name}
function parsedEntity(){
  if(FILTER_ENTITY==='all')return{type:'all'};
  const [type,id]=FILTER_ENTITY.split(':');
  if(type==='pub'){const p=publishers.find(x=>x.id===id);return{type:'pub',id,name:p?p.name:''};}
  if(type==='cp'){const c=cps.find(x=>x.id===id);return{type:'cp',id,name:c?c.name:''};}
  return{type:'all'};
}

/* PAGE: 游戏-CP关系（独立模块） */

  if(ent.type==='pub')gList=gList.filter(g=>pubMappings.some(m=>m.gameId===g.id&&m.pubId===ent.id));
  const rows=gList.map(g=>{

        ? `<button class="link" onclick="openCpMappingDetail('${g.id}')">查看</button>${canBizMapping()?`<button class="link" style="margin-left:6px" onclick="openCpMappingEdit('${g.id}')">编辑</button>`:''}`
        : (canBizMapping()?`<button class="link" onclick="openCpMappingForm('${g.id}')">配置CP</button>`:'<span style="color:var(--red)">待配置</span>')
      }</td>
    </tr>`;

/* PAGE: 平台-发行商映射（独立模块） */
function pgPubMapping(){
  const ent=parsedEntity();
  let gList=FILTER_GAME==='all'?games:games.filter(g=>g.id===FILTER_GAME);
  if(ent.type==='pub')gList=gList.filter(g=>pubMappings.some(m=>m.gameId===g.id&&m.pubId===ent.id));
  if(ent.type==='cp')gList=gList.filter(g=>cpMappings.some(c=>c.gameId===g.id&&c.cpId===ent.id));
  // 拍平：每个 游戏×平台×发行商 一行；无映射的平台也保留占位行
  const allRows=[];
  gList.forEach(g=>{
    g.platforms.forEach(platform=>{
      let list=pubMappings.filter(m=>m.gameId===g.id&&m.platform===platform);
      if(ent.type==='pub')list=list.filter(m=>m.pubId===ent.id);
      const isWx=platform==='微信小游戏';
      if(!list.length){allRows.push({game:g,platform,isWx,mapping:null});}
      else list.forEach(m=>allRows.push({game:g,platform,isWx,mapping:m}));
    });
  });
  // 分页：按行
  if(!window._pageMap)window._pageMap={};
  const pageKey='pubMapping';
  const size=window._pageMap[pageKey+'__size']||15;
  let pageNo=window._pageMap[pageKey+'__no']||1;
  const total=allRows.length;
  const totalPages=Math.max(1,Math.ceil(total/size));
  if(pageNo>totalPages)pageNo=totalPages;
  window._pageMap[pageKey+'__no']=pageNo;
  const pageRows=allRows.slice((pageNo-1)*size,(pageNo-1)*size+size);
  const tableRows=pageRows.map(r=>{
    const tag=r.isWx?`<span class="tag green">微信小游戏</span>`:`<span class="tag blue">抖音小游戏</span>`;
    const gameCell=`<b>《${r.game.name}》</b><div style="font-family:monospace;color:var(--muted);font-size:11px;margin-top:2px">${r.game.id}</div>`;
    if(!r.mapping){
      const cfg=canBizMapping()?`<button class="link" onclick="openPubMappingForm('${r.game.id}')">配置</button>`:'—';
      return `<tr style="background:#fff8f8">
        <td>${gameCell}</td>
        <td>${tag}</td>
        <td style="color:var(--red)">未配置发行商</td>
        <td>—</td>
        <td>—</td>
        <td>${cfg}</td>
      </tr>`;
    }
    const m=r.mapping;
    const appId=`<span style="font-family:monospace;color:#31557d">${r.isWx?(m.wxAppId||'—'):(m.dyAppId||'—')}</span>`;
    const jl=!r.isWx&&m.jlIds.length
      ?`<ul style="padding-left:16px;margin:0">${m.jlIds.map((id,j)=>`<li style="margin:2px 0"><span style="font-family:monospace;color:#31557d">${id}</span><span style="color:var(--muted);margin-left:6px">${m.jlNames[j]||''}</span></li>`).join('')}</ul>`
      :'—';
    const acts=`<button class="link" onclick="openPubMappingDetail('${m.id}')">查看</button>${isAdmin()?`<button class="link" style="color:#a04000" onclick="openPubMappingEdit('${m.id}')">编辑</button>`:''}${(!r.isWx&&canConfigJl())?`<button class="link" style="color:#7a52b3" onclick="openJlIdsConfig('${m.id}')">配置巨量ID</button>`:''}`;
    return `<tr>
      <td>${gameCell}</td>
      <td>${tag}</td>
      <td><b>${m.pub}</b><div style="color:var(--muted);font-size:11px;font-family:monospace;margin-top:2px">${m.pubId}</div></td>
      <td>${appId}</td>
      <td>${jl}</td>
      <td>${acts}</td>
    </tr>`;
  });
  const pagerHtml=total>0?(()=>{
    const opt=[15,30,50].map(n=>`<option value="${n}" ${n===size?'selected':''}>${n} 行/页</option>`).join('');
    const btn=(label,toNo,disabled,active)=>`<button class="btn g sm" style="min-width:34px;padding:0 8px;${active?'background:var(--primary);color:#fff;border-color:var(--primary)':''}" ${disabled?'disabled':''} onclick="goPage('${pageKey}',${toNo})">${label}</button>`;
    const nums=[];for(let i=Math.max(1,pageNo-2);i<=Math.min(totalPages,pageNo+2);i++)nums.push(i);
    return `<div style="display:flex;align-items:center;gap:6px;padding:10px 12px;margin-top:8px;border:1px solid var(--line);background:#fafbfc;border-radius:var(--r2);flex-wrap:wrap">
      <span style="color:var(--muted);font-size:12px">共 ${total} 条</span>
      <select class="select sm" style="margin-left:8px" onchange="setPageSize('${pageKey}',this.value)">${opt}</select>
      <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
        ${btn('«',1,pageNo===1)}${btn('‹',pageNo-1,pageNo===1)}${nums.map(n=>btn(n,n,false,n===pageNo)).join('')}${btn('›',pageNo+1,pageNo===totalPages)}${btn('»',totalPages,pageNo===totalPages)}
        <span style="color:var(--muted);font-size:12px;margin-left:6px">第 ${pageNo} / ${totalPages} 页</span>
      </div></div>`;
  })():'';
  return `<div class="ph">
    <div><div class="pt">游戏-发行商关系</div><div class="pd">按「游戏 × 平台 × 发行商」三元组逐行展示对应的应用 ID 与巨量账户 ID 列表，是系统取数和分账核算的唯一依据。</div></div>
    <div class="acts">${canBizMapping()?`<button class="btn p" onclick="openPubMappingForm()">＋ 新增映射</button>`:''}</div>
  </div>
  <div class="notice">微信小游戏：一个游戏可对应多个发行商；抖音小游戏：<b>一个游戏只能对应一个发行商</b>（REQ-R-102）。巨量账户ID每日从巨量同步，已绑定的不允许删除。</div>
  ${total?tbl(['游戏','平台','发行商主体','对应应用ID','巨量账户ID列表','操作'],tableRows):'<div class="notice">暂无数据</div>'}
  ${pagerHtml}`;
}

function pgRules(){
  const ent=parsedEntity();
  let data=FILTER_GAME==='all'?rules:rules.filter(r=>games.find(g=>g.id===FILTER_GAME)?.name===r.game);
  if(ent.type==='pub')data=data.filter(r=>r.pub===ent.name);
  if(ent.type==='cp')data=data.filter(r=>r.cp===ent.name);
  const rows=data.map(r=>{
    const tierTxt=r.tierEnabled?`<span style="color:var(--orange);font-weight:700">${r.pubRate}% / ${r.tierHighRate}%</span><div style="font-size:10.5px;color:var(--muted);margin-top:2px">≤${(r.tierThreshold/10000).toFixed(0)}w / &gt;${(r.tierThreshold/10000).toFixed(0)}w</div>`
      :`<span>${r.pubRate}%</span><div style="font-size:10.5px;color:var(--muted);margin-top:2px">未启用阶梯</div>`;
    const cpServer=r.cpServerCostShare?'<span style="background:#e9dfff;color:#5a3a8a;border-radius:8px;padding:1px 6px;font-size:10.5px;font-weight:700">承担服务器</span>':'<span style="background:#f0f0f0;color:var(--muted);border-radius:8px;padding:1px 6px;font-size:10.5px">不承担</span>';
    const cpLow=((100-r.pubRate)*r.cpRemainShare/100).toFixed(1);
    const cpHigh=r.tierEnabled?((100-r.tierHighRate)*r.cpRemainShare/100).toFixed(1):null;
    const cpDerived=cpHigh?`<span style="color:var(--green);font-weight:700">${cpLow}% / ${cpHigh}%</span>`:`<span style="color:var(--green);font-weight:700">${cpLow}%</span>`;
    const cpFormulaTxt=`<div style="font-size:11px;color:var(--muted);margin-top:2px;font-family:monospace">(1 − 发行商%) × <b style="color:var(--green)">${r.cpRemainShare}%</b></div>`;

function rfSync(){
  const gameId=document.getElementById('rf_game')?.value;
  const plat=document.getElementById('rf_plat')?.value;
  const pubSel=document.getElementById('rf_pub');
  const cpSel=document.getElementById('rf_cp');
  const pubHint=document.getElementById('rf_pub_hint');
  const cpHint=document.getElementById('rf_cp_hint');
  // 联动发行商：需要游戏+平台都选了
  if(gameId && plat){
    const matches=pubMappings.filter(m=>m.gameId===gameId && m.platform===plat);
    if(matches.length){
      pubSel.innerHTML=matches.map(m=>`<option value="${m.pubId}">${m.pub}</option>`).join('');
      pubSel.disabled=false;
      pubHint.textContent='';
    } else {
      pubSel.innerHTML='<option value="">该游戏+平台暂无发行商映射</option>';
      pubSel.disabled=true;
      pubHint.textContent='请先在「平台-发行商映射」中配置';
      pubHint.style.color='var(--red)';
    }
  } else {
    pubSel.innerHTML='<option value="">请先选择游戏和平台</option>';
    pubSel.disabled=true;
    pubHint.textContent='';
  }
  // 联动CP：只需要游戏
  if(gameId){
    const cpRels=cpMappings.filter(m=>m.gameId===gameId);
    if(cpRels.length){
      cpSel.innerHTML=cpRels.map(m=>`<option value="${m.cpId}">${m.cp}</option>`).join('');
      cpSel.disabled=false;
      cpHint.textContent='';
    } else {
      cpSel.innerHTML='<option value="">该游戏暂无CP关系</option>';
      cpSel.disabled=true;
      cpHint.textContent='请先在「游戏-CP关系」中配置';
      cpHint.style.color='var(--red)';
    }
  } else {
    cpSel.innerHTML='<option value="">请先选择游戏</option>';
    cpSel.disabled=true;
    cpHint.textContent='';
  }
}

/* ── 收入双确认 helper ── */
function syncRevConfirmed(){
  if(!window._cashRevConfirmed)window._cashRevConfirmed=new Set();
  if(!window._vRevConfirmed)window._vRevConfirmed=new Set();
  window._revConfirmed=new Set([...window._cashRevConfirmed].filter(k=>window._vRevConfirmed.has(k)));
}
function isSettleReady(period,game,platform){
  const k=`${period}__${game}__${platform}`;
  const cash=window._cashRevConfirmed||new Set();
  const v=window._vRevConfirmed||new Set();
  const cost=window._costConfirmed||new Set();
  return cash.has(k)&&v.has(k)&&cost.has(k);
}
/* 发行商「对账单确认」：已出账后再由发行商确认对账单方可打款 */
function isBillConfirmed(period,game,platform){
  const k=`${period}__${game}__${platform}`;
  return (window._billConfirmed||new Set()).has(k);
}
// 找该(账期/游戏/平台/发行商)的"占用中"打款单（已驳回 / 已终止 不算占用）
function activePayFor(r){
  return pays.find(p=>p.period===r.period&&p.game===r.game&&p.platform===r.platform&&p.pub===r.pub&&p.approval!=='已驳回'&&p.exec!=='已终止');
}
// 操作列发起/查看打款按钮：根据 pays 状态切换文案、颜色，点击进入审批详情
function renderPayActionBtn(r){
  const pubObj=publishers.find(p=>p.name===r.pub)||{};
  const key=`${r.period}__${r.game}__${r.platform}`;
  const p=activePayFor(r);
  if(!p){
    return `<button class="link" style="margin-left:8px;color:var(--primary);font-weight:700" onclick="window._payPubId='${pubObj.id||''}';window._payInitKey='${key}';openPayNewModal()">发起提款</button>`;
  }
  const detailFn=isPublisher()?'openMyPayDetail':'openPayDetail';
  // 失败对所有角色在此入口统一脱敏为"打款中"
  const masked=p.exec==='打款失败'?'打款中':(p.exec==='已终止'?'已终止 · 待重新发起':p.exec);
  let label,color;
  if(p.approval==='待审批'){label='审批中';color='var(--orange)';}
  else if(masked==='打款中'){label='打款中';color='var(--orange)';}
  else if(masked==='打款成功'){label='已到账 ✓';color='var(--green)';}
  else {label='处理中';color='var(--orange)';}
  return `<button class="link" style="margin-left:8px;color:${color};font-weight:700" onclick="${detailFn}('${p.id}')" title="点击查看审批与打款进度">${label}</button>`;
}

/* 计算游戏当前的云成本状态：
 *  - 'free'    ：无 settle 数据 或 未关联浑天仪项目 → 可自由修改
 *  - 'pending' ：已关联，但所有相关账期的云成本均未财务确认 → 二次确认后可改
 *  - 'locked'  ：已存在「已确认」账期 → 不允许修改
 */
function getGameCloudStatus(gameId){
  const g=games.find(x=>x.id===gameId);
  if(!g)return {state:'free',pendingCnt:0,confirmedCnt:0,confirmedPeriods:[]};
  if(!g.cloudProjectId)return {state:'free',pendingCnt:0,confirmedCnt:0,confirmedPeriods:[]};
  const periods=[...new Set(settle.filter(r=>r.game===g.name).map(r=>r.period))];
  if(!periods.length)return {state:'free',pendingCnt:0,confirmedCnt:0,confirmedPeriods:[]};
  const conf=window._cloudCostConfirmed||new Set();
  const confirmedPeriods=periods.filter(p=>conf.has(`${p}__${g.cloudProjectId}`));
  if(confirmedPeriods.length>0)return {state:'locked',pendingCnt:periods.length-confirmedPeriods.length,confirmedCnt:confirmedPeriods.length,confirmedPeriods};
  return {state:'pending',pendingCnt:periods.length,confirmedCnt:0,confirmedPeriods:[]};
}

/* ── 阶梯分润 + 服务器成本 + 亏损划转（按规则配置） ── */
// 找到一条 settle 记录对应的规则配置（生效中的优先；否则取同主键最近一条）
function findRuleFor(r){
  const matched=rules.filter(x=>x.game===r.game&&x.platform===r.platform&&x.pub===r.pub&&x.cp===r.cp);
  return matched.find(x=>x.status==='生效中')||matched.find(x=>x.status==='审批中')||matched[0]||null;
}
// 阶梯分润：根据规则配置返回适用比例
function tieredPubRate(cashRev,rule){
  if(!rule)return 0;
  if(rule.tierEnabled&&cashRev>(rule.tierThreshold||0))return rule.tierHighRate||rule.pubRate;
  return rule.pubRate;
}
// 服务器成本按 cash/v 收入比例分摊
function splitServerCost(r){
  const total=(r.cashRev||0)+(r.vRev||0);
  if(!total)return {cashServer:0,vServer:0};
  const cashServer=Math.round((r.serverCost||0)*r.cashRev/total);
  return {cashServer,vServer:(r.serverCost||0)-cashServer};
}
// 计算单条 settle 记录的发行商可结算
function calcPubSettle(r){
  const rule=findRuleFor(r);
  const rate=tieredPubRate(r.cashRev,rule);
  let pubCash, cashIsLossTransfer=false;
  if(r.cashP>=0){
    pubCash=r.cashP*rate/100;
  }else{
    pubCash=r.cashRev;
    cashIsLossTransfer=true;
  }
  let pubV, vIsLossTransfer=false;
  if(r.vP>=0){
    pubV=r.vP*rate/100;
  }else{
    pubV=r.vRev;
    vIsLossTransfer=true;
  }
  return {rate,pubCash,pubV,cashIsLossTransfer,vIsLossTransfer,rule,
    tierApplied:rule&&rule.tierEnabled&&r.cashRev>(rule.tierThreshold||0)};
}
// 计算单条 settle 记录的 CP 可结算
// 现金： [ cashP × (1 − pubRate%) − serverCost ] × cpRemainShare%
// 广告金：[ vP × (1 − pubRate%) ] × cpRemainShare%（不扣服务器成本）
// 总利润 (cashP+vP) < 0 时，CP 现金/广告金均为 0
function calcCpSettle(r){
  const rule=findRuleFor(r);
  const pubRate=rule?(tieredPubRate(r.cashRev,rule)):60;
  const cpRemainShare=rule?(rule.cpRemainShare||0):0;
  const cpRate=(100-pubRate)*cpRemainShare/100; // 相对总利润的实际 CP 比例
  const shareServer=rule?!!rule.cpServerCostShare:true;
  const totalP=(r.cashP||0)+(r.vP||0);
  const noShare=totalP<0;
  const remainRate=(100-pubRate)/100;
  const cashRemain=r.cashP*remainRate;
  const cashServer=shareServer?(r.serverCost||0):0;
  const cashBase=cashRemain-cashServer;
  const cpCash=noShare?0:cashBase*cpRemainShare/100;
  const vRemain=r.vP*remainRate;
  const vBase=vRemain;
  const cpV=noShare?0:vBase*cpRemainShare/100;
  return {cashServer,vServer:0,cashBase,vBase,cpCash,cpV,cpRate,cpRemainShare,pubRate,shareServer,rule,noShare,totalP};
}
function _revBaseFilter(prefix){
  const startF=window['_'+prefix+'Start']||'2026-01';
  const endF=window['_'+prefix+'End']||'2026-04';
  const platF=window['_'+prefix+'Plat']||'all';

  const entityF=window['_'+prefix+'Entity']||'all';
  const allPeriods=[...new Set(settle.map(r=>r.period))].sort();
  const platforms=[...new Set(settle.map(r=>r.platform))].sort();
  const {visiblePubs,visibleCps,visibleGames}=visibleEntities();
  let filterPubName=null,filterCpName=null;
  if(entityF!=='all'){
    const [et,eid]=entityF.split(':');
    if(et==='pub'){const p=visiblePubs.find(x=>x.id===eid);filterPubName=p?p.name:null;}
    if(et==='cp'){const c=visibleCps.find(x=>x.id===eid);filterCpName=c?c.name:null;}
  }
  const filterGameName=gameF==='all'?null:visibleGames.find(g=>g.id===gameF)?.name||null;
  const data=settle.filter(r=>{
    if(r.period<startF||r.period>endF)return false;
    if(filterPubName&&r.pub!==filterPubName)return false;
    if(filterCpName&&r.cp!==filterCpName)return false;
    if(filterGameName&&r.game!==filterGameName)return false;
    if(platF!=='all'&&r.platform!==platF)return false;
    const pubOk=visiblePubs.length===0||visiblePubs.find(p=>p.name===r.pub);
    if(!pubOk)return false;
    return true;
  });
  return {startF,endF,platF,gameF,entityF,allPeriods,platforms,visiblePubs,visibleCps,visibleGames,data};
}

function openRevDailyDetail(game,platform,period){
  const monthData=settle.find(r=>r.game===game&&r.platform===platform&&r.period===period);
  if(!monthData)return;
  const syncRec=syncs.find(s=>s.game===game&&s.platform===platform);
  const syncTime=syncRec?syncRec.syncTime:'—';
  const syncStatus=syncRec?syncRec.status:'—';
  const days=30;
  const weights=Array.from({length:days},(_,i)=>0.6+0.4*Math.sin(i/4));
  const wSum=weights.reduce((a,b)=>a+b,0);
  const dailyRows=weights.map((w,i)=>{
    const d=String(i+1).padStart(2,'0');
    const date=`${period}-${d}`;
    const cashRev=Math.round(monthData.cashRev*(w/wSum));
    const vRev=Math.round(monthData.vRev*(w/wSum));
    const total=cashRev+vRev;
    const isLast=(i===weights.length-1);
    return `<tr>
      <td style="color:var(--muted);font-family:monospace">${date}</td>
      <td style="font-weight:700">${mn(cashRev)}</td>
      <td style="font-weight:700;color:var(--purple)">${fmt(vRev)}</td>
      <td style="font-weight:800">${mn(total)}</td>
      <td style="color:var(--muted);font-size:12px">${isLast?syncTime:'—'}</td>
      <td>${isLast?ts(syncStatus):'—'}</td>
    </tr>`;
  });
  const totalCash=weights.reduce((s,w)=>{const cr=Math.round(monthData.cashRev*(w/wSum));return s+cr;},0);
  const totalV=weights.reduce((s,w)=>{const vr=Math.round(monthData.vRev*(w/wSum));return s+vr;},0);
  const sumRow=`<tr style="background:#f8fbff;font-weight:800">
    <td style="color:var(--primary)">合计</td>
    <td>${mn(totalCash)}</td>
    <td style="color:var(--purple)">${fmt(totalV)}</td>
    <td>${mn(totalCash+totalV)}</td>
    <td colspan="2"></td>
  </tr>`;
  openModal(`每日收入明细 · 《${game}》${platform} · ${period}`,`
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn g sm" onclick="alert('原型展示：导出每日收入明细 — 《${game}》${platform} · ${period}')">↓ 导出</button></div>
    <div class="kv" style="margin-bottom:14px">
      <span class="k">发行商</span><span class="v">${monthData.pub}</span>
      <span class="k">月度现金收入</span><span class="v" style="font-size:14px;font-weight:800">${mn(monthData.cashRev)}</span>
      <span class="k">月度广告金收入</span><span class="v" style="color:var(--purple);font-size:14px;font-weight:800">${fmt(monthData.vRev)}</span>
    </div>
    <div style="max-height:460px;overflow:auto">
      ${tbl(['日期','现金收入','广告金收入','合计收入','最新计算时间','同步状态'],dailyRows.concat([sumRow]))}
    </div>
    <div style="margin-top:10px;font-size:12px;color:var(--weak)">* 每日数据为按月度总量模拟拆分，仅供原型演示；实际数据由平台每日同步。</div>`)
}

    if(!g||!g.cloudProjectId)return;

    const k=`${r.period}__${g.cloudProjectId}`;
    if(!rowMap[k])rowMap[k]={key:k,period:r.period,gameId:g.id,gameName:g.name,projectId:g.cloudProjectId,projectName:g.cloudProjectName||'—',cost:0};
    rowMap[k].cost+=(r.serverCost||0);
  });
  const rows=Object.values(rowMap).sort((a,b)=>b.period.localeCompare(a.period)||a.gameId.localeCompare(b.gameId));
  const totalCost=rows.reduce((s,r)=>s+r.cost,0);
  const confirmedCnt=rows.filter(r=>(window._cloudCostConfirmed||new Set()).has(r.key)).length;
  const pendingCnt=rows.length-confirmedCnt;
  const canConfirm=canFin();

  const tableRows=rows.map(r=>{
    const ck=(window._cloudCostConfirmed||new Set()).has(r.key);
    const confirmCell=ck
      ?`<span class="tag green" style="font-size:11px">✓ 财务已确认</span>`
      :(canConfirm
          ?`<button class="btn p sm" onclick="confirmCloudCost('${r.key}')">确认无异议</button>`
          :`<span class="tag" style="background:#fff3e0;color:var(--orange);font-size:11px">待财务确认</span>`);
    return `<tr style="${ck?'':'background:#fffbf5'}">
      <td style="font-family:monospace">${r.period}</td>
      <td style="font-family:monospace">${r.gameId}</td>
      <td><b>《${r.gameName}》</b></td>
      <td style="font-family:monospace">${r.projectId}</td>
      <td style="color:var(--muted)">${r.projectName}</td>
      <td style="font-weight:800;color:#7a52b3">${fmt(r.cost)}</td>
      <td>${confirmCell}</td>
    </tr>`;
  });

  const allGames=games.filter(g=>g.cloudProjectId);

  return `<div class="ph"><div><div class="pt">账期云服务成本</div><div class="pd">每月从浑天仪同步云服务成本，按账期 × 游戏应用展示（一个游戏对应一个浑天仪项目）。<b style="color:var(--primary)">由财务对账后确认</b>；确认后该账期对应游戏的 CP 分账方可正常出账。</div></div><div class="acts"><button class="btn g" onclick="alert('原型展示：导出 Excel')">↓ 导出</button></div></div>
  <div class="notice" style="border-color:#d0e8ff;background:#f0f7ff;color:#1a4a80">📋 <b>云服务成本归属：</b>云服务成本以「游戏应用」为单位归集，每个游戏在「游戏管理」中关联唯一的浑天仪项目（1:1）。未关联浑天仪项目的游戏不会产生云服务���本归属。</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0">
    <div style="background:#fff;border:1px solid #e8eaee;border-radius:8px;padding:12px 14px"><div style="font-size:12px;color:var(--muted)">云服务成本合计</div><div style="font-size:20px;font-weight:800;margin-top:4px;color:#7a52b3">${fmt(totalCost)}</div></div>
    <div style="background:#fff;border:1px solid #e8eaee;border-radius:8px;padding:12px 14px"><div style="font-size:12px;color:var(--muted)">已确认</div><div style="font-size:20px;font-weight:800;margin-top:4px;color:var(--green)">${confirmedCnt} 条</div></div>
    <div style="background:#fff;border:1px solid #e8eaee;border-radius:8px;padding:12px 14px"><div style="font-size:12px;color:var(--muted)">待确认</div><div style="font-size:20px;font-weight:800;margin-top:4px;color:var(--orange)">${pendingCnt} 条</div></div>
  </div>
  <div class="filter" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span style="font-size:12px;color:var(--muted)">开始账期</span>
    <select class="select" onchange="window._ccStart=this.value;document.getElementById('contentEl').innerHTML=pgCloudCost()">${allPeriodsAsc.map(p=>`<option value="${p}" ${startF===p?'selected':''}>${p}</option>`).join('')}</select>
    <span style="font-size:12px;color:var(--muted)">结束账期</span>
    <select class="select" onchange="window._ccEnd=this.value;document.getElementById('contentEl').innerHTML=pgCloudCost()">${[...allPeriodsAsc].reverse().map(p=>`<option value="${p}" ${endF===p?'selected':''}>${p}</option>`).join('')}</select>
    <span style="font-size:12px;color:var(--muted);margin-left:12px">游戏</span>
    <select class="select" onchange="window._ccGame=this.value;document.getElementById('contentEl').innerHTML=pgCloudCost()">
      <option value="all" ${gameF==='all'?'selected':''}>全部游戏</option>
      ${allGames.map(g=>`<option value="${g.id}" ${gameF===g.id?'selected':''}>《${g.name}》</option>`).join('')}
    </select>
    <button class="btn g sm" onclick="window._ccStart='2026-04';window._ccEnd='2026-04';window._ccGame='all';document.getElementById('contentEl').innerHTML=pgCloudCost()">重置</button>
  </div>
  ${tbl(['账期','游戏ID','游戏名称','浑天仪项目ID','项目名称','云服务成本','确认状态'],tableRows.length?tableRows:[`<tr><td colspan="7" style="text-align:center;color:var(--weak);padding:20px">暂无数据，请调整筛选条件</td></tr>`],{pageKey:'cloudCost'})}`;
}

/* PAGE: 每日收支对账（每日 T+1 数据，发行商/业务运营对账用）
 * 数据来源：基于 settle 月度数据按日均拆分（mock）
 * 状态语义：
 *   - 已确认：历史账期已结算并确认无异议，数据锁定，作为结算依据
 *   - 预估：当前未出账期数据（T+1 同步），可能因平台后台延迟回吐而变动，不作为结算依据
 * 信息隔离：发行商角色只看本主体的数据；CP 不可见此页面
 */
function pgDailyRecon(){
  const ent=parsedEntity();
  const TODAY='2026-05-15';
  const CUT_MONTH='2026-05'; // 当前未出账期
  const CUT_DAY=12;          // 未出账期已同步到 T+1（5/12 数据）
  const HIST_MONTHS=['2026-04','2026-03','2026-02','2026-01']; // 已结算账期
  const monthDays=(p)=>{const [y,m]=p.split('-').map(Number);return new Date(y,m,0).getDate();};

  if(!window._drStatus)window._drStatus='all';
  if(!window._drStart)window._drStart=`2026-04-01`;
  if(!window._drEnd)window._drEnd=`${CUT_MONTH}-${String(CUT_DAY).padStart(2,'0')}`;
  if(!window._drPlat)window._drPlat='all';

  let baseData=settle;
  if(FILTER_GAME!=='all')baseData=baseData.filter(r=>r.game===games.find(g=>g.id===FILTER_GAME)?.name);
  if(ent.type==='pub')baseData=baseData.filter(r=>r.pub===ent.name);
  if(ent.type==='cp')baseData=[];

  // 生成日级数据：历史账期 → 全月 confirmed；当前账期 → 1~CUT_DAY estimated
  const allRows=[];
  baseData.forEach(r=>{
    const isHist=HIST_MONTHS.includes(r.period);
    const isCur=r.period==='2026-04'; // 用 4 月数据按 80% 缩放模拟当前 5 月数据
    if(isHist){
      const days=monthDays(r.period);
      const weights=Array.from({length:days},(_,i)=>0.55+0.45*Math.sin(i/3.5));
      const wSum=weights.reduce((a,b)=>a+b,0);
      weights.forEach((w,i)=>{
        const d=String(i+1).padStart(2,'0');
        const date=`${r.period}-${d}`;
        const cashRev=Math.round(r.cashRev*w/wSum);
        const vRev=Math.round(r.vRev*w/wSum);
        const cost=Math.round(r.cost*w/wSum);
        allRows.push({date,game:r.game,platform:r.platform,pub:r.pub,cashRev,vRev,cost,profit:cashRev+vRev-cost,status:'confirmed',period:r.period});
      });
    }
    if(isCur){
      // 同一条 4 月 settle 行也用来作为 5 月日级 mock 的基线
      const weights=Array.from({length:CUT_DAY},(_,i)=>0.55+0.45*Math.sin(i/3.5));
      const wSum=weights.reduce((a,b)=>a+b,0);
      weights.forEach((w,i)=>{
        const d=String(i+1).padStart(2,'0');
        const date=`${CUT_MONTH}-${d}`;
        const scale=0.8/30;
        const cashRev=Math.round(r.cashRev*scale*w/wSum*CUT_DAY);
        const vRev=Math.round(r.vRev*scale*w/wSum*CUT_DAY);
        const cost=Math.round(r.cost*scale*w/wSum*CUT_DAY);
        allRows.push({date,game:r.game,platform:r.platform,pub:r.pub,cashRev,vRev,cost,profit:cashRev+vRev-cost,status:'estimated',period:CUT_MONTH});
      });
    }
  });

  let rows=allRows.filter(r=>r.date>=window._drStart&&r.date<=window._drEnd);
  if(window._drPlat!=='all')rows=rows.filter(r=>r.platform===window._drPlat);
  if(window._drStatus!=='all')rows=rows.filter(r=>r.status===window._drStatus);
  rows.sort((a,b)=>a.date===b.date?(a.game+a.platform).localeCompare(b.game+b.platform):b.date.localeCompare(a.date));

  const sum=rows.reduce((s,r)=>{s.cashRev+=r.cashRev;s.vRev+=r.vRev;s.cost+=r.cost;s.profit+=r.profit;return s},{cashRev:0,vRev:0,cost:0,profit:0});
  const inRange=(r)=>r.date>=window._drStart&&r.date<=window._drEnd&&(window._drPlat==='all'||r.platform===window._drPlat);
  const confirmedCnt=allRows.filter(r=>r.status==='confirmed'&&inRange(r)).length;
  const estimatedCnt=allRows.filter(r=>r.status==='estimated'&&inRange(r)).length;

  const tag=(s)=>s==='confirmed'
    ?'<span class="tag" style="background:#e8f7ee;color:var(--green);font-size:11px">✓ 已确认</span>'
    :'<span class="tag" style="background:#fff3e0;color:var(--orange);font-size:11px">⏳ 预估</span>';

  const tableRows=rows.map(r=>`<tr style="${r.status==='estimated'?'background:#fffbf5':''}"><td style="font-family:monospace">${r.date}</td><td>《${r.game}》</td><td>${r.platform}</td><td>${r.pub}</td><td style="font-weight:700">${fmt(r.cashRev)}${r.status==='estimated'?'<span style="color:var(--orange);font-size:10px;margin-left:4px">*</span>':''}</td><td style="color:var(--purple);font-weight:700">${fmt(r.vRev)}${r.status==='estimated'?'<span style="color:var(--orange);font-size:10px;margin-left:4px">*</span>':''}</td><td style="color:var(--red);font-weight:700">${fmt(r.cost)}${r.status==='estimated'?'<span style="color:var(--orange);font-size:10px;margin-left:4px">*</span>':''}</td><td style="font-weight:700;color:${r.profit>=0?'var(--green)':'var(--red)'}">${fmt(r.profit)}</td><td>${tag(r.status)}</td></tr>`);
  const sumRow=`<tr style="background:#f5f7fa;font-weight:800"><td colspan="4">合计（${rows.length} 行）</td><td>${fmt(sum.cashRev)}</td><td style="color:var(--purple)">${fmt(sum.vRev)}</td><td style="color:var(--red)">${fmt(sum.cost)}</td><td style="color:${sum.profit>=0?'var(--green)':'var(--red)'}">${fmt(sum.profit)}</td><td>—</td></tr>`;

  // 日期下拉：覆盖历史账期 + 当前账期 1~CUT_DAY
  const dateList=[];
  HIST_MONTHS.slice().reverse().forEach(p=>{const days=monthDays(p);for(let i=1;i<=days;i++)dateList.push(`${p}-${String(i).padStart(2,'0')}`)});
  for(let i=1;i<=CUT_DAY;i++)dateList.push(`${CUT_MONTH}-${String(i).padStart(2,'0')}`);
  const dateOpts=(selected)=>dateList.map(v=>`<option value="${v}" ${v===selected?'selected':''}>${v}</option>`).join('');

  return `<div class="ph"><div><div class="pt">每日收支对账</div><div class="pd">每日 T+1 同步收入与投放成本数据，方便发行商和业务运营每日对账。历史账期已确认无异议的数据已锁定为「已确认」，未出账期的数据为「预估」，可能因平台后台延迟回吐而变动。</div></div><div class="acts"><button class="btn g" onclick="alert('导出当前对账数据')">↓ 导出</button></div></div>
  <div class="notice" style="border-color:#ffd9b3;background:#fff7ec;color:#8a4b00">⚠ <b>预估数据说明：</b>当前账期（${CUT_MONTH}）尚未出账，T+1 同步的日级数据为预估值（表中以 <span style="color:var(--orange)">*</span> 标记），受平台延迟回吐影响可能存在变动；月度结算后以「发行商分账明细」中的最终数据为准。如发现数据与投放后台差异较大，请联系业务运营线下反馈核查。</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0">
    <div style="background:#fff;border:1px solid #e8eaee;border-radius:8px;padding:12px 14px"><div style="font-size:12px;color:var(--muted)">现金收入合计</div><div style="font-size:20px;font-weight:800;margin-top:4px">${fmt(sum.cashRev)}</div></div>
    <div style="background:#fff;border:1px solid #e8eaee;border-radius:8px;padding:12px 14px"><div style="font-size:12px;color:var(--muted)">广告金收入合计</div><div style="font-size:20px;font-weight:800;margin-top:4px;color:var(--purple)">${fmt(sum.vRev)}</div></div>
    <div style="background:#fff;border:1px solid #e8eaee;border-radius:8px;padding:12px 14px"><div style="font-size:12px;color:var(--muted)">投放成本合计</div><div style="font-size:20px;font-weight:800;margin-top:4px;color:var(--red)">${fmt(sum.cost)}</div></div>
    <div style="background:#fff;border:1px solid #e8eaee;border-radius:8px;padding:12px 14px"><div style="font-size:12px;color:var(--muted)">毛利</div><div style="font-size:20px;font-weight:800;margin-top:4px;color:${sum.profit>=0?'var(--green)':'var(--red)'}">${fmt(sum.profit)}</div></div>
  </div>
  <div class="filter" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span style="font-size:12px;color:var(--muted)">日期：</span>
    <select class="select" onchange="window._drStart=this.value;document.getElementById('contentEl').innerHTML=pgDailyRecon()">${dateOpts(window._drStart)}</select>
    <span style="color:var(--muted)">→</span>
    <select class="select" onchange="window._drEnd=this.value;document.getElementById('contentEl').innerHTML=pgDailyRecon()">${dateOpts(window._drEnd)}</select>
    <span style="font-size:12px;color:var(--muted);margin-left:12px">平台：</span>
    <select class="select" onchange="window._drPlat=this.value;document.getElementById('contentEl').innerHTML=pgDailyRecon()">
      <option value="all" ${window._drPlat==='all'?'selected':''}>全部平台</option>
      ${[...new Set(allRows.map(r=>r.platform))].map(p=>`<option value="${p}" ${window._drPlat===p?'selected':''}>${p}</option>`).join('')}
    </select>
    <span style="font-size:12px;color:var(--muted);margin-left:12px">状态：</span>
    <select class="select" onchange="window._drStatus=this.value;document.getElementById('contentEl').innerHTML=pgDailyRecon()">
      <option value="all" ${window._drStatus==='all'?'selected':''}>全部（已确认 ${confirmedCnt} · 预估 ${estimatedCnt}）</option>
      <option value="confirmed" ${window._drStatus==='confirmed'?'selected':''}>仅已确认</option>
      <option value="estimated" ${window._drStatus==='estimated'?'selected':''}>仅预估</option>
    </select>
    <button class="btn g sm" onclick="window._drStart='2026-04-01';window._drEnd='${CUT_MONTH}-${String(CUT_DAY).padStart(2,'0')}';window._drStatus='all';window._drPlat='all';document.getElementById('contentEl').innerHTML=pgDailyRecon()">重置</button>
  </div>
  <div style="max-height:520px;overflow:auto;margin-top:10px">
    ${tbl(['日期','游戏','平台','发行商','现金收入','广告金收入','投放成本','毛利','状态'],tableRows.concat([sumRow]))}
  </div>
  <div style="margin-top:10px;font-size:12px;color:var(--weak)">* 数据基于 T+1 同步，今日数据预计 ${TODAY} 06:00 前到位；最终结果以「发行商分账明细」结算后数据为准。</div>`;
}

/* PAGE: 发行商分账明细 */

  return pgSettlePubClosed();

/* Tab A：已出账账期（月度汇总） */
function pgSettlePubClosed(){
  const ent=parsedEntity();
  const allPeriodsAsc=[...new Set(settle.map(r=>r.period))].sort();
  const startF=window._spStart||'2026-04';
  const endF=window._spEnd||'2026-04';
  const platF=window._spPlat||'all';
  let data=FILTER_GAME==='all'?settle:settle.filter(r=>r.game===games.find(g=>g.id===FILTER_GAME)?.name);
  if(ent.type==='pub')data=data.filter(r=>r.pub===ent.name);
  if(ent.type==='cp')data=data.filter(r=>r.cp===ent.name);
  data=data.filter(r=>r.period>=startF&&r.period<=endF);
  if(platF!=='all')data=data.filter(r=>r.platform===platF);
  const cashSet=window._cashRevConfirmed||new Set();
  const vSet=window._vRevConfirmed||new Set();
  const costSet=window._costConfirmed||new Set();
  const isReady=(k)=>cashSet.has(k)&&vSet.has(k)&&costSet.has(k);
  const totalPubCash=data.reduce((s,r)=>{
    const k=`${r.period}__${r.game}__${r.platform}`;
    return isReady(k)?s+calcPubSettle(r).pubCash:s;
  },0);
  const totalPubV=data.reduce((s,r)=>{
    const k=`${r.period}__${r.game}__${r.platform}`;
    return isReady(k)?s+calcPubSettle(r).pubV:s;
  },0);
  const rows=data.map(r=>{
    const ps=calcPubSettle(r);
    const key=`${r.period}__${r.game}__${r.platform}`;
    const cashOk=cashSet.has(key);
    const vOk=vSet.has(key);
    const costOk=costSet.has(key);
    const ready=cashOk&&vOk&&costOk;
    const billOk=isBillConfirmed(r.period,r.game,r.platform);
    let confirmCell;
    if(ready){
      confirmCell=billOk
        ?`<span class="tag green" style="font-size:11px">✓ 已出账 · 发行商已确认</span>`
        :`<span class="tag" style="font-size:11px;background:#fff7ec;color:#8a4b00;border:1px solid #ffd9b3">已出账 · 待发行商确认对账单</span>`;
    }else{
      const miss=[];
      if(!cashOk)miss.push('<span style="color:var(--primary)">财务现金</span>');
      if(!vOk)miss.push('<span style="color:var(--purple)">业务广告金</span>');
      if(!costOk)miss.push('<span style="color:var(--orange)">成本</span>');
      confirmCell=`<span class="tag" style="font-size:11px;background:#fff8f0;color:#a05000;border:1px solid #ffe0b2">待${miss.join(' / ')}确认</span>`;
    }
    const dash='<span style="color:var(--weak)">—</span>';
    const rowStyle=ready?'style="background:#f3faf5"':'style="background:#fafafa;color:var(--muted)"';
    const showRev=cashOk&&vOk;
    const showProfit=showRev&&costOk;
    const tierBadge=ps.tierApplied
      ?`<span style="display:inline-block;background:#fff3e0;color:var(--orange);border-radius:8px;padding:0 6px;font-size:10px;margin-left:4px;font-weight:700">阶梯Ⅱ</span>`
      :(ps.rule&&ps.rule.tierEnabled
        ?`<span style="display:inline-block;background:#eef4fb;color:var(--primary);border-radius:8px;padding:0 6px;font-size:10px;margin-left:4px;font-weight:700">阶梯Ⅰ</span>`
        :'');
    const lossTag=(flag)=>flag?`<span style="display:inline-block;background:#ffe9e9;color:var(--red);border-radius:8px;padding:0 6px;font-size:10px;margin-left:4px;font-weight:700">亏损·全划转</span>`:'';
    return `<tr ${rowStyle}>
      <td>${r.period}</td><td>《${r.game}》</td><td>${r.platform}</td><td>${r.pub}</td>
      <td>${cashOk?mn(r.cashRev):dash}</td><td>${vOk?mn(r.vRev):dash}</td>
      <td>${costOk?mn(r.cost):dash}</td><td>${costOk?mn(r.cashCost):dash}</td><td>${costOk?mn(r.vCost):dash}</td>
      <td ${showProfit&&r.cashP<0?'style="color:var(--red);font-weight:700"':''}>${showProfit?mn(r.cashP):dash}</td>
      <td ${showProfit&&r.vP<0?'style="color:var(--red)"':''}>${showProfit?mn(r.vP):dash}</td>
      <td style="font-weight:700">${cashOk?`${ps.rate}%${tierBadge}`:dash}</td>
      <td style="font-weight:800">${ready?mn(ps.pubCash)+lossTag(ps.cashIsLossTransfer):dash}</td>
      <td>${ready?mn(ps.pubV)+lossTag(ps.vIsLossTransfer):dash}</td>
      <td>${confirmCell}</td>
      <td><button class="link" onclick="openDailyDetail('${r.game}__${r.platform}','${r.period}','${r.game}','${r.platform}','${r.pub}')">每日明细</button>${ready&&!billOk&&isPublisher()?`<button class="link" style="margin-left:8px;color:var(--orange);font-weight:700" onclick="confirmBill('${key}')">确认对账单</button>`:''}${ready&&billOk?`<button class="link" style="margin-left:8px" onclick="openBillStatement('${key}')">查看对账单</button>`:''}${ready&&billOk&&['发行商','财务人员','系统管理员'].includes(ROLE)?renderPayActionBtn(r):''}</td>
    </tr>`;
  });
  return `<div class="ph"><div><div class="pt">发行商分账明细</div><div class="pd">展示各发行商当期可结算金额（现金利润 × 发行商分成比例）。</div></div><div class="acts"><button class="btn g" onclick="alert('原型展示：导出 Excel')">↓ 导出</button></div></div>
  <div class="filter" style="margin-bottom:16px">
    <span style="font-size:12px;color:var(--muted);font-weight:650">开始账期</span>

function openDailyDetail(key,period,game,platform,pub){
  // 生成模拟每日数据（基于月度汇总按天拆分）
  const monthData=settle.find(r=>r.game===game&&r.platform===platform&&r.period===period);
  if(!monthData)return;
  const days=30;
  // 按正弦曲线模拟每日波动，使合计与月度一致
  const weights=Array.from({length:days},(_,i)=>0.6+0.4*Math.sin(i/4));
  const wSum=weights.reduce((a,b)=>a+b,0);
  const monthPs=calcPubSettle(monthData);
  const dailyRows=weights.map((w,i)=>{
    const d=String(i+1).padStart(2,'0');
    const date=`${period}-${d}`;
    const cashRev=Math.round(monthData.cashRev*(w/wSum));
    const vRev=Math.round(monthData.vRev*(w/wSum));
    const cost=Math.round(monthData.cost*(w/wSum));
    const cashCost=Math.round(monthData.cashCost*(w/wSum));
    const vCost=Math.round(monthData.vCost*(w/wSum));
    const cashP=cashRev-cashCost;
    const vP=vRev-vCost;
    // 日级 pubCash：按月度方法等比缩放（避免日级亏损虚高）
    const pubCash=Math.round(monthPs.pubCash*(w/wSum));
    return `<tr ${cashP<0?'style="background:#fff8f8"':''}>
      <td style="color:var(--muted)">${date}</td>
      <td>${mn(cashRev)}</td><td>${mn(vRev)}</td>
      <td>${mn(cost)}</td>
      <td ${cashP<0?'style="color:var(--red)"':''}>${mn(cashP)}</td>
      <td ${vP<0?'style="color:var(--red)"':''}>${mn(vP)}</td>
      <td style="font-weight:700 ${pubCash<0?';color:var(--red)':''}}">${mn(pubCash)}</td>
    </tr>`;
  });
  const totCash=Math.round(monthPs.pubCash);
  openModal(`每日分账明细 · 《${game}》${platform} · ${period}`,`
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn g sm" onclick="alert('原型展示：导出每日分账明细 — 《${game}》${platform} · ${period}')">↓ 导出</button></div>
    <div class="kv" style="margin-bottom:14px">
      <span class="k">发行商</span><span class="v">${pub}</span>
      <span class="k">分成比例</span><span class="v">${monthPs.rate}%${monthPs.tierApplied?'（阶梯Ⅱ）':(monthPs.rule&&monthPs.rule.tierEnabled?'（阶梯Ⅰ）':'')}</span>
      <span class="k">月度可结算（现金）</span><span class="v" style="color:var(--primary);font-size:15px;font-weight:800">${mn(totCash)}${monthPs.cashIsLossTransfer?' · <span style="color:var(--red);font-size:11px">亏损全划转</span>':''}</span>
    </div>
    <div style="max-height:420px;overflow:auto">
      ${tbl(['日期','现金收入','广告金收入','总消耗','现金利润','广告金利润','发行商可结算（现金）'],dailyRows)}
    </div>
    <div style="margin-top:10px;font-size:12px;color:var(--weak)">* 每日数据为模拟值，仅供原型演示；实际数据由巨量/微信平台每日同步。</div>`)
}

  if(ent.type==='cp')data=data.filter(r=>r.cp===ent.name);
  const totalCpCash=data.reduce((s,r)=>s+calcCpSettle(r).cpCash,0);
  const totalCpV=data.reduce((s,r)=>s+calcCpSettle(r).cpV,0);
  const totalServer=data.reduce((s,r)=>s+(r.serverCost||0),0);
  const totalCpServer=data.reduce((s,r)=>{const cs=calcCpSettle(r);return s+(cs.shareServer?cs.cashServer:0);},0);
  const rows=data.map(r=>{
    const cs=calcCpSettle(r);
    const noShare=cs.noShare;

    return `<tr ${!cloudOk||noShare?'style="background:#fff8f8"':''}>
      <td>${r.period}</td><td>《${r.game}》</td><td>${r.platform}</td><td>${r.cp}</td>
      <td>${mn(r.cashRev)}</td><td>${mn(r.vRev)}</td>
      <td>${mn(r.cost)}</td>
      <td style="color:#7a52b3">${cloudOk?(cs.shareServer?mn(r.serverCost||0):'<span style="color:var(--weak)">—（规则未配置承担）</span>'):dash}</td>
      <td>${mn(r.cashP)}</td><td>${mn(r.vP)}</td>
      <td style="color:${cs.totalP<0?'var(--red)':'var(--text)'};font-weight:700">${cloudOk?mn(cs.totalP):dash}</td>
      <td style="color:#7a52b3">${cloudOk?mn(cs.cashBase)+' / '+mn(cs.vBase):dash}</td>
      <td style="font-weight:700">${cs.pubRate}% / ${cs.cpRate.toFixed(1)}%<div style="font-size:10.5px;color:var(--muted);font-weight:400;font-family:monospace">(1−${cs.pubRate}%)×${cs.cpRemainShare}%</div></td>
      <td style="font-weight:700">${cloudOk?mn(cs.cpCash)+(noShare?lossTag:''):dash}</td>
      <td>${cloudOk?mn(cs.cpV)+(noShare?lossTag:''):dash}</td>

  <div class="filter"><select class="select"><option>账期：2026-04</option><option>2026-03</option></select></div>
  <div class="g3" style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px">
    <div class="metric"><div class="lb">CP现金利润合计</div><div class="v ${totalCpCash<0?'neg':''}">${fmt(totalCpCash)}</div></div>
    <div class="metric"><div class="lb">CP广告金利润</div><div class="v">${fmt(totalCpV)}</div></div>
    <div class="metric"><div class="lb">CP承担服务器成本（现金侧）</div><div class="v" style="color:#7a52b3">${fmt(totalCpServer)}</div><div class="ft">仅规则开启「CP 承担」时计入</div></div>
  </div>

    <span style="display:inline-block;margin:0 6px"><b>② 广告金</b>：CP 广告金分账 = [ 广告金利润 × (1 − 发行商占比%) ] × <span style="color:var(--green);font-weight:700">CP剩余池占比%</span><span style="color:var(--muted)">（不扣服务器成本）</span></span><br/>
    <span style="display:inline-block;margin:0 6px"><b>③ 总利润 &lt; 0</b>：CP 现金/广告金均为 0（「总利润为负·不分账」标记），亏损由发行商承担</span><br/>
    <span style="display:inline-block;margin:0 6px;color:var(--muted)">服务器成本是否扣减由「<button class="link" style="color:var(--primary);font-size:12.5px" onclick="go('rules')">分成规则配置</button>」中每条规则的「CP 承担服务器成本」开关决定</span>
  </div>
  ${tbl(['账期','游戏','平台','CP','现金收入','广告金收入','总消耗','服务器成本','现金利润','广告金利润','总利润','CP分账基数(现/广)','发行/CP 占比','CP现金分账','CP广告金分账','云成本状态'],rows,{pageKey:'settleCp'})}`;
}

/* PAGE: 账户打款流水 */
function pgBalance(){
  const ent=parsedEntity();
  const platF=window._balPlatF||'all';
  let data=FILTER_GAME==='all'?settle:settle.filter(r=>r.game===games.find(g=>g.id===FILTER_GAME)?.name);
  if(ent.type==='pub')data=data.filter(r=>r.pub===ent.name);
  if(ent.type==='cp')data=data.filter(r=>r.cp===ent.name);
  if(platF!=='all')data=data.filter(r=>r.platform===platF);
  // 三方（财务·业务运营·发行商）全部确认后计入账户打款流水
  const confirmedData=data.filter(r=>isSettleReady(r.period,r.game,r.platform));
  const unconfirmedCnt=data.length-confirmedData.length;
  const rows=confirmedData.map(r=>{
    const ps=calcPubSettle(r);
    const pubCash=ps.pubCash;
    const pubV=ps.pubV;
    const settled=pays.filter(p=>p.game===r.game&&p.platform===r.platform&&p.exec==='打款成功').reduce((s,p)=>s+p.amount,0);
    const inFlight=pays.filter(p=>p.game===r.game&&p.platform===r.platform&&p.exec==='打款中').reduce((s,p)=>s+p.amount,0);
    const bal=pubCash-settled-inFlight;
    const vUsed=Math.round(pubV*0.4*100)/100; // 广告金已消耗（mock：累计分成的40%）
    return {r,pubCash,pubV,vUsed,settled,inFlight,bal};
  });
  const totalPubV=rows.reduce((s,x)=>s+x.pubV,0);
  const totalVUsed=rows.reduce((s,x)=>s+x.vUsed,0);
  const balTab=window._balTab||'cash';
  // 构建现金流水账（Ledger）
  const ledgerEntries=[];
  // 1. 确认结算 → +入金
  confirmedData.forEach(r=>{
    const pubCash=calcPubSettle(r).pubCash;
    const isLoss=pubCash<0;
    ledgerEntries.push({
      date:`${r.period}-28 23:59`,
      pub:r.pub,
      type:isLoss?'账期亏损分摊':'账期结算入金',
      amount:Math.abs(pubCash),
      dir:isLoss?-1:+1,
      remark:`《${r.game}》${r.platform} ${r.period} ${isLoss?'账期亏损（成本超收入）':'账期结算入金'}`,
      sortKey:r.period+'-28 23:59'
    });
  });
  // 2. 打款记录 → 出入金
  let lpdata=FILTER_GAME==='all'?pays:pays.filter(p=>p.game===games.find(g=>g.id===FILTER_GAME)?.name);
  if(ent.type==='pub')lpdata=lpdata.filter(p=>p.pub===ent.name);
  if(ent.type==='cp')lpdata=[];
  if(platF!=='all')lpdata=lpdata.filter(p=>p.platform===platF);
  lpdata.forEach(p=>{
    let type,dir,style='',remark='';
    if(p.exec==='打款成功'){type='打款成功';dir=-1;style='color:var(--red)';remark=`申请单号 ${p.id}`;}
    else if(p.exec==='打款中'){type='打款申请（冻结）';dir=-1;style='color:var(--orange)';remark=`申请单号 ${p.id}`;}
    else return;
    ledgerEntries.push({date:p.time,pub:p.pub,type,amount:p.amount,dir,remark,sortKey:p.time,style});
  });
  // 按时间正序排序
  ledgerEntries.sort((a,b)=>a.sortKey<b.sortKey?-1:a.sortKey>b.sortKey?1:0);
  const vTable=tbl(['账期','游戏','平台','发行商','广告金累计分成','广告金已消耗','最新计算时间'],
    rows.map(({r,pubV,vUsed})=>`<tr>
      <td style="color:var(--muted)">${r.period}</td>
      <td>《${r.game}》</td><td>${r.platform}</td><td>${r.pub}</td>
      <td>${fmt(pubV)}</td><td style="color:var(--muted)">${fmt(vUsed)}</td>
      <td style="color:var(--muted);font-size:12px">2026-04-28 06:16</td></tr>`));
  return `<div class="ph">
    <div><div class="pt">发行商账户流水</div><div class="pd">以发行商为账户维度，展示现金流水账单——结算入账与提款记录按时间排列。</div></div>
    <div class="acts"><button class="btn g" onclick="alert('原型展示：导出 Excel')">↓ 导出</button></div>
  </div>
  <div class="tabs">
    <button class="tab ${balTab==='cash'?'active':''}" onclick="window._balTab='cash';document.getElementById('contentEl').innerHTML=pgBalance()">现金账单</button>
    <button class="tab ${balTab==='v'?'active':''}" onclick="window._balTab='v';document.getElementById('contentEl').innerHTML=pgBalance()">广告金账单</button>
  </div>
  ${balTab==='cash'?`
  ${(()=>{
    // 发行商筛选

    // 时间筛选（默认显示全部）
    const allDates=ledgerEntries.filter(e=>!selPubName||e.pub===selPubName).map(e=>e.date.slice(0,10)).sort();
    const minD=allDates[0]||'2026-01-01';

// 文件名金额解析：取文件名（去后缀）中最后一个数字 token（支持千分位与小数）
function parseAmtFromFilename(name){
  if(!name)return null;
  const base=name.replace(/\.[^.]+$/,'');
  const matches=base.match(/(\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+(?:\.\d+)?)/g);
  if(!matches||!matches.length)return null;
  const last=matches[matches.length-1].replace(/,/g,'');
  const v=parseFloat(last);
  return isNaN(v)?null:v;
}
function onPayFileChange(inputId,hintId){
  const input=document.getElementById(inputId);
  const hint=document.getElementById(hintId);
  if(!input||!hint)return;
  const f=input.files&&input.files[0];
  if(!f){return;}
  const sizeMb=(f.size/1024/1024).toFixed(2);
  if(f.size>10*1024*1024){hint.style.color='var(--red)';hint.textContent=`⚠ ${f.name} 超出 10MB 限制（${sizeMb}MB）`;return;}
  const expect=Number(window._paySettleAmt||0);
  const parsed=parseAmtFromFilename(f.name);
  if(parsed===null){hint.style.color='var(--red)';hint.textContent=`⚠ 未能从文件名识别金额：${f.name}（请在文件名中包含 ${fmt(expect)}）`;return;}
  if(Math.abs(parsed-expect)>0.01){hint.style.color='var(--red)';hint.textContent=`⚠ 文件金额 ${fmt(parsed)} 与本次提款金额 ${fmt(expect)} 不一致：${f.name}`;return;}
  hint.style.color='var(--green)';hint.textContent=`✓ 已选择：${f.name}（${sizeMb}MB） · 金额校验通过 ${fmt(parsed)}`;
}
function submitPay(){
  const expect=Number(window._paySettleAmt||0);
  if(expect<=0){alert('当期可结算金额为 0，无法发起提款');return}
  const inv=document.getElementById('payInvoice');
  const bill=document.getElementById('payBill');
  if(!inv||!inv.files||!inv.files[0]){alert('请上传发票文件');return}
  if(!bill||!bill.files||!bill.files[0]){alert('请上传盖章对账单');return}
  const invAmt=parseAmtFromFilename(inv.files[0].name);
  const billAmt=parseAmtFromFilename(bill.files[0].name);
  if(invAmt===null||Math.abs(invAmt-expect)>0.01){
    alert(`发票文件金额与本次提款金额不一致：\n发票文件：${inv.files[0].name}\n解析金额：${invAmt===null?'未识别':fmt(invAmt)}\n本次提款金额：${fmt(expect)}\n\n请在文件名中正确标注金额后重新上传。`);
    return;
  }
  if(billAmt===null||Math.abs(billAmt-expect)>0.01){
    alert(`盖章对账单金额与本次提款金额不一致：\n对账单文件：${bill.files[0].name}\n解析金额：${billAmt===null?'未识别':fmt(billAmt)}\n本次提款金额：${fmt(expect)}\n\n请在文件名中正确标注金额后重新上传。`);
    return;
  }
  // 写入 pays（带 period），实现"每账期仅一次"
  const selKey=window._paySelKey||'';
  const [period,game,platform]=selKey.split('__');
  const r=settle.find(x=>x.period===period&&x.game===game&&x.platform===platform);
  if(r){
    pays.unshift({
      id:`PAY-${period.replace('-','')}-${String(pays.length+1).padStart(3,'0')}`,
      period,game,platform,pub:r.pub,
      amount:expect,approval:'待审批',exec:'待执行',
      time:new Date().toISOString().slice(0,16).replace('T',' '),
      bpm:'BPM-PAY-NEW',flow:'—',bkFlow:'—',reason:'—',
      invoiceFile:inv.files[0].name,billFile:bill.files[0].name
    });
  }
  closeModal();
  alert(`原型展示：打款申请已提交 ${fmt(expect)}\n发票：${inv.files[0].name}\n盖章对账单：${bill.files[0].name}\n金额校验通过 ✓\n系统将发起 BPM 审批流程，审批通过后银企直联自动转账。`);
  go('payments');
}

  ${tbl(['申请单号','游戏','平台','发行商','打款金额','审批状态','执行状态','发起时间','操作'],rows,{pageKey:'myPayments'})}`;
}

/* PAGE: 票据管理（仅含打款成功的记录，按账期 × 发行商汇总结算金额，并提供发票/对账单查看） */
function pgInvoices(){
  const ent=parsedEntity();
  const allPeriodsAsc=[...new Set(pays.filter(p=>p.exec==='打款成功'&&p.period).map(p=>p.period))].sort();
  const startF=window._invStart||(allPeriodsAsc[0]||'2026-03');
  const endF=window._invEnd||(allPeriodsAsc[allPeriodsAsc.length-1]||'2026-04');
  const pubF=window._invPub||'all';
  let data=pays.filter(p=>p.exec==='打款成功'&&p.period);
  if(FILTER_GAME!=='all'){
    const g=games.find(x=>x.id===FILTER_GAME);
    if(g)data=data.filter(p=>p.game===g.name);
  }
  if(ent.type==='pub')data=data.filter(p=>p.pub===ent.name);
  if(ent.type==='cp')data=[];
  data=data.filter(p=>p.period>=startF&&p.period<=endF);
  if(pubF!=='all')data=data.filter(p=>p.pub===pubF);

  // 按 账期 × 发行商 汇总（保留供下方"涉及发行商/笔数"等指标使用）
  const groupMap=new Map();
  data.forEach(p=>{
    const k=`${p.period}__${p.pub}`;
    if(!groupMap.has(k))groupMap.set(k,{period:p.period,pub:p.pub,items:[],total:0});
    const g=groupMap.get(k);g.items.push(p);g.total+=p.amount;
  });

  // 指标
  const totalAmt=data.reduce((s,p)=>s+p.amount,0);
  const totalCnt=data.length;
  const pubSet=new Set(data.map(p=>p.pub));
  const totalInv=data.filter(p=>p.invoiceFile).length;

  // 发行商筛选选项（基于当前 FILTER_GAME / 时间范围）
  const pubOpts=['<option value="all"'+(pubF==='all'?' selected':'')+'>全部发行商</option>',
    ...[...new Set(data.map(p=>p.pub))].map(n=>`<option value="${n}" ${pubF===n?'selected':''}>${n}</option>`)].join('');

  // 每条申请单一行：账期 / 发行商 / 游戏 / 平台 / 申请单号 / 打款时间 / 银行流水号 / 打款金额 / 票据
  data.sort((a,b)=>a.period<b.period?1:a.period>b.period?-1:(a.pub<b.pub?-1:a.pub>b.pub?1:(a.time<b.time?1:-1)));
  const rows=data.length===0
    ?[`<tr><td colspan="9" style="text-align:center;color:var(--weak);padding:24px">所选条件下暂无已打款成功记录</td></tr>`]
    :data.map(p=>{
      const invBtn=p.invoiceFile?`<button class="link" onclick="openInvoicePreview('${p.id}','invoice')">查看发票</button>`:'<span style="color:var(--weak)">—</span>';
      const billBtn=p.billFile?`<button class="link" style="margin-left:6px" onclick="openInvoicePreview('${p.id}','bill')">查看对账单</button>`:'';
      return `<tr>
        <td>${p.period}</td>
        <td>${p.pub}</td>
        <td>《${p.game}》</td>
        <td>${p.platform}</td>
        <td style="font-family:monospace;font-size:12px;color:var(--muted)">${p.id}</td>
        <td style="color:var(--muted)">${p.time}</td>
        <td style="font-family:monospace;font-size:12px;color:var(--muted)">${p.bkFlow||'—'}</td>
        <td style="text-align:right;font-weight:700">${fmt(p.amount)}</td>
        <td>${invBtn}${billBtn}<button class="link" style="margin-left:6px" onclick="openPayDetail('${p.id}')">申请单详情</button></td>
      </tr>`;
    });

  return `<div class="ph">
    <div><div class="pt">票据管理</div><div class="pd">按账期查看每个发行商已完成结算的金额，并查看打款申请单中提交的发票与盖章对账单。<b style="color:var(--primary)">仅展示「打款成功」的记录</b>。</div></div>
    <div class="acts"><button class="btn g" onclick="alert('原型展示：批量导出票据（含发票与对账单 ZIP 包）')">↓ 导出</button></div>
  </div>
  <div class="g4" style="margin-bottom:14px">
    <div class="metric"><div class="lb">结算金额合计</div><div class="v" style="color:var(--primary)">${fmt(totalAmt)}</div><div class="ft">账期 ${startF} ~ ${endF}</div></div>
    <div class="metric"><div class="lb">已结算笔数</div><div class="v">${totalCnt}</div><div class="ft">打款成功的申请单</div></div>
    <div class="metric"><div class="lb">涉及发行商</div><div class="v">${pubSet.size}</div><div class="ft">主体数量</div></div>
    <div class="metric"><div class="lb">发票归档</div><div class="v">${totalInv} / ${totalCnt}</div><div class="ft">已上传发票笔数</div></div>
  </div>
  <div class="filter" style="margin-bottom:16px">
    <span style="font-size:12px;color:var(--muted);font-weight:650">开始账期</span>
    <select class="select" onchange="window._invStart=this.value;document.getElementById('contentEl').innerHTML=pgInvoices()">
      ${allPeriodsAsc.map(p=>`<option value="${p}" ${startF===p?'selected':''}>${p}</option>`).join('')}
    </select>
    <span style="font-size:12px;color:var(--muted);font-weight:650">结束账期</span>
    <select class="select" onchange="window._invEnd=this.value;document.getElementById('contentEl').innerHTML=pgInvoices()">
      ${allPeriodsAsc.map(p=>`<option value="${p}" ${endF===p?'selected':''}>${p}</option>`).join('')}
    </select>
    <span style="font-size:12px;color:var(--muted);font-weight:650;margin-left:8px">发行商</span>
    <select class="select" onchange="window._invPub=this.value;document.getElementById('contentEl').innerHTML=pgInvoices()">${pubOpts}</select>
  </div>
  ${tbl(['账期','发行商','游戏','平台','申请单号','打款时间','银行流水号','打款金额','票据'],rows,{pageKey:'invoices'})}`;
}

  <div class="sec-title">收款账户</div>
  <div class="kv"><span class="k">账户名称</span><span class="v">${pub?pub.accName:'—'}</span><span class="k">开户银行</span><span class="v">${pub?pub.bank:'—'}</span><span class="k">银行账号</span><span class="v" style="font-family:monospace">${pub?'****'+pub.acc:'—'}</span></div>

  ${masked==='打款成功'?'<div style="margin-top:14px"><button class="btn g" onclick="alert(\'下载电子回单（Mock）\')">↓ 下载电子回单</button></div>':''}`)
}

  const isFail=p.exec==='打款失败';

    ?`<div class="alert">⚠ 打款失败原因：${p.reason}<div style="margin-top:6px;font-size:12px;color:var(--muted)">⚠ 此状态对发行商<b>不可见</b>（脱敏为「打款中」）。财务可发起「重新打款」生成新单（自动关联本单号），新单成功后发行商视图自动翻转为「打款成功」；如失败需修改申请单内容（账户/金额等），可点击「终止流程」释放该账期占用，修正后重新发起。</div></div>`
    :(isTerm?`<div class="alert" style="background:#f0f0f0;border-color:#ccc;color:#444">🛑 该申请单已被终止${p.terminatedBy?`（操作人：${p.terminatedBy}`:''}${p.terminatedAt?` · ${p.terminatedAt}）`:'）'}<div style="margin-top:6px;font-size:12px;color:var(--muted)">该账期占用已释放，可重新发起申请。原失败原因：${p.reason||'—'}</div></div>`:'');
  const footActs=[];
  if(p.exec==='打款成功')footActs.push(`<button class="btn g" onclick="alert('下载电子回单（Mock）')">↓ 下载电子回单</button>`);
  if(isFail&&finView){
    footActs.push(`<button class="btn p" onclick="closeModal();openRepay('${p.id}')">↻ 重新打款</button>`);
    footActs.push(`<button class="btn g" style="border-color:#a04000;color:#a04000" onclick="closeModal();terminatePay('${p.id}')">🛑 终止流程</button>`);
  }

  openModal(`打款申请详情：${p.id}（财务内部视图）`,`${failBanner}

    ${[['提交申请','done'],['BPM审批',p.approval==='待审批'?'act':'done'],['银企打款',p.exec==='打款中'?'act':p.exec==='打款成功'?'done':p.exec==='打款失败'?'done':''],['完成',p.exec==='打款成功'?'done':'']].map((s,i)=>(i>0?'<div class="sline"></div>':'')+`<div class="step ${s[1]}"><span class="sc">${s[1]==='done'?'✓':(i+1)}</span>${s[0]}</div>`).join('')}

  <div class="sec-title">收款账户快照（提交时锁定）</div>
  <div class="kv"><span class="k">账户名称</span><span class="v">${pub?pub.accName:'—'}</span><span class="k">开户银行</span><span class="v">${pub?pub.bank:'—'}</span><span class="k">银行账号</span><span class="v" style="font-family:monospace">${pub?'****'+pub.acc:'—'}</span><span class="k">联行号</span><span class="v" style="font-family:monospace">${pub?pub.bankNo:'—'}</span></div>

    if(!filename){return `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed var(--line2);border-radius:6px;background:#fafbfc;color:var(--weak);font-size:12.5px">

      <span style="flex:1"><b style="color:var(--muted)">${label}</b><div style="font-size:11.5px;color:var(--weak);margin-top:2px">未上传</div></span>
    </div>`;}
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid ${color.border};border-radius:6px;background:${color.bg}">
      <span style="font-size:20px">${type==='invoice'?'🧾':'📋'}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:12.5px;color:${color.label};font-weight:700">${label}</div>
        <div style="font-family:monospace;font-size:12px;color:${color.file};margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${filename}</div>
      </div>
      <button class="btn g sm" onclick="openInvoicePreview('${p.id}','${type}')">预览</button>
      <button class="btn g sm" onclick="alert('下载（Mock）：${filename}')">下载</button>
    </div>`;
  };
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    ${item('发票文件',p.invoiceFile,'invoice',{border:'#cfe0f5',bg:'#f0f7ff',label:'#1a4a80',file:'#31557d'})}
    ${item('对账单文件',p.billFile,'bill',{border:'#c6e6d6',bg:'#f0faf5',label:'#0d4a2e',file:'#1a6a3e'})}

}

/* 财务：失败单重新打款 */
function terminatePay(payId){
  if(!canFin()){alert('当前角色无权终止打款流程');return}
  const p=pays.find(x=>x.id===payId);
  if(!p){alert('未找到打款单');return}
  if(p.exec!=='打款失败'){alert('仅「打款失败」的申请单可以终止');return}
  closeModal();
  confirmDialog('确认终止打款流程',
    `即将终止打款申请单 <b style="font-family:monospace">${p.id}</b>。<br/><br/>
     <div style="background:#fff8f0;border:1px solid #ffe0b2;color:#a05000;padding:10px;border-radius:6px;font-size:12.5px">
       <b>失败原因：</b>${p.reason||'—'}<br/>
       <b>失败金额：</b>${fmt(p.amount)}
     </div>
     <div style="margin-top:10px;font-size:12.5px;color:#444">
       适用于<b>需要修正申请单内容</b>的失败场景（如对方账户/联行号填错、金额需调整等）。终止后该账期占用将释放，可重新发起申请。<br/>
       <span style="color:var(--orange)">⚠ 请先到「发行商主体管理」修正账户/对账材料后，再到「发行商分账明细」对应账期重新发起。</span>
     </div>`,
    function(){
      p.exec='已终止';
      p.terminatedAt=new Date().toISOString().slice(0,16).replace('T',' ');
      p.terminatedBy=(SESSION&&SESSION.display)||ROLE;
      document.getElementById('contentEl').innerHTML=pgPayments();
      alert(`原型展示：申请单 ${p.id} 已终止。\n该账期占用已释放，请先修正账户信息后重新发起申请。`);
    },'确认终止','d');
}
function openRepay(origId){
  if(!canFin()){alert('当前角色无权处理失败打款');return}
  const p=pays.find(x=>x.id===origId);
  if(!p){alert('原单不存在');return}
  const pub=publishers.find(x=>x.name===p.pub);
  const newId='PAY-'+(new Date()).toISOString().slice(0,7).replace('-','')+'-R'+Math.floor(Math.random()*900+100);
  const body=`<div class="alert">⚠ 原单失败原因：${p.reason}<div style="margin-top:4px;font-size:12px;color:var(--muted)">请先与发行商核实账户/联行号，必要时在「发行商主体管理」更新银行信息后再重发。</div></div>
    <div class="sec-title">原打款申请单</div>
    <div class="kv"><span class="k">原申请单号</span><span class="v" style="font-family:monospace">${p.id}</span><span class="k">游戏</span><span class="v">《${p.game}》</span><span class="k">平台</span><span class="v">${p.platform}</span><span class="k">发行商</span><span class="v">${p.pub}</span><span class="k">原打款金额</span><span class="v">${fmt(p.amount)}</span></div>
    <div class="sec-title">新打款单（关联原单 ${p.id}）</div>
    <div class="form-grid">
      <div class="field"><label>新申请单号</label><input class="input" style="width:100%" value="${newId}" disabled/></div>
      <div class="field"><label>打款金额 <span class="req">*</span></label><input class="input" type="number" id="repayAmt" style="width:100%" value="${p.amount}"/></div>
      <div class="field" style="grid-column:1/-1"><label>处理说明 <span class="req">*</span></label><input class="input" id="repayMemo" style="width:100%" placeholder="例如：已与发行商确认联行号变更，重发本笔款项"/></div>
    </div>
    <div class="sec-title">收款账户（当前最新）</div>
    <div class="kv"><span class="k">账户名称</span><span class="v">${pub?pub.accName:'—'}</span><span class="k">开户银行</span><span class="v">${pub?pub.bank:'—'}</span><span class="k">银行账号</span><span class="v" style="font-family:monospace">${pub?'****'+pub.acc:'—'}</span><span class="k">联行号</span><span class="v" style="font-family:monospace">${pub?pub.bankNo:'—'}</span></div>
    <div class="notice" style="margin-top:8px">提交后将生成新单并自动走 BPM 审批流程；原单状态保持「打款失败」用于审计追溯，新单与原单通过「关联原单号」字段双向关联。</div>`;
  const foot=`<button class="btn g" onclick="closeModal()">取消</button><button class="btn p" onclick="submitRepay('${p.id}','${newId}')">提交重新打款</button>`;
  openModal(`重新打款（财务处理） · 原单 ${p.id}`,body,foot);
}
function submitRepay(origId,newId){
  const amt=parseFloat((document.getElementById('repayAmt')||{}).value)||0;
  const memo=(document.getElementById('repayMemo')||{}).value||'';
  if(!amt){alert('请填写打款金额');return}
  if(!memo.trim()){alert('请填写处理说明（用于审计）');return}
  const orig=pays.find(x=>x.id===origId);
  if(orig){
    pays.unshift({id:newId,game:orig.game,platform:orig.platform,pub:orig.pub,amount:amt,approval:'待审批',exec:'待执行',time:new Date().toISOString().slice(0,16).replace('T',' '),bpm:'BPM-PAY-R'+Math.floor(Math.random()*9000+1000),flow:'—',bkFlow:'—',reason:'—',relateId:origId,memo:memo});
  }

function pgUserMgmt(){
  const kw=(window._userKw||'').trim().toLowerCase();
  const stF=window._userStF||'all';
  const data=USER_DB.filter(u=>{
    if(kw&&!u.display.toLowerCase().includes(kw)&&!u.account.toLowerCase().includes(kw)&&!u.phone.includes(kw))return false;
    if(stF!=='all'&&u.status!==stF)return false;
    return true;
  });
  const pendingCnt=USER_DB.filter(u=>u.status==='待授权').length;
  const rows=data.map(u=>{
    const isPending=u.status==='待授权';
    const avatarColor=isPending?'#9aacbf':'var(--primary)';
    const roleTag=u.role?ts2(u.role):'<span class="tag gray">未分配</span>';
    const dataTag=(()=>{
      if(!u.dataPerms||!u.dataPerms.length)return '<span class="tag gray">无</span>';
      if(u.dataPerms.includes('all'))return '<span class="tag blue">全部数据</span>';
      const items=u.dataPerms.map(p=>{
        const it=parseDataPerm(p);
        if(!it||it.kind!=='gp')return null;
        const g=games.find(x=>x.id===it.gameId);
        return g?{game:g.name,platform:it.platform}:null;
      }).filter(Boolean);
      if(!items.length)return '<span class="tag gray">无</span>';
      const max=2;
      const shown=items.slice(0,max).map(it=>`<span class="tag purple" style="font-size:11px;margin-right:4px">《${it.game}》·${it.platform}</span>`).join('');
      const more=items.length>max?`<span class="tag gray" style="font-size:11px" title="${items.map(it=>'《'+it.game+'》·'+it.platform).join('，')}">+${items.length-max}</span>`:'';
      return `<div style="display:flex;flex-wrap:wrap;gap:2px;align-items:center">${shown}${more}</div>`;
    })();
    return `<tr>
      <td>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:32px;height:32px;border-radius:50%;background:${avatarColor};color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0">${u.display.slice(0,1)}</div>

        </div>
      </td>
      <td>${u.phone}</td>
      <td><span class="tag ${u.loginType==='sso'?'blue':'green'}" style="font-size:11px">${u.loginType==='sso'?'企业SSO':'手机号'}</span></td>
      <td>${roleTag}</td>
      <td>${dataTag}</td>
      <td>${ts(u.status)}</td>
      <td style="color:var(--muted);font-size:12px">${u.lastLogin}</td>
      <td>
        <button class="btn g sm" onclick="openGrantRole('${u.id}')" style="${isPending?'border-color:var(--primary);color:var(--primary);font-weight:700':''}">配置角色</button>
        <button class="btn g sm" onclick="openGrantData('${u.id}')" style="margin-left:4px" ${!u.role?'disabled':''}>配置数据权限</button>
      </td>
    </tr>`;
  });
  const tableOrEmpty=rows.length?tbl(['用户','手机号','登录方式','角色','数据权限','状态','最后登录','操作'],rows,{pageKey:'userMgmt'}):
    `<div class="card" style="padding:40px;text-align:center;color:var(--muted)">暂无匹配用户</div>`;
  return `<div class="ph">
    <div><div class="pt">用户管理</div><div class="pd">管理所有登录用户的角色与数据权限，首次登录的用户需在此授权后方可使用系统</div></div>
    <div class="acts">${pendingCnt?`<span class="tag red" style="font-size:12px">⚠ ${pendingCnt} 个用户待授权</span>`:''}</div>
  </div>
  <div class="filter">
    <input class="input" placeholder="搜索姓名/账号/手机号" style="width:220px" value="${kw}" oninput="window._userKw=this.value;renderPage()">
    <select class="select" onchange="window._userStF=this.value;renderPage()">
      <option value="all" ${stF==='all'?'selected':''}>全部状态</option>
      <option value="已授权" ${stF==='已授权'?'selected':''}>已授权</option>
      <option value="待授权" ${stF==='待授权'?'selected':''}>待授权</option>
    </select>
    <span style="color:var(--muted);font-size:12px">共 ${USER_DB.length} 个用户，筛选结果 ${data.length} 条</span>
  </div>
  ${tableOrEmpty}`;
