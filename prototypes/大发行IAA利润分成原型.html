  if(!window._dpState.selected){
    const u=USER_DB.find(x=>x.id===window._dpState.uid);
    const cur=(u&&u.dataPerms||[]).filter(x=>typeof x==='string'&&x.startsWith('gp:')).map(x=>x.slice(3));
    window._dpState.selected=new Set(cur);
  }
  document.querySelectorAll('.dpCheck').forEach(cb=>{
    const v=cb.value.replace(/^gp:/,'');
    if(cb.checked)window._dpState.selected.add(v);
    else window._dpState.selected.delete(v);
  });
}

function _dpRerender(){
  _dpCollectChecks();
  const el=document.getElementById('dpSpecific');
  if(el)el.innerHTML=renderDpPanel();
}

function renderDpPanel(){
  const st=window._dpState;const u=USER_DB.find(x=>x.id===st.uid);
  // 组合行：game × platform
  const rows=[];
  games.forEach(g=>{
    const platforms=[...new Set(pubMappings.filter(m=>m.gameId===g.id).map(m=>m.platform))];
    platforms.forEach(pf=>{
      const pubs=[...new Set(pubMappings.filter(m=>m.gameId===g.id&&m.platform===pf).map(m=>m.pub))].join(' · ');
      rows.push({gameId:g.id,gameName:g.name,platform:pf,pubs,v:`${g.id}__${pf}`});
    });
  });
  // 筛选
  const kw=(st.kw||'').trim().toLowerCase();
  let filtered=rows.filter(r=>{
    if(kw&&!r.gameName.toLowerCase().includes(kw)&&!r.gameId.toLowerCase().includes(kw))return false;
    if(st.gameF!=='all'&&r.gameId!==st.gameF)return false;
    if(st.platF!=='all'&&r.platform!==st.platF)return false;
    return true;
  });
  // 选中集合：优先用 state 维护的 selected；否则取 u.dataPerms
  if(!st.selected){
    const cur=(u.dataPerms||[]).filter(x=>typeof x==='string'&&x.startsWith('gp:')).map(x=>x.slice(3));
    st.selected=new Set(cur);
  }
  const total=filtered.length;
  const totalPages=Math.max(1,Math.ceil(total/st.pageSize));
  if(st.page>totalPages)st.page=totalPages;
  const start=(st.page-1)*st.pageSize;
  const pageRows=filtered.slice(start,start+st.pageSize);
  const selectedOnPage=pageRows.filter(r=>st.selected.has(r.v)).length;
  const allOnPageChecked=pageRows.length>0&&selectedOnPage===pageRows.length;

  const tableBody=pageRows.length?pageRows.map(r=>{
    const checked=st.selected.has(r.v);
    return `<tr>
      <td style="width:40px;text-align:center"><input type="checkbox" class="dpCheck" value="gp:${r.v}" ${checked?'checked':''} style="accent-color:var(--primary)"></td>
      <td style="font-family:monospace;font-size:11.5px;color:var(--muted)">${r.gameId}</td>
      <td><b>《${r.gameName}》</b></td>
      <td>${r.platform}</td>
      <td style="color:var(--muted);font-size:12px">${r.pubs||'—'}</td>
    </tr>`;
  }).join(''):'<tr><td colspan="5" style="text-align:center;color:var(--weak);padding:20px">无匹配的游戏-平台组合</td></tr>';

  const gameOpts=games.map(g=>`<option value="${g.id}" ${st.gameF===g.id?'selected':''}>${g.name}</option>`).join('');
  const platList=[...new Set(rows.map(r=>r.platform))];
  const platOpts=platList.map(p=>`<option value="${p}" ${st.platF===p?'selected':''}>${p}</option>`).join('');

  // 分页按钮
  const pageBtn=(n,label,disabled)=>`<button class="btn g sm" ${disabled?'disabled':''} onclick="window._dpState.page=${n};_dpRerender()">${label}</button>`;
  const pager=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)">
    <div>共 <b>${total}</b> 条（已选 <b style="color:var(--primary)">${st.selected.size}</b> 条）</div>
    <div style="display:flex;align-items:center;gap:6px">
      ${pageBtn(1,'« 首页',st.page===1)}
      ${pageBtn(Math.max(1,st.page-1),'‹ 上一页',st.page===1)}
      <span style="padding:0 8px">第 <b>${st.page}</b> / ${totalPages} 页</span>
      ${pageBtn(Math.min(totalPages,st.page+1),'下一页 ›',st.page===totalPages)}
      ${pageBtn(totalPages,'末页 »',st.page===totalPages)}
    </div>
  </div>`;

  return `<div class="sec-title" style="margin-top:0">按游戏 × 平台勾选</div>
    <div class="filter" style="margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <input class="input" id="dpKwInput" style="width:180px" placeholder="搜索游戏名称 / ID…" value="${st.kw||''}" oninput="window._dpState.kw=this.value;window._dpState.page=1;_dpRerender();const i=document.getElementById('dpKwInput');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}"/>
      <select class="select" onchange="window._dpState.gameF=this.value;window._dpState.page=1;_dpRerender()"><option value="all" ${st.gameF==='all'?'selected':''}>全部游戏</option>${gameOpts}</select>
      <select class="select" onchange="window._dpState.platF=this.value;window._dpState.page=1;_dpRerender()"><option value="all" ${st.platF==='all'?'selected':''}>全部平台</option>${platOpts}</select>
      <button class="btn g sm" onclick="_dpCollectChecks();[...document.querySelectorAll('.dpCheck')].forEach(cb=>{cb.checked=true;window._dpState.selected.add(cb.value.replace(/^gp:/,''))});_dpRerender()" title="全选当前页">✓ 本页全选</button>
      <button class="btn g sm" onclick="_dpCollectChecks();[...document.querySelectorAll('.dpCheck')].forEach(cb=>{cb.checked=false;window._dpState.selected.delete(cb.value.replace(/^gp:/,''))});_dpRerender()" title="清空当前页">✕ 本页清空</button>
      <button class="btn g sm" onclick="if(confirm('确认清空全部勾选？')){window._dpState.selected=new Set();_dpRerender()}">清空全部</button>
    </div>
    <div class="tw" style="max-height:320px;overflow:auto"><table class="table" style="margin:0"><thead><tr>
      <th style="width:40px;text-align:center"><input type="checkbox" ${allOnPageChecked?'checked':''} onchange="_dpCollectChecks();const on=this.checked;[...document.querySelectorAll('.dpCheck')].forEach(cb=>{cb.checked=on;if(on)window._dpState.selected.add(cb.value.replace(/^gp:/,''));else window._dpState.selected.delete(cb.value.replace(/^gp:/,''))});_dpRerender()"></th>
      <th>游戏ID</th><th>游戏名称</th><th>平台</th><th>发行商</th>
    </tr></thead><tbody>${tableBody}</tbody></table></div>
    ${pager}`;
}
function dpAllToggle(cb){const sp=document.getElementById('dpSpecific');sp.style.opacity=cb.checked?'.4':'1';sp.style.pointerEvents=cb.checked?'none':'auto';}
function confirmGrantData(uid){
  const u=USER_DB.find(u=>u.id===uid);if(!u)return;
  const allCb=document.getElementById('dpAll');
  if(allCb.checked){u.dataPerms=['all'];}
  else{
    _dpCollectChecks();
    const sel=(window._dpState&&window._dpState.selected)||new Set();
    u.dataPerms=[...sel].map(v=>'gp:'+v);
  }
  closeModal();renderPage();
}
